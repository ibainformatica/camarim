<style>
  :root{
    --bg:#f5f4f3;
    --surface:#ffffff;
    --surface-2:#eae7e7;
    --surface-3:#dcd9d9;
    --ink:#1b1a1a;
    --ink-muted:#6d6a6b;
    --ink-faint:#939597;
    --accent:#89162f;
    --accent-ink:#ffffff;
    --accent-soft:#f2dee2;
    --secondary:#3d3a3b;
    --secondary-soft:#e6e4e4;
    --line:#e3e0e0;
    --success:#3f7a52;
    --success-soft:#dcead9;
    --warning:#c0742a;
    --warning-soft:#f3e2c9;
    --critical:#b3261e;
    --critical-soft:#f6dbd8;
    --info:#2f6fb0;
    --info-soft:#dce8f5;
    --neutral-chip:#6a6668;
    --neutral-chip-soft:#e7e4e4;
    --shadow: 0 1px 2px rgba(20,18,19,.07), 0 6px 20px -8px rgba(20,18,19,.20);
    --radius: 14px;
    --radius-sm: 9px;
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-brand: "Cinzel", "Fraunces", Georgia, serif;
    --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  /* Camarim sempre mostra a identidade do Instituto de Belas Artes
     (bordô, grafite e branco), independentemente do tema claro/escuro do
     sistema — não há um tema quase-preto. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#f5f4f3;
      --surface:#ffffff;
      --surface-2:#eae7e7;
      --surface-3:#dcd9d9;
      --ink:#1b1a1a;
      --ink-muted:#6d6a6b;
      --ink-faint:#939597;
      --accent:#89162f;
      --accent-ink:#ffffff;
      --accent-soft:#f2dee2;
      --secondary:#3d3a3b;
      --secondary-soft:#e6e4e4;
      --line:#e3e0e0;
      --success:#3f7a52;
      --success-soft:#dcead9;
      --warning:#c0742a;
      --warning-soft:#f3e2c9;
      --critical:#b3261e;
      --critical-soft:#f6dbd8;
      --info:#2f6fb0;
      --info-soft:#dce8f5;
      --neutral-chip:#6a6668;
      --neutral-chip-soft:#e7e4e4;
      --shadow: 0 1px 2px rgba(20,18,19,.07), 0 6px 20px -8px rgba(20,18,19,.20);
    }
  }
  :root[data-theme="dark"]{
    --bg:#f5f4f3;
    --surface:#ffffff;
    --surface-2:#eae7e7;
    --surface-3:#dcd9d9;
    --ink:#1b1a1a;
    --ink-muted:#6d6a6b;
    --ink-faint:#939597;
    --accent:#89162f;
    --accent-ink:#ffffff;
    --accent-soft:#f2dee2;
    --secondary:#3d3a3b;
    --secondary-soft:#e6e4e4;
    --line:#e3e0e0;
    --success:#3f7a52;
    --success-soft:#dcead9;
    --warning:#c0742a;
    --warning-soft:#f3e2c9;
    --critical:#b3261e;
    --critical-soft:#f6dbd8;
    --info:#2f6fb0;
    --info-soft:#dce8f5;
    --neutral-chip:#6a6668;
    --neutral-chip-soft:#e7e4e4;
    --shadow: 0 1px 2px rgba(20,18,19,.07), 0 6px 20px -8px rgba(20,18,19,.20);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  h1,h2,h3,h4{
    font-family:var(--font-display);
    font-weight:600;
    margin:0;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  p{margin:0;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  ::-webkit-scrollbar{height:10px;width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}

  .app-shell{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:14px;
    padding:12px 20px;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-brand); font-weight:700; font-size:1.2rem;
    cursor:pointer; user-select:none; background:none; border:none; color:var(--ink); padding:2px 0;
  }
  .brand .mark{
    display:block; width:26px; height:auto; flex:none;
  }
  .brand-text{display:flex; flex-direction:column; align-items:flex-start; gap:1px; line-height:1.15;}
  .brand-name{font-family:var(--font-brand); font-weight:600; font-size:1.02rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink);}
  .brand .tag{font-family:var(--font-body); font-weight:600; font-size:.62rem; color:var(--ink-faint); letter-spacing:.09em; text-transform:uppercase;}
  .crumb{
    display:flex; align-items:center; gap:8px; color:var(--ink-muted); font-size:.85rem; font-weight:500;
  }
  .crumb .sep{color:var(--ink-faint);}
  .crumb .current{color:var(--ink);}
  .crumb-home{
    border:none; background:none; padding:0; margin:0; cursor:pointer;
    font:inherit; color:var(--ink-muted); text-decoration:none;
  }
  .crumb-home:hover{color:var(--ink);}
  .topbar-spacer{flex:1;}
  .lang-toggle{
    display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface);
  }
  .lang-toggle button{
    border:none; background:transparent; color:var(--ink-muted); padding:6px 13px; font-size:.78rem; font-weight:600;
    letter-spacing:.03em; cursor:pointer; transition:background .15s, color .15s;
  }
  .lang-toggle button.active{background:var(--accent); color:var(--accent-ink);}
  .home-link-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-muted);
    border-radius:999px; padding:6px 14px; font-size:.8rem; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:border-color .15s, color .15s;
  }
  .home-link-btn:hover{border-color:var(--accent); color:var(--ink);}
  @media (max-width:640px){
    .topbar{padding:10px 12px; gap:8px;}
    .crumb{display:none;}
    .home-link-btn #manageDataLabel{display:none;}
    .home-link-btn{padding:8px;}
  }

  main{flex:1; width:100%;}
  .page{max-width:1180px; margin:0 auto; padding:28px 20px 80px;}
  .page-header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin-bottom:22px;
  }
  .page-header h1{font-size:1.9rem;}
  .page-header .sub{color:var(--ink-muted); font-size:.92rem; margin-top:4px;}
  .eyebrow{
    font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--accent);
    margin-bottom:6px; display:block;
  }

  /* ---------- Buttons / inputs ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:7px; justify-content:center;
    border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:9px 16px; font-size:.85rem; font-weight:600; cursor:pointer;
    transition:transform .12s ease, border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:active{transform:scale(.97);}
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .card:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.05); border-color:var(--accent);}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-ghost:hover{background:var(--surface-2); border-color:transparent;}
  .btn-danger{color:var(--critical); border-color:var(--critical-soft); background:var(--critical-soft);}
  .btn-sm{padding:5px 11px; font-size:.76rem; border-radius:8px;}
  .btn-icon{padding:8px; border-radius:9px;}

  input[type=text], input[type=date], input[type=number], input[type=search], textarea, select{
    font-family:var(--font-body); font-size:.86rem; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    padding:8px 11px; width:100%;
  }
  textarea{resize:vertical; min-height:60px;}
  label{font-size:.74rem; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .field-row{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}

  /* ---------- Home ---------- */
  .hero{
    padding:64px 20px 40px; text-align:center; position:relative; overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; inset:0; z-index:-1;
    background:
      radial-gradient(560px 280px at 50% -10%, var(--accent-soft), transparent 70%);
    opacity:.9;
  }
  .hero .eyebrow{display:inline-block; margin:0 auto 14px;}
  .hero h1{font-family:var(--font-brand); font-size:clamp(2rem, 4.6vw, 3.1rem); font-weight:700; letter-spacing:.01em;}
  .hero p.lead{max-width:520px; margin:16px auto 0; color:var(--ink-muted); font-size:1rem;}
  .home-grid{
    max-width:920px; margin:36px auto 0; padding:0 20px;
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px;
  }
  @media (max-width:640px){ .home-grid{grid-template-columns:1fr;} }
  .nav-card{
    text-align:left; display:flex; gap:16px; align-items:flex-start;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; cursor:pointer; box-shadow:var(--shadow);
    transition:transform .16s ease, border-color .16s ease;
    color:var(--ink);
  }
  .nav-card:hover{transform:translateY(-3px); border-color:var(--accent);}
  .nav-card .num{
    font-family:var(--font-display); font-size:.78rem; font-weight:700; color:var(--ink-faint);
    letter-spacing:.06em;
  }
  .nav-card .icon{
    flex:none; width:46px; height:46px; border-radius:11px; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .nav-card .icon svg{width:24px; height:24px;}
  .nav-card h3{font-size:1.12rem; margin-bottom:4px;}
  .nav-card p{color:var(--ink-muted); font-size:.83rem; line-height:1.45;}

  /* ---------- Cards / tables / lists ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .toolbar .search{max-width:260px;}
  .toolbar-label{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); white-space:nowrap;}
  .toolbar select{width:auto; max-width:220px;}
  .chipbar{display:flex; gap:7px; flex-wrap:wrap;}
  .chip{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-muted);
    border-radius:999px; padding:5px 13px; font-size:.76rem; font-weight:600; cursor:pointer;
    transition:all .12s ease;
  }
  .chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .chip .count{opacity:.6; margin-left:4px; font-variant-numeric:tabular-nums;}

  table{width:100%; border-collapse:collapse;}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
  th{
    text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
    font-weight:700; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  td{padding:11px 14px; border-bottom:1px solid var(--line); font-size:.86rem; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}
  /* ---------- Site-wide "click to edit" standard ----------
     Every row/card that represents one editable record (actors, inventory
     items, calendar events, archived events) opens its edit screen on a
     click anywhere on it, not just on a small pencil icon — the pencil
     stays only as a visible hint that the row is clickable. Buttons for a
     DIFFERENT action (delete, archive, duplicate, navigate) stop the click
     from bubbling up, so they still do their own thing. */
  .row-clickable{cursor:pointer;}
  .card-clickable{cursor:pointer; transition:transform .14s ease, border-color .14s ease;}
  .card-clickable:hover{transform:translateY(-2px); border-color:var(--accent);}

  .pill{
    display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 10px;
    font-size:.72rem; font-weight:700; white-space:nowrap; letter-spacing:.01em;
    background:var(--neutral-chip-soft); color:var(--neutral-chip);
  }
  .pill.success{background:var(--success-soft); color:var(--success);}
  .pill.warning{background:var(--warning-soft); color:var(--warning);}
  .pill.critical{background:var(--critical-soft); color:var(--critical);}
  .pill.accent{background:var(--accent-soft); color:var(--accent);}
  .pill-btn{border:none; cursor:pointer;}

  .avatar-tag{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border-radius:999px;
    padding:3px 10px; font-size:.76rem; font-weight:600;
  }
  .avatar-tag .dot{width:20px; height:20px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:.65rem; font-weight:700;}
  .avatar-tag.ghost{background:var(--neutral-chip-soft); color:var(--ink-faint); font-style:italic;}

  .play-tag-list{display:flex; flex-wrap:wrap; gap:6px;}
  .play-tag{
    display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 11px 4px 9px;
    font-size:.76rem; font-weight:600; cursor:pointer; border:1px solid transparent;
    background:var(--neutral-chip-soft); color:var(--ink);
  }
  .play-tag .dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--ink-faint);}
  .play-tag .muted{font-weight:500; font-size:.94em;}
  .play-tag.upcoming{background:var(--accent-soft);}
  .play-tag.upcoming .dot{background:var(--accent);}
  .play-tag.past{background:var(--surface-2); color:var(--ink-muted);}
  .play-tag.past .dot{background:var(--ink-faint);}
  .play-tag.unscheduled{background:var(--surface-2); color:var(--ink-muted); border-style:dashed; border-color:var(--line);}
  .play-tag.unscheduled .dot{background:var(--ink-faint);}
  .play-tag:hover{filter:brightness(0.97);}

  .empty-state{
    text-align:center; padding:56px 20px; color:var(--ink-muted);
  }
  .empty-state .icon{width:40px; height:40px; margin:0 auto 12px; color:var(--ink-faint);}

  /* ---------- Inventory grid ---------- */
  .inv-layout{display:grid; grid-template-columns:220px 1fr; gap:24px; align-items:start;}
  .filter-panel{position:sticky; top:78px; display:flex; flex-direction:column; gap:18px;}
  /* Sticky only makes sense next to a second column (the item grid) on desktop —
     once the layout collapses to one column on mobile, a sticky panel has
     nothing beside it to hover over and instead overlaps the list below it
     as the page scrolls. Drop it back to normal flow at that breakpoint.
     (Placed after the base rule above so it actually wins the cascade.) */
  @media (max-width:820px){ .inv-layout{grid-template-columns:1fr;} .filter-panel{position:static; top:auto;} }
  .filter-group h4{font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:8px;}
  .filter-list{display:flex; flex-direction:column; gap:2px;}
  .filter-list button{
    text-align:left; background:none; border:none; color:var(--ink-muted); padding:6px 8px; border-radius:7px;
    font-size:.82rem; cursor:pointer; display:flex; justify-content:space-between; gap:8px;
  }
  .filter-list button:hover{background:var(--surface-2);}
  .filter-list button.active{background:var(--accent-soft); color:var(--accent); font-weight:700;}
  .filter-list button .n{font-variant-numeric:tabular-nums; color:var(--ink-faint); font-size:.76rem;}

  /* Linha de etiquetas (usada no modal de evento arquivado). */
  .item-full-meta{display:flex; flex-wrap:wrap; gap:7px;}
  .item-full-meta .pill{white-space:normal; text-align:left; max-width:100%;}

  /* ---------- Estoque: barra de busca ---------- */
  .inv-search-card{padding:14px 16px; margin-bottom:18px; display:flex; flex-direction:column; gap:10px;}
  .inv-search-field{position:relative;}
  .inv-search-field > svg{
    position:absolute; left:13px; top:50%; transform:translateY(-50%); width:17px; height:17px;
    color:var(--ink-faint); pointer-events:none;
  }
  .inv-search-field input{padding:0 40px 0 40px; height:42px; font-size:.92rem;}
  .inv-search-clear{
    position:absolute; right:7px; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:50%;
    border:none; background:var(--surface-2); color:var(--ink-muted); font-size:1.05rem; line-height:1; cursor:pointer;
    display:none; align-items:center; justify-content:center;
  }
  .inv-search-clear:hover{background:var(--surface-3); color:var(--ink);}
  .inv-search-field.has-value .inv-search-clear{display:flex;}
  .inv-search-hint{font-size:.72rem; color:var(--ink-faint); line-height:1.4;}
  .inv-search-meta{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .inv-result-count{font-size:.78rem; color:var(--ink-muted); font-variant-numeric:tabular-nums;}
  .inv-clear-filters{font-size:.76rem; font-weight:600; color:var(--accent); background:none; border:none; cursor:pointer; padding:2px 4px;}
  .inv-clear-filters:hover{text-decoration:underline;}
  .inv-size-chips{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .inv-size-chips .chip{padding:3px 11px; font-size:.74rem;}
  /* Trecho que bateu com a busca, destacado no cartão. */
  mark.hl{background:var(--accent-soft); color:var(--accent); border-radius:3px; padding:0 1px; font-weight:inherit;}

  /* ---------- Estoque: cartões (sem imagem — só texto) ---------- */
  .filter-group-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .filter-group-head h4{margin:0;}
  .filter-list button.is-empty-section{font-style:italic;}
  .item-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px;}
  .item-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    cursor:pointer; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:9px; padding:13px 14px 12px;
    transition:transform .14s ease, border-color .14s ease;
  }
  .item-card:hover{transform:translateY(-2px); border-color:var(--accent);}
  .item-card-head{display:flex; align-items:flex-start; gap:8px;}
  .item-card-head h4{flex:1; min-width:0; font-size:.92rem; font-family:var(--font-body); font-weight:700; line-height:1.3; overflow-wrap:anywhere;}
  .item-qty-badge{
    flex:none; background:var(--surface-2); color:var(--ink-muted); font-size:.72rem; font-weight:700;
    padding:2px 9px; border-radius:999px; font-variant-numeric:tabular-nums;
  }
  .item-meta{display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-size:.76rem; color:var(--ink-muted);}
  .item-meta .item-section{flex:1; min-width:0; overflow-wrap:anywhere;}
  .item-card-actions{display:flex; gap:2px; margin-left:auto; margin-right:-6px;}
  /* Espaço reservado pra descrição: mesmo sem texto o cartão mantém a área
     (cerca de 3 linhas), pra a grade ficar alinhada e o campo ser óbvio. */
  .item-desc{
    font-size:.8rem; color:var(--ink-muted); line-height:1.45; min-height:calc(1.45em * 3);
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
    overflow-wrap:anywhere; white-space:pre-line;
  }
  .item-desc.is-empty{color:var(--ink-faint); font-style:italic;}

  /* ---------- Event modal: show poster ---------- */
  .ev-poster-field{display:flex; align-items:flex-end; gap:14px;}
  .ev-poster-box{
    width:84px; aspect-ratio:2/3; border-radius:9px; overflow:hidden; background:var(--surface-2);
    border:1px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
  }
  .ev-poster-box img{width:100%; height:100%; object-fit:cover; display:block;}
  .ev-poster-box .placeholder svg{width:26px; height:26px;}
  .ev-poster-actions{display:flex; flex-direction:column; gap:6px; align-items:flex-start;}
  .ev-poster-actions label.btn{cursor:pointer;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,13,8,.5); backdrop-filter:blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:100; overflow-y:auto;
  }
  .modal{
    background:var(--surface); border-radius:16px; border:1px solid var(--line); box-shadow:var(--shadow);
    width:100%; max-width:560px; padding:26px; animation:pop .16s ease;
  }
  .modal.wide{max-width:760px;}
  @keyframes pop{from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:none;}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .modal-head h3{font-size:1.25rem;}
  .modal-close{border:none; background:var(--surface-2); width:30px; height:30px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--ink-muted);}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px; padding-top:16px; border-top:1px solid var(--line);}
  .modal-actions .push-left{margin-right:auto;}

  /* ---------- Calendar ---------- */
  .cal-layout{display:grid; grid-template-columns:1fr 340px; gap:24px; align-items:start;}
  .cal-month-card{position:sticky; top:78px;}
  /* Same reasoning as .filter-panel / .char-list above: once the month
     panel stacks above the agenda list on mobile instead of sitting beside
     it, staying sticky makes it overlap the list underneath while scrolling. */
  @media (max-width:900px){ .cal-layout{grid-template-columns:1fr;} .cal-month-card{position:static; top:auto;} }
  .cal-nav{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .cal-nav h3{font-size:1.1rem; min-width:170px; text-align:center; flex:1;}
  @media (max-width:420px){ .cal-nav h3{min-width:0; font-size:1rem;} }
  .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px;}
  .cal-dow{font-size:.66rem; text-transform:uppercase; color:var(--ink-faint); text-align:center; font-weight:700; padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1/.82; min-width:0; border-radius:9px; border:1px solid transparent; background:var(--surface);
    padding:6px; font-size:.78rem; color:var(--ink-muted); cursor:pointer; display:flex; flex-direction:column; gap:4px;
    position:relative; overflow:hidden;
  }
  .cal-cell.pad{background:transparent; cursor:default;}
  .cal-cell.today{border-color:var(--ink);}
  .cal-cell.selected{box-shadow:inset 0 0 0 2px var(--secondary);}
  .cal-cell.has-event{background:var(--accent); color:var(--accent-ink); font-weight:700;}
  .cal-cell.has-event:hover{filter:brightness(1.04);}
  .cal-cell .ev-count{position:absolute; bottom:5px; right:7px; font-size:.62rem; font-weight:800; opacity:.85;}
  .agenda-list{display:flex; flex-direction:column; gap:10px;}
  .event-card{padding:14px 16px; display:flex; flex-direction:row; gap:12px; align-items:flex-start;}
  .event-card .ev-card-poster{
    width:52px; aspect-ratio:2/3; border-radius:8px; overflow:hidden; background:var(--surface-2);
    border:1px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
  }
  .event-card .ev-card-poster img{width:100%; height:100%; object-fit:cover; display:block;}
  .event-card .ev-card-poster svg{width:18px; height:18px;}
  .event-card .ev-card-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;}
  .event-card .title-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .event-card h4{font-size:1rem;}
  .event-card .date{font-size:.78rem; color:var(--accent); font-weight:700;}
  .event-card .meta-row{display:flex; gap:14px; flex-wrap:wrap; font-size:.78rem; color:var(--ink-muted);}
  .event-card .actions-row{display:flex; gap:8px; margin-top:4px;}
  .archived-row-poster{
    width:40px; aspect-ratio:2/3; border-radius:7px; overflow:hidden; background:var(--surface-2);
    border:1px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
  }
  .archived-row-poster img{width:100%; height:100%; object-fit:cover; display:block;}
  .archived-row-poster svg{width:15px; height:15px;}

  /* ---------- Date picker (used for event start/end date — a small, custom
     calendar instead of the browser's native <input type=date> popup, so the
     week always starts on Sunday regardless of OS/browser locale) ---------- */
  .dp-input-wrap{position:relative;}
  .dp-input-wrap input{cursor:pointer; background:var(--surface);}
  .dp-popover{
    position:absolute; top:calc(100% + 6px); left:0; z-index:60; width:232px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:10px;
  }
  .dp-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .dp-nav strong{font-size:.82rem;}
  .dp-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; margin-bottom:2px;}
  .dp-dow{font-size:.6rem; text-transform:uppercase; color:var(--ink-faint); text-align:center; font-weight:700; padding-bottom:2px;}
  .dp-cell{text-align:center; font-size:.78rem; padding:5px 0; border-radius:6px; cursor:pointer; color:var(--ink);}
  .dp-cell:hover{background:var(--surface-2);}
  .dp-cell.selected{background:var(--accent); color:var(--accent-ink); font-weight:700;}
  .dp-cell.pad{cursor:default;}
  .dp-actions{margin-top:4px; text-align:right;}

  /* ---------- Plays / planner ---------- */
  .play-hero{display:flex; align-items:center; gap:20px; margin-bottom:24px; flex-wrap:wrap;}
  .play-hero img{height:76px;}
  .play-stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat-pill{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 14px; text-align:left;}
  .stat-pill .n{font-family:var(--font-display); font-size:1.3rem; font-weight:700; display:block; line-height:1.1;}
  .stat-pill .l{font-size:.68rem; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em;}

  .planner-layout{display:grid; grid-template-columns:280px 1fr; gap:20px; align-items:start;}
  .char-list{display:flex; flex-direction:column; gap:6px; position:sticky; top:78px;}
  /* Same reasoning as .filter-panel above: sticky is only safe next to a
     second column. On mobile the character list stacks above the character
     detail panel, so a stuck sidebar would overlap it (and its progress
     bars) while scrolling — go back to normal flow there instead.
     (Placed after the base rule above so it actually wins the cascade.) */
  @media (max-width:880px){ .planner-layout{grid-template-columns:1fr;} .char-list{position:static; top:auto;} }
  .char-row{
    text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:10px 13px;
    cursor:pointer; display:flex; flex-direction:column; gap:3px;
  }
  .char-row:hover{border-color:var(--accent);}
  .char-row.active{border-color:var(--accent); background:var(--accent-soft);}
  .char-row .name{font-weight:700; font-size:.88rem;}
  .char-row .sub{font-size:.72rem; color:var(--ink-muted);}
  /* Cor de destaque do próprio site (bordô) em vez do verde — o verde
     chamava atenção demais por ser a única cor "estranha" à identidade
     visual do IBA no meio da tela. */
  .char-row .progress{height:4px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin-top:4px;}
  .char-row .progress > div{height:100%; background:var(--accent);}
  .char-row .progress-caption{margin-top:1px;}


  /* ---------- Per-cast role/item cards (character detail) ---------- */
  .role-section{margin-bottom:14px;}
  .role-section:last-child{margin-bottom:0;}
  .role-section > h5{
    font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--accent);
    margin-bottom:7px; font-family:var(--font-body); font-weight:700; display:flex; align-items:center; gap:8px;
  }
  .role-section > h5 .count-badge{
    background:var(--surface-2); color:var(--ink-muted); border-radius:999px; padding:1px 8px; font-size:.68rem; font-weight:700;
    text-transform:none; letter-spacing:0;
  }
  .role-card{border:1px solid var(--line); border-radius:var(--radius-sm); padding:8px 10px; margin-bottom:6px; background:var(--surface);}
  .role-card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; flex-wrap:wrap;}
  .role-card-head .who{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .role-card-actions{display:flex; gap:4px;}
  .role-items{display:flex; flex-direction:column; gap:3px;}
  /* Diferenciação simples: item resolvido é só uma caixa neutra, sem faixa
     nem destaque; item pendente ou com aviso ganha só um leve pigmento
     avermelhado (bordô da marca bem diluído) no fundo e no contorno, sem
     faixa lateral. */
  .costume-item-card{border:1px solid var(--line); border-radius:7px; padding:5px 7px; background:var(--surface);}
  .costume-item-card.is-pending, .costume-item-card.is-warning{
    border-color:rgba(137,22,47,.28); background:#f9eff1;
  }
  .costume-item-card-row{display:flex; gap:4px; align-items:center; flex-wrap:wrap; margin-bottom:3px;}
  .costume-item-card-row:last-child{margin-bottom:0;}
  .costume-item-card-row .grow{flex:1; min-width:80px;}
  .costume-item-card-row .name-field{flex:1 1 150px; min-width:110px; max-width:230px;}
  .costume-item-card input[type=text], .costume-item-card input[type=number], .costume-item-card select{
    padding:3px 6px; font-size:.76rem; border-radius:5px;
  }
  .costume-item-card textarea{
    resize:none; height:24px; min-height:24px; line-height:1.3;
    font-family:inherit; width:100%; padding:3px 6px; font-size:.76rem; border-radius:5px;
  }
  /* Ícone de vincular ao acervo — fica destacado (cor de acento) quando o
     item já está vinculado, e volta ao normal quando não está, então dá pra
     ver o estado sem precisar passar o mouse. */
  .costume-item-card .is-linked{color:var(--accent); background:var(--accent-soft);}
  .costume-item-card .is-linked:hover{background:var(--accent-soft); filter:brightness(.96);}
  /* Aviso de estoque — era uma linha de texto inteira por item; agora é só
     um ícone com o texto completo na dica (title), pra não gastar uma linha
     por item quando a tela pode ter centenas deles. */
  .item-warn-badge{
    display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
    font-size:.8rem; cursor:help; flex:none;
  }
  @media (max-width:520px){ .costume-item-card-row{flex-direction:column; align-items:stretch;} .costume-item-card-row .grow, .costume-item-card-row .name-field, .costume-item-card-row > div{width:100%; max-width:none;} }

  /* ---------- Modal tabs ---------- */
  .modal-tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin:-4px 0 16px;}
  .modal-tab-btn{
    border:none; background:none; cursor:pointer; font:inherit; font-weight:600; font-size:.82rem;
    color:var(--ink-faint); padding:8px 4px 10px; margin-right:14px; border-bottom:2px solid transparent;
  }
  .modal-tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}
  .modal-tab-panel{display:none;}
  .modal-tab-panel.active{display:block;}

  /* ---------- Class/group multi-select chips (actor modal) ---------- */
  .class-picker{display:flex; flex-wrap:wrap; gap:7px;}
  .class-chip{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    border-radius:999px; padding:6px 13px; font-size:.8rem; font-weight:600; cursor:pointer;
  }
  .class-chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .class-pill-list{display:flex; flex-wrap:wrap; gap:5px;}

  /* ---------- Duplicates banner / merge ---------- */
  .dup-banner{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    border:1px solid var(--warning); background:var(--warning-soft); color:var(--ink);
    border-radius:var(--radius); padding:12px 16px; margin-bottom:18px;
  }
  .dup-banner strong{color:var(--warning);}
  .dup-banner .btn{margin-left:auto;}
  .merge-group{border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:14px;}
  .merge-group h5{font-size:.85rem; margin-bottom:8px;}
  .merge-candidate{
    display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line);
    text-transform:none; font-weight:400; font-size:.86rem; color:var(--ink); letter-spacing:normal;
  }
  .merge-candidate:last-of-type{border-bottom:none;}
  .merge-candidate input[type=radio]{margin-top:3px; width:auto;}
  .merge-candidate strong{font-weight:700;}
  .merge-preview{font-size:.76rem; color:var(--ink-muted); margin-top:2px; text-transform:none;}

  /* ---------- Elenco (cast) search grouping on the Actors page ---------- */
  .cast-search-block{margin-bottom:22px;}
  .cast-search-block h4{
    font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--accent);
    margin-bottom:10px; font-family:var(--font-body); font-weight:700;
  }

  .row-stock-warning{font-size:.7rem; color:var(--warning); margin-top:4px; font-weight:600; line-height:1.4;}


  /* ---------- Stock alerts ---------- */
  .stock-alert{border-color:var(--warning); background:var(--warning-soft); padding:16px 18px; margin-bottom:14px;}
  .stock-alert-head{display:flex; align-items:center; gap:8px; font-size:.95rem; color:var(--warning);}
  .stock-alert-row{padding:9px 0; border-top:1px solid var(--line);}
  .stock-short-badge{
    display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 10px; font-size:.72rem;
    font-weight:700; background:var(--warning-soft); color:var(--warning); white-space:nowrap;
  }
  .stock-caution-badge{
    display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 10px; font-size:.72rem;
    font-weight:600; background:var(--info-soft); color:var(--info); white-space:nowrap; margin-left:6px;
  }
  /* Compact, discreet note for "saved by sharing" — kept visually separate from
     real stock shortages: smaller, blue, single line, no card padding. */
  .stock-caution-alert{
    display:flex; align-items:flex-start; gap:7px; padding:8px 12px; margin-bottom:14px;
    border-color:var(--info-soft); background:var(--info-soft); box-shadow:none; cursor:help;
  }
  .stock-caution-alert-icon{font-size:.82rem; line-height:1.4;}
  .stock-caution-alert-text{font-size:.76rem; color:var(--info); line-height:1.4;}
  .row-stock-warning.caution{font-size:.7rem; color:var(--info); margin-top:4px; font-weight:500; font-style:italic; line-height:1.4; cursor:help;}

  /* ---------- Play posters (Netflix-tile style) ---------- */
  .play-card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:18px;}
  .play-card{cursor:pointer; border:none; background:none; padding:0; text-align:left; display:block; width:100%;}
  .play-card .poster-frame{
    position:relative; aspect-ratio:2/3; border-radius:var(--radius); overflow:hidden;
    background:linear-gradient(160deg, var(--surface-3), var(--surface-2)); box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .play-card:hover .poster-frame{transform:translateY(-4px); box-shadow:0 14px 28px -10px rgba(34,36,31,.35);}
  .play-card .poster-frame img{width:100%; height:100%; object-fit:cover; display:block;}
  .play-card .poster-frame .placeholder{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
  }
  .play-card .poster-frame .placeholder svg{width:34%; height:34%;}
  .play-card .poster-badge{
    position:absolute; top:8px; right:8px; background:var(--warning); color:#fff; font-size:.66rem; font-weight:700;
    border-radius:999px; min-width:20px; height:20px; padding:0 6px; display:flex; align-items:center; justify-content:center;
    line-height:1; box-shadow:0 1px 4px rgba(0,0,0,.3);
  }
  .play-card .poster-overlay{
    position:absolute; left:0; right:0; bottom:0; padding:22px 10px 9px;
    background:linear-gradient(to top, rgba(10,8,4,.88), rgba(10,8,4,0));
  }
  .play-card .poster-overlay h4{font-size:.86rem; color:#fff; line-height:1.25; margin-bottom:2px;}
  .play-card .poster-overlay .stats-mini{font-size:.66rem; color:rgba(255,255,255,.82);}
  @media (max-width:480px){ .play-card-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px;} }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:.82rem; font-weight:600;
    box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .flex-between{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .muted{color:var(--ink-muted);}
  .small{font-size:.78rem;}
  .mt-8{margin-top:8px;} .mt-16{margin-top:16px;} .mb-8{margin-bottom:8px;} .mb-16{margin-bottom:16px;}

  /* ---------- Save/connection indicator, loading & config screens ---------- */
  .sync-pill{
    display:flex; align-items:center; gap:6px; font-size:.72rem; font-weight:600; color:var(--ink-faint);
    padding:5px 10px; border-radius:999px; border:1px solid transparent;
  }
  .sync-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:none;}
  .sync-pill.saving .dot{background:var(--warning); animation:pulse 1s ease-in-out infinite;}
  .sync-pill.saving{color:var(--warning);}
  .sync-pill.error{color:var(--critical); border-color:var(--critical-soft); background:var(--critical-soft);}
  .sync-pill.error .dot{background:var(--critical);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .full-screen-msg{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:40px 20px; text-align:center; color:var(--ink-muted);
  }
  .full-screen-msg h2{font-size:1.3rem; color:var(--ink);}
  .full-screen-msg p{max-width:440px; font-size:.9rem; line-height:1.6;}
  .full-screen-msg input{
    width:100%; max-width:360px; text-align:center; font-size:.95rem; padding:10px 12px;
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
  }
  .full-screen-msg .token-error{color:var(--critical); font-weight:600;}
  .full-screen-msg textarea{
    width:100%; max-width:560px; min-height:90px; font-family:monospace; font-size:.78rem;
    background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:10px;
  }
  .spinner{
    width:26px; height:26px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none;} .sync-pill.saving .dot{animation:none;} }
</style>
</head>

function t(key){
  // state pode ainda não existir (telas de "não configurado" / erro de
  // carregamento aparecem antes do primeiro fetch terminar) — nesse caso usa
  // uiLang, que já reflete o idioma escolhido mesmo sem state.
  const d = (state && I18N[state.lang]) || I18N[uiLang] || I18N.pt;
  return d[key] !== undefined ? d[key] : (I18N.pt[key] !== undefined ? I18N.pt[key] : key);
}

/* ---------------------------------------------------------------------
   Backend — Google Sheets via Apps Script
   ---------------------------------------------------------------------
   A URL da implantação fica aqui (sozinha ela não dá acesso a nada: o
   Apps Script recusa qualquer pedido sem o token certo). O TOKEN NÃO FICA
   NO ARQUIVO: este arquivo é público no GitHub Pages, e quem lesse o token
   no código-fonte conseguiria ler a planilha inteira. Em vez disso o site
   pede o token uma vez em cada aparelho e guarda só no navegador
   (localStorage). Também dá pra abrir o site uma vez com
   `...#token=SEU_TOKEN` na URL — ele guarda e apaga o token da barra de
   endereço (o trecho depois do # nunca é enviado a servidor nenhum).
   Se um dia criarem uma implantação nova de verdade (não uma "Nova
   versão"), troquem só a API_URL abaixo — ver GUIA_DE_CONFIGURACAO.md.
--------------------------------------------------------------------- */
const API_URL = 'https://script.google.com/macros/s/AKfycbzS8U0cF823GurSLhUqzvfA7_HaOpQ_cLF8rmcEssTJnt4cBYFxHPpTcafezuP0GNZ-/exec';

const TOKEN_KEY = 'camarim_api_token';
let API_TOKEN = '';
let tokenRejected = false;   // o último token informado foi recusado pelo servidor
function storeToken(tok){
  API_TOKEN = tok || '';
  try{ if(API_TOKEN) localStorage.setItem(TOKEN_KEY, API_TOKEN); else localStorage.removeItem(TOKEN_KEY); }catch(e){}
}
(function loadToken(){
  try{ API_TOKEN = localStorage.getItem(TOKEN_KEY) || ''; }catch(e){}
  const m = /[#&]token=([^&]+)/.exec(window.location.hash);
  if(m){
    let tok = m[1];
    try{ tok = decodeURIComponent(tok); }catch(e){}
    storeToken(tok.trim());
    // tira o token da barra de endereço (não fica no histórico nem em favoritos)
    try{ history.replaceState(null, '', window.location.pathname + window.location.search); }catch(e){}
  }
})();

const POLL_INTERVAL_MS = 60000;
// Depois de um soluço na verificação em segundo plano, tenta de novo bem mais
// rápido que o intervalo normal — assim a mensagem de erro não fica minutos
// na tela por causa de uma falha passageira, some assim que a conexão volta.
const POLL_RETRY_MS = 8000;
let saving = false;

function apiConfigured(){ return !!API_URL; }

// fetch() has no built-in timeout — on a flaky connection (common on school
// wifi/tablets) a stalled request before used to just hang forever, leaving
// "Salvando..." on screen with no way out short of reloading (and losing
// the edit). This aborts and surfaces a normal error instead, which the
// existing catch blocks already know how to show. The POST timeout is kept
// well above Code.gs's own 30s lock wait (plus its actual write time) so a
// save that's genuinely still in progress server-side under write
// contention is never aborted out from under itself.
async function fetchWithTimeout(url, opts, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    return await fetch(url, Object.assign({}, opts, { signal: controller.signal }));
  }catch(e){
    if(e.name === 'AbortError') throw new Error('tempo_esgotado');
    throw e;
  }finally{
    clearTimeout(timer);
  }
}
async function apiGet(){
  const url = API_URL + (API_URL.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(API_TOKEN);
  const res = await fetchWithTimeout(url, {}, 20000);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'erro_desconhecido');
  return json.state;
}
// Sem cabeçalhos customizados de propósito: um Content-Type diferente de
// text/plain faria o navegador mandar um preflight OPTIONS antes do POST,
// e o Apps Script não responde esse preflight — a chamada falharia por CORS.
async function apiPost(payload){
  payload = Object.assign({ token: API_TOKEN }, payload);
  const res = await fetchWithTimeout(API_URL, { method: 'POST', body: JSON.stringify(payload) }, 50000);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'erro_desconhecido');
  return json;
}
async function apiUploadImage(dataUrl, filename){
  const json = await apiPost({ action: 'uploadImage', dataUrl, filename });
  return json.url;
}
// Limpeza best-effort: apaga do Drive fotos que não estão mais em uso (foto
// removida de um item, ou o item/poster inteiro excluído). Nunca lança —
// se falhar, a foto só fica órfã no Drive, o que não quebra nada no site.
async function apiDeleteImages(urls){
  urls = (urls||[]).filter(Boolean);
  if(!urls.length) return;
  try{ await apiPost({ action: 'deleteImages', urls }); }
  catch(e){ /* best-effort — ver comentário acima */ }
}

let lastSyncKind = 'offline';
function setSyncStatus(kind){
  lastSyncKind = kind;
  const pill = document.getElementById('syncPill');
  const label = document.getElementById('syncLabel');
  if(!pill || !label) return;
  // "reconnecting" usa o mesmo visual (âmbar, discreto) de "saving" — é uma
  // tentativa em andamento, não uma falha grave como um salvamento perdido.
  const isBusy = kind === 'saving' || kind === 'reconnecting';
  pill.className = 'sync-pill' + (isBusy ? ' saving' : kind==='error' ? ' error' : '');
  label.textContent = kind==='saving' ? t('sync_saving')
    : kind==='reconnecting' ? t('sync_reconnecting')
    : kind==='error' ? t('sync_error')
    : kind==='offline' ? t('sync_offline') : t('sync_saved');
}

/* ---------------------------------------------------------------------
   State
--------------------------------------------------------------------- */
let state = null;

// Roda uma única vez, na primeira abertura: se a planilha ainda estiver
// vazia, semeia com os dados de exemplo que o protótipo já trazia (elenco e
// estoque do Seussical), incluindo as fotos que já existiam — cada uma é
// enviada ao Drive uma vez aqui. Depois disso a planilha vira a fonte de
// verdade e essa função nunca mais roda (o estoque deixa de estar vazio).
async function bootstrapIfEmpty(data){
  const empty = !data.actors.length && !data.inventory.length && !data.plays.length && !data.events.length;
  if(!empty || typeof window.SEED_DATA === 'undefined') return data;
  const seed = JSON.parse(JSON.stringify(window.SEED_DATA));
  const images = window.IMAGES || {};
  const urlByImageId = {};
  for(const imgId of Object.keys(images)){
    try{ urlByImageId[imgId] = await apiUploadImage(images[imgId], imgId + '.jpg'); }
    catch(e){ /* essa foto fica sem imagem; o resto da migração continua */ }
  }
  (seed.inventory||[]).forEach(i=>{ i.images = (i.images||[]).map(id=>urlByImageId[id]).filter(Boolean); });
  (seed.plays||[]).forEach(p=>{ p.logo = p.logo && urlByImageId[p.logo] ? urlByImageId[p.logo] : null; });
  ['actors','classes','inventory','sections','plays','events','archivedEvents'].forEach(k=>{ if(!Array.isArray(seed[k])) seed[k] = []; });
  await apiPost({ action: 'saveState', state: seed });
  return seed;
}

async function loadState(){
  let data = await apiGet();
  data = await bootstrapIfEmpty(data);
  normalizeState(data);
  data.lang = uiLang;
  return data;
}

async function saveState(){
  const { lang, ...rest } = state;
  await apiPost({ action: 'saveState', state: rest });
  try{ localStorage.setItem(LANG_KEY, state.lang); }catch(e){}
}

// Salva o estado atual e atualiza o indicador — compartilhado por mutate()
// (edições normais) e por applyBackup() (restaurar um backup).
//
// Os salvamentos são SERIALIZADOS: o site manda o estado inteiro a cada
// edição, então dois POSTs em paralelo poderiam chegar fora de ordem e a
// versão mais antiga sobrescrever a mais nova na planilha. Se uma edição
// acontece durante um salvamento, ela só marca "tem mais coisa a salvar" e o
// mesmo ciclo salva de novo logo em seguida (várias edições seguidas viram
// um único POST extra). `dirty` fica ligado até a planilha confirmar a
// versão mais recente — enquanto estiver ligado, a verificação em segundo
// plano NÃO substitui o estado local (senão uma falha de rede faria a
// próxima verificação apagar a edição ainda não salva).
let dirty = false;
let editRev = 0;
let saveRun = null;
let saveAgain = false;

function flushSave(){
  if(saveRun){ saveAgain = true; return saveRun; }
  saveRun = (async()=>{
    let ok = true;
    try{
      do{
        saveAgain = false;
        const revAtStart = editRev;
        saving = true;
        setSyncStatus('saving');
        try{
          await saveState();
          if(revAtStart === editRev) dirty = false;
          else saveAgain = true;
        }catch(e){
          ok = false;
          saveAgain = false;
          if(e && e.message === 'token_invalido'){ saveRun = null; saving = false; handleBadToken(); return false; }
          setSyncStatus('error');
          toast(t('sync_error'));
        }
      }while(saveAgain);
      if(ok) setSyncStatus('saved');
    }finally{
      saving = false;
      saveRun = null;
    }
    return ok;
  })();
  return saveRun;
}

async function commitAndSave(){
  render();
  editRev++;
  dirty = true;
  return flushSave();
}

async function mutate(fn){
  fn(state);
  return commitAndSave();
}

function syncLangButtons(l){
  const pt = document.getElementById('langPt'), en = document.getElementById('langEn');
  if(pt){ pt.classList.toggle('active', l==='pt'); pt.setAttribute('aria-pressed', l==='pt'); }
  if(en){ en.classList.toggle('active', l==='en'); en.setAttribute('aria-pressed', l==='en'); }
}

function setLang(l){
  uiLang = l;
  if(state) state.lang = l;
  try{ localStorage.setItem(LANG_KEY, l); }catch(e){}
  // Topbar (rótulo do botão "Gerenciar dados" + botões PT/EN) existe e é
  // visível independente de haver state carregado, então é sempre atualizada.
  initTopbarChrome();
  // Com state carregado, um render() completo já troca todo o resto da tela.
  // Sem state (não configurado, ou falha de carregamento), a única outra
  // coisa na tela é a mensagem de tela cheia — reexibe ela no novo idioma.
  if(state) render();
  else renderStaticScreen();
}

// Sincronização em segundo plano: outras pessoas podem estar editando a
// mesma planilha ao mesmo tempo. A cada intervalo, busca o estado mais
// recente e substitui o local — só quando não há um modal aberto (pra não
// arrancar um formulário sendo preenchido) nem um salvamento em andamento.
// Depois de uma falha, a próxima tentativa é reagendada bem mais cedo
// (POLL_RETRY_MS) em vez de esperar o intervalo cheio de novo — um soluço
// passageiro do Apps Script assim se resolve sozinho em segundos, não minutos.
function startPolling(){
  scheduleNextPoll(POLL_INTERVAL_MS);
}

let pollTimer = null;
function scheduleNextPoll(delay){
  clearTimeout(pollTimer);   // nunca há mais de uma sequência de verificações ativa
  pollTimer = setTimeout(pollOnce, delay);
}

// O usuário está digitando num campo da tela (ex.: nota de um item, ainda sem
// confirmar)? Um render() agora arrancaria o que foi digitado.
function userIsEditingField(){
  const a = document.activeElement;
  if(!a || a === document.body) return false;
  const app = document.getElementById('app');
  return !!(app && app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}

// JSON com chaves ordenadas — compara estados sem depender da ordem das chaves.
function stableStr(v){
  return JSON.stringify(v, function(k, val){
    if(val && typeof val === 'object' && !Array.isArray(val)){
      const o = {}; Object.keys(val).sort().forEach(key=>{ o[key] = val[key]; }); return o;
    }
    return val;
  });
}

async function pollOnce(){
  if(!state){ scheduleNextPoll(POLL_INTERVAL_MS); return; }
  // Há edição local ainda não confirmada pela planilha (um salvamento
  // falhou): tenta salvar de novo em vez de buscar — buscar e substituir
  // jogaria fora o que a pessoa fez.
  if(dirty && !saving){
    try{ await flushSave(); }catch(e){}
    scheduleNextPoll(dirty ? POLL_RETRY_MS : POLL_INTERVAL_MS);
    return;
  }
  if(saving || document.getElementById('activeModalOverlay')){
    scheduleNextPoll(POLL_INTERVAL_MS);
    return;
  }
  try{
    const fresh = await apiGet();
    // A save can start, or a modal can open, while this GET was in flight —
    // applying a response that started before them would silently overwrite
    // a just-saved change (or wipe a form being filled in) with stale data
    // for a few seconds, until the next poll quietly "fixed" it again. This
    // was the brief, unexplained resets some screens showed — re-check the
    // same guard now that the request has actually landed.
    if(saving || dirty || document.getElementById('activeModalOverlay')){
      scheduleNextPoll(POLL_INTERVAL_MS);
      return;
    }
    const lang = state.lang;
    // Nada mudou na planilha: não re-renderiza (evita piscar a tela e perder
    // rolagem/foco à toa a cada minuto).
    const { lang: _l, ...cur } = state;
    normalizeState(fresh);
    if(stableStr(fresh) === stableStr(cur)){
      setSyncStatus('saved');
      scheduleNextPoll(POLL_INTERVAL_MS);
      return;
    }
    // Mudou, mas a pessoa está no meio de um campo: adia pro próximo ciclo.
    if(userIsEditingField()){
      scheduleNextPoll(POLL_RETRY_MS * 2);
      return;
    }
    state = fresh;
    state.lang = lang;
    setSyncStatus('saved');
    render();
    scheduleNextPoll(POLL_INTERVAL_MS);
  }catch(e){
    if(e && e.message === 'token_invalido'){ handleBadToken(); return; }
    setSyncStatus('reconnecting');
    scheduleNextPoll(POLL_RETRY_MS);
  }
}

// Avisa antes de fechar/recarregar a aba se ainda há algo por salvar.
window.addEventListener('beforeunload', function(ev){
  if(dirty || saving){ ev.preventDefault(); ev.returnValue = ''; }
});

/* ---------------------------------------------------------------------
   Utils
--------------------------------------------------------------------- */
function esc(s){
  if(s === undefined || s === null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function nextId(arr){ return arr.reduce((m,x)=>Math.max(m,x.id||0),0)+1; }
// Normalizes a play into the current shape: a dynamic list of casts
// (play.casts = [{id,name}]) and, per character, a flat list of roles
// (ch.roles = [{id, castId, actorId, label, items:[...]}]) — one role per
// actor assigned within one cast. Older data (from before casts became
// dynamic) used a fixed pair — castLabels.cast1/cast2 and, per character,
// ch.cast1/ch.cast2 — so this rebuilds that into the new shape the one time
// it's encountered, letting every other function in the app assume the new
// shape unconditionally. The old per-CHARACTER costume items (ch.items,
// shared by every actor regardless of cast) are not carried over — items
// are a per-ACTOR concept now, different enough that copying them over
// would silently duplicate the same costume piece across every actor.
function migratePlayShape(play){
  if(!play || Array.isArray(play.casts)) return play;
  const labels = play.castLabels || {};
  play.casts = [
    { id: 1, name: labels.cast1 || 'Elenco 1' },
    { id: 2, name: labels.cast2 || 'Elenco 2' },
  ];
  (play.characters||[]).forEach(ch=>{
    if(!Array.isArray(ch.roles)){
      const roles = [];
      const castCounts = {};
      ['cast1','cast2'].forEach((key,i)=>{
        const castId = i+1;
        const cd = ch[key];
        if(cd && cd.count) castCounts[castId] = cd.count;
        ((cd && cd.names) || []).forEach(n=>{
          roles.push({ id: nextId(roles), castId, actorId: (n.actorId===undefined?null:n.actorId), label: n.label||'', items: [] });
        });
      });
      ch.roles = roles;
      ch.castCounts = castCounts;
    }
    delete ch.items; delete ch.cast1; delete ch.cast2;
  });
  delete play.castLabels;
  return play;
}
// Shared normalization for any state object coming from outside this
// session (a fresh load, a background poll picking up someone else's edit,
// a reload-from-sheet, a restored backup) — guarantees arrays that might be
// missing on older data exist, and that every play is in the current shape.
function normalizeState(data){
  if(!Array.isArray(data.archivedEvents)) data.archivedEvents = [];
  if(!Array.isArray(data.classes)) data.classes = [];
  // Lista de seções do estoque criadas à mão (ver allSections): limpa nomes
  // vazios e duplicados (ignorando caixa/acento) que possam vir de fora.
  if(!Array.isArray(data.sections)) data.sections = [];
  const seenSec = new Set();
  data.sections = data.sections.map(n=>String(n==null?'':n).trim()).filter(n=>{
    const k = normalizeName(n);
    if(!k || seenSec.has(k)) return false;
    seenSec.add(k); return true;
  });
  (data.actors||[]).forEach(a=>{ if(!Array.isArray(a.classIds)) a.classIds = []; });
  (data.plays||[]).forEach(p=>migratePlayShape(p));
  return data;
}
// Used on the search boxes so a fast typist doesn't force a full
// filter+sort+re-render on every single keystroke — only once typing
// actually pauses for a beat. 140ms is short enough nobody perceives a
// delay, long enough to collapse a whole word's worth of keystrokes into
// one render.
function debounce(fn, wait){
  let timer = null;
  return function(...args){
    clearTimeout(timer);
    timer = setTimeout(()=>fn.apply(this, args), wait);
  };
}
// "Today" as the viewer's own calendar date — NOT new Date().toISOString(),
// which gives the UTC date. For any timezone behind UTC (Brazil is UTC-3,
// with no DST), that's already tomorrow for several hours every evening, so
// comparing dates against it would mark today's own show "past" and
// un-highlight today's cell on the calendar hours before midnight actually
// arrives locally.
function todayLocalStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function findActor(id){ return state.actors.find(a=>a.id===id); }
function findEvent(id){ return state.events.find(e=>e.id===id); }
function findPlay(id){ return state.plays.find(p=>p.id===id); }
function findInvItem(id){ return state.inventory.find(i=>i.id===id); }
function findClass(id){ return (state.classes||[]).find(c=>c.id===id); }
// Nomes das turmas de um ator, na ordem em que a turma foi criada (ordem de
// state.classes) — ids que não existem mais (turma removida) são ignorados.
function classNameList(actor){
  return (state.classes||[]).filter(c=>(actor.classIds||[]).includes(c.id)).map(c=>c.name);
}
// Same idea, for an event's participating classes (event.classIds).
function eventClassNames(ev){
  return (state.classes||[]).filter(c=>(ev.classIds||[]).includes(c.id)).map(c=>c.name);
}
// Normaliza um nome pra comparação de duplicatas: tira espaços nas pontas,
// colapsa espaços internos e ignora maiúsculas/minúsculas e acentos — "José
// Silva", " jose  silva " e "JOSÉ SILVA" contam como o mesmo nome.
function normalizeName(name){
  return String(name||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
}
// Agrupa os atores por nome normalizado e devolve só os grupos com 2+
// registros — candidatos a duplicata, usados no aviso da página de Elenco.
function findDuplicateActorGroups(){
  const byName = {};
  state.actors.forEach(a=>{
    const key = normalizeName(a.name);
    if(!key) return;
    (byName[key] = byName[key] || []).push(a);
  });
  return Object.values(byName).filter(g=>g.length > 1);
}

/* ---------------------------------------------------------------------
   Stock availability — how much of each inventory item is actually needed
   across every active show, vs. how much exists.
   Shareable requirements (an item that can rotate between actors in the
   same show) only need the largest single requirement among them, not the
   sum — the rest of the demand math stays a plain sum. This is a
   simplifying assumption (it doesn't model who's on stage when), so any
   time that assumption is the only thing keeping a shortage from showing,
   savingsQty says so and the UI surfaces a note.
--------------------------------------------------------------------- */
// Pure function of `state` (plays/characters/items × inventory) — but it
// gets called several times within a single page render (once for the
// shortage banner, again per card, again in the lightbox...), and it's not
// cheap (it walks every play/character/item). Caching the result until the
// next actual state change turns N recomputations per render into 1.
let __stockDeficitsCache = null;
function computeStockDeficits(){
  if(__stockDeficitsCache) return __stockDeficitsCache;
  const byInv = {};
  state.plays.forEach(play=>{
    (play.characters||[]).forEach(ch=>{
      (ch.roles||[]).forEach(role=>{
        const cast = (play.casts||[]).find(c=>c.id===role.castId);
        (role.items||[]).forEach(it=>{
          if(!it.inventoryItemId) return;
          const qty = (it.qty===undefined || it.qty===null || it.qty==='') ? 1 : (Number(it.qty)||0);
          if(qty<=0) return;
          (byInv[it.inventoryItemId] = byInv[it.inventoryItemId]||[]).push({
            playId: play.id, playName: play.name, castId: role.castId, castName: cast ? cast.name : '',
            characterName: ch.name, actorLabel: role.label||'', itemName: it.name, qty
          });
        });
      });
    });
  });
  const result = {};
  Object.keys(byInv).forEach(key=>{
    const invId = Number(key);
    const invItem = findInvItem(invId);
    if(!invItem) return;
    const contributors = byInv[key];
    // Different casts (and different plays) always perform on different
    // days, so they never actually compete for the same physical item at
    // the same time — demand is grouped by (play, cast) and only the
    // busiest single group counts, not the sum of every group.
    const groups = {};
    contributors.forEach(c=>{
      const gkey = c.playId+':'+c.castId;
      groups[gkey] = (groups[gkey]||0) + c.qty;
    });
    const groupSums = Object.values(groups);
    const demand = groupSums.length ? Math.max(...groupSums) : 0;
    const demandWithoutSharing = groupSums.reduce((sum,v)=>sum+v, 0);
    const available = invItem.qty||0;
    const deficit = Math.max(0, demand - available);
    const savingsQty = demandWithoutSharing - demand;
    result[invId] = {
      item: invItem, contributors, demand, available, deficit,
      savingsQty, savedByShareable: deficit === 0 && savingsQty > 0 && demandWithoutSharing > available
    };
  });
  __stockDeficitsCache = result;
  return result;
}
function stockAlertHtml(list){
  const shortRows = list.filter(d=>d.deficit > 0);
  const cautionRows = list.filter(d=>d.deficit === 0 && d.savedByShareable);

  const shortBlock = shortRows.length ? `
  <div class="card stock-alert">
    <div class="stock-alert-head">⚠️ <strong>${esc(t('stock_alert_title'))}</strong></div>
    <p class="small muted" style="margin:4px 0 8px;">${esc(t('stock_alert_lead'))}</p>
    ${shortRows.map(d=>{
      const usedIn = Array.from(new Set(d.contributors.map(c=>`${c.playName} (${c.castName}) · ${c.characterName}${c.actorLabel ? ' — '+c.actorLabel : ''} (${c.itemName} ×${c.qty})`))).join(', ');
      return `
      <div class="stock-alert-row">
        <div>⚠️ <strong>${esc(d.item.name)}</strong>
          <span class="small muted"> — ${esc(t('stock_needs'))} ${d.demand}, ${esc(t('stock_has'))} ${d.available} (${esc(t('stock_missing'))} ${d.deficit})</span>
        </div>
        <div class="small muted">${esc(t('stock_used_in'))}: ${esc(usedIn)}</div>
      </div>`;
    }).join('')}
  </div>` : '';

  const cautionBlock = cautionRows.length ? `
  <div class="card stock-caution-alert" title="${esc(t('stock_saved_by_shareable'))}">
    <span class="stock-caution-alert-icon">ℹ️</span>
    <span class="stock-caution-alert-text"><strong>${esc(t('stock_caution_title'))}:</strong> ${esc(cautionRows.map(d=>d.item.name).join(', '))} — ${esc(t('stock_caution_short'))}</span>
  </div>` : '';

  return shortBlock + cautionBlock;
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

/* ---------------------------------------------------------------------
   Modal
--------------------------------------------------------------------- */
function openModal(innerHtml, opts){
  opts = opts || {};
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModalOverlay';
  overlay.addEventListener('mousedown', (e)=>{ if(e.target === overlay) closeModal(); });
  overlay.innerHTML = `<div class="modal ${opts.wide?'wide':''}">${innerHtml}</div>`;
  document.body.appendChild(overlay);
  document.addEventListener('keydown', escCloseHandler);
  const firstInput = overlay.querySelector('input, select, textarea');
  if(firstInput) setTimeout(()=>firstInput.focus(), 30);
}
function escCloseHandler(e){ if(e.key === 'Escape') closeModal(); }
function closeModal(){
  const ov = document.getElementById('activeModalOverlay');
  if(ov) ov.remove();
  document.removeEventListener('keydown', escCloseHandler);
}
function confirmAction(message, onConfirm, opts){
  opts = opts || {};
  openModal(`
    <div class="modal-head"><h3>${esc(opts.title || t('confirm_delete_title'))}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p class="small muted">${esc(message)}</p>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${esc(t('cancel'))}</button>
      <button class="btn btn-danger" id="confirmYesBtn">${esc(opts.confirmLabel || t('delete'))}</button>
    </div>
  `);
  document.getElementById('confirmYesBtn').onclick = ()=>{ closeModal(); onConfirm(); };
}

// Whether the institute already has a costume item — and if so, from the
// inventory ("acervo", the normal/expected case) or borrowed from outside
// it ("emprestado", tracked but never counted as inventory stock).
function possessionMeta(v){
  switch(v){
    case 'acervo': return {cls:'success', label:t('possession_acervo')};
    case 'emprestado': return {cls:'accent', label:t('possession_emprestado')};
    case 'faltando': return {cls:'critical', label:t('possession_faltando')};
    default: return {cls:'neutral', label:t('possession_unset')};
  }
}
// Sub-status shown only while possession is 'faltando' (missing) — the
// path from "need to buy it" to "bought, waiting for it to arrive".
function purchaseSubStatusMeta(v){
  switch(v){
    case 'comprado_aguardando': return {cls:'warning', label:t('purchase_comprado_aguardando')};
    default: return {cls:'critical', label:t('purchase_a_comprar')};
  }
}
function selectOptions(pairs, current){
  return pairs.map(([val,label])=>`<option value="${esc(val)}" ${val===current?'selected':''}>${esc(label)}</option>`).join('');
}

   Router
--------------------------------------------------------------------- */
function go(page, param){
  window.location.hash = param!==undefined ? `#/${page}/${param}` : `#/${page}`;
}
function parseHash(){
  const h = window.location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return { page: parts[0] || 'home', param: parts[1] };
}

const CRUMB_LABELS = {
  actors: ()=>t('nav_actors'), inventory: ()=>t('nav_inventory'),
  calendar: ()=>t('nav_calendar'), plays: ()=>t('nav_plays'),
};

// computeStockDeficits()/actorPlaysFor() cache their (fairly expensive)
// results so repeated calls within the same page don't redo the same walk
// over plays/characters/items — but that cache is only correct until the
// data actually changes. render() runs after every real state change
// (an edit via mutate(), a background poll picking up someone else's edit,
// switching language, initial load), so invalidating right here is the one
// place that reliably stays in sync without each caller having to remember to.
function invalidateRenderCaches(){
  __stockDeficitsCache = null;
  __actorPlaysIndexCache = null;
}
function render(){
  invalidateRenderCaches();
  const { page, param } = parseHash();
  document.getElementById('brandName').textContent = 'Camarim';
  document.getElementById('manageDataLabel').textContent = t('manage_data');
  document.getElementById('manageDataBtn').title = t('manage_data');
  syncLangButtons(state.lang);

  const crumb = document.getElementById('crumb');
  if(page === 'home'){
    crumb.innerHTML = '';
  } else {
    let extra = '';
    if(page === 'plays' && param){
      const p = findPlay(Number(param));
      if(p) extra = `<span class="sep">/</span><span class="current">${esc(p.name)}</span>`;
    }
    crumb.innerHTML = `<button type="button" class="crumb-home" onclick="go('home')">${esc(t('back_home'))}</button><span class="sep">/</span><span class="current">${esc((CRUMB_LABELS[page]||(()=>''))())}</span>${extra}`;
  }

  const app = document.getElementById('app');
  document.title = 'Camarim';
  if(page === 'home') app.innerHTML = renderHome();
  else if(page === 'actors') app.innerHTML = renderActors();
  else if(page === 'inventory') app.innerHTML = renderInventory();
  else if(page === 'calendar') app.innerHTML = renderCalendar();
  else if(page === 'plays' && !param) app.innerHTML = renderPlaysList();
  else if(page === 'plays' && param) app.innerHTML = renderPlayDetail(Number(param));
  else app.innerHTML = renderHome();

  window.scrollTo({top:0});
}

window.addEventListener('hashchange', render);
