    </div>
    ${state.plays.length ? `<div class="play-card-grid">${cards}</div>` : `<div class="empty-state card">${ICON.plays.replace('<svg','<svg class="icon"')}<p>${esc(t('no_plays'))}</p></div>`}
  </div>`;
}

let activeCharacterId = null;

function renderPlayDetail(playId){
  const play = findPlay(playId);
  if(!play) return renderPlaysList();
  // activeCharacterId is a single global, not scoped to a play — character
  // ids are assigned per-play starting from 1, so switching plays (e.g. via
  // the Peças list, which doesn't touch this variable) can leave it pointing
  // at a character id that belongs to the PREVIOUS play. Left unchecked,
  // that stale id either shows an unrelated character here (if the new play
  // happens to reuse the same id) or, if it doesn't match anything, wrongly
  // claims this play has no characters at all. Validate it against the
  // play actually being rendered, not just against being null.
  if(!play.characters.some(c=>c.id===activeCharacterId)){
    activeCharacterId = play.characters.length ? play.characters[0].id : null;
  }
  const st = playStats(play);
  const logo = play.logo || null;
  const linkedEvent = state.events.find(e=>e.playId===play.id);
  const deficits = computeStockDeficits();
  const playDeficits = Object.values(deficits).filter(d=>(d.deficit>0 || d.savedByShareable) && d.contributors.some(c=>c.playId===play.id));

  const charListHtml = play.characters.map(c=>{
    const cs = characterItemStats(c);
    const pct = cs.total ? Math.round(cs.resolved/cs.total*100) : 0;
    return `
    <button class="char-row ${c.id===activeCharacterId?'active':''}" onclick="activeCharacterId=${c.id}; renderPlayDetailInPlace(${play.id});">
      <span class="name">${esc(c.name)}</span>
      <span class="sub">${esc(t('total_label'))}: ${esc(c.total||'—')}</span>
      <span class="progress" title="${esc(t('progress_hint'))}"><div style="width:${pct}%"></div></span>
      <span class="sub progress-caption">${cs.resolved}/${cs.total} ${esc(t('progress_arrived_of_total'))}</span>
    </button>`;
  }).join('');

  const activeChar = play.characters.find(c=>c.id===activeCharacterId);

  return `
  <div class="page">
    <div class="play-hero">
      ${logo ? `<img src="${esc(logo)}" alt="${esc(play.name)}">` : `<h1>${esc(play.name)}</h1>`}
      <div class="play-stats">
        <div class="stat-pill"><span class="n">${st.characters}</span><span class="l">${esc(t('stat_characters'))}</span></div>
        <div class="stat-pill"><span class="n">${st.items}</span><span class="l">${esc(t('stat_items'))}</span></div>
        <div class="stat-pill"><span class="n">${st.pending}</span><span class="l">${esc(t('stat_pending_purchase'))}</span></div>
      </div>
      <div class="topbar-spacer"></div>
      <button class="btn btn-sm" onclick="openManageCastsModal(${play.id})" title="${esc(t('casts_manage_btn'))}">${esc(t('casts_manage_btn'))}</button>
      <button class="btn btn-sm" onclick="openEventModal(${linkedEvent?linkedEvent.id:'null'})" title="${esc(t('edit_event_details'))}">
        ${ICON.calendar}
        ${linkedEvent && linkedEvent.startDate ? esc(fmtDate(linkedEvent.startDate, state.lang)) : esc(t('no_date_set'))}
      </button>
    </div>

    ${playDeficits.length ? stockAlertHtml(playDeficits) : ''}

    <div class="planner-layout">
      <div>
        <div class="flex-between mb-8">
          <h4 class="small" style="text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-family:var(--font-body); font-weight:700;">${esc(t('characters'))}</h4>
          <button class="btn btn-icon btn-ghost btn-sm" title="${esc(t('character_add'))}" onclick="openCharacterModal(${play.id})">${ICON.plus}</button>
        </div>
        <div class="char-list">
          ${charListHtml || `<p class="small muted">${esc(t('no_characters'))}</p>`}
        </div>
      </div>
      <div id="charDetailPane">
        ${activeChar ? renderCharacterDetail(play, activeChar, deficits) : `<div class="empty-state card">${ICON.plays.replace('<svg','<svg class="icon"')}<p>${esc(t('no_characters'))}</p></div>`}
      </div>
    </div>
  </div>`;
}
function renderPlayDetailInPlace(playId){
  document.getElementById('app').innerHTML = renderPlayDetail(playId);
}

function renderCharacterDetail(play, ch, deficits){
  deficits = deficits || computeStockDeficits();

  function itemCardHtml(role, it){
    const invLinked = it.inventoryItemId ? findInvItem(it.inventoryItemId) : null;
    const deficit = it.inventoryItemId ? deficits[it.inventoryItemId] : null;
    const showDeficitWarning = deficit && (deficit.deficit > 0 || deficit.savedByShareable);
    const qtyVal = (it.qty===undefined || it.qty===null || it.qty==='') ? 1 : it.qty;
    const showSub = it.possession === 'faltando';
    // Vínculo e aviso de estoque viram ícones com dica (title) em vez de uma
    // linha de texto cada — com centenas de itens na tela, cada linha extra
    // por item custa caro em espaço; o texto completo ainda está ali, só que
    // sob demanda (passando o mouse) em vez de sempre visível.
    const linkTitle = invLinked
      ? `${t('link_inventory')}: ${invLinked.name} — ${t('unlink')}`
      : t('link_inventory');
    const warnTitle = !showDeficitWarning ? '' : deficit.deficit > 0
      ? `${t('stock_row_warning')}: ${deficit.deficit} (${t('stock_needs')} ${deficit.demand}, ${t('stock_has')} ${deficit.available}) — ${t('stock_used_in')}: ${deficit.contributors.map(c=>`${c.playName} (${c.castName}) · ${c.characterName}`).join(', ')}`
      : t('stock_saved_by_shareable');
    // Estado visual do card: aviso de falta de estoque manda em cima de tudo
    // (é o mais urgente); senão, resolvido (já possui) vs pendente (falta/
    // a definir) — assim dá pra bater o olho em centenas de itens e ver
    // na hora quais precisam de atenção.
    const cardState = (deficit && deficit.deficit > 0) ? 'is-warning'
      : (it.possession === 'acervo' || it.possession === 'emprestado') ? 'is-resolved'
      : 'is-pending';
    return `
    <div class="costume-item-card ${cardState}">
      <div class="costume-item-card-row">
        <input type="text" class="name-field" value="${esc(it.name)}" placeholder="${esc(t('col_item'))}" title="${esc(t('col_item'))}"
          onchange="updateRoleItemField(${play.id},${ch.id},${role.id},${it.id},'name',this.value)">
        <input type="text" style="width:44px;" value="${esc(it.size||'')}" placeholder="${esc(t('field_item_size_short'))}" title="${esc(t('field_item_size'))}"
          onchange="updateRoleItemField(${play.id},${ch.id},${role.id},${it.id},'size',this.value)">
        <input type="number" min="0" style="width:40px;" value="${qtyVal}" title="${esc(t('col_qty'))}"
          onchange="updateRoleItemField(${play.id},${ch.id},${role.id},${it.id},'qty',Math.max(0,parseInt(this.value,10)||0))">
        <select style="width:192px;" title="${esc(t('field_possession'))}" onchange="updateRoleItemPossession(${play.id},${ch.id},${role.id},${it.id},this.value)">
          ${selectOptions([['',t('possession_unset')],['acervo',t('possession_acervo')],['emprestado',t('possession_emprestado')],['faltando',t('possession_faltando')]], it.possession)}
        </select>
        ${showSub ? `
        <select style="width:164px;" title="${esc(t('purchase_status_label'))}" onchange="updateRoleItemField(${play.id},${ch.id},${role.id},${it.id},'purchaseStatus',this.value)">
          ${selectOptions([['a_comprar',t('purchase_a_comprar')],['comprado_aguardando',t('purchase_comprado_aguardando')]], it.purchaseStatus||'a_comprar')}
        </select>` : ''}
        <button class="btn btn-icon btn-ghost btn-sm ${invLinked?'is-linked':''}" title="${esc(linkTitle)}"
          onclick="${invLinked ? `unlinkRoleItemInventory(${play.id},${ch.id},${role.id},${it.id})` : `openLinkInventoryModalForRole(${play.id},${ch.id},${role.id},${it.id})`}">${ICON.link}</button>
        ${showDeficitWarning ? `<span class="item-warn-badge ${deficit.deficit>0?'':'caution'}" title="${esc(warnTitle)}">${deficit.deficit>0?'⚠️':'ℹ️'}</span>` : ''}
        <button class="btn btn-icon btn-ghost btn-sm" title="${esc(t('delete'))}" onclick="deleteRoleItem(${play.id},${ch.id},${role.id},${it.id})">${ICON.trash}</button>
      </div>
      <div class="costume-item-card-row">
        <textarea class="grow" rows="1" placeholder="${esc(t('item_notes_placeholder'))}" title="${esc(t('field_item_notes'))}"
          onchange="updateRoleItemField(${play.id},${ch.id},${role.id},${it.id},'notes',this.value)">${esc(it.notes||'')}</textarea>
      </div>
    </div>`;
  }

  function roleCardHtml(role){
    const actor = role.actorId ? findActor(role.actorId) : null;
    const label = actor ? actor.name : role.label;
    const ghost = !actor;
    const size = actor ? (actor.size||'') : '';
    const items = role.items||[];
    return `
    <div class="role-card">
      <div class="role-card-head">
        <div class="who">
          <span class="avatar-tag ${ghost?'ghost':''}" title="${ghost?esc(t('unmatched')):''}">${esc(label)}</span>
          ${size ? `<span class="pill">${esc(size)}</span>` : ''}
        </div>
        <div class="role-card-actions">
          <button class="btn btn-sm btn-ghost" onclick="addRoleItem(${play.id},${ch.id},${role.id})">${ICON.plus}${esc(t('item_add'))}</button>
          <button class="btn btn-icon btn-ghost btn-sm" title="${esc(t('remove'))}" onclick="removeRole(${play.id},${ch.id},${role.id})">${ICON.trash}</button>
        </div>
      </div>
      <div class="role-items">
        ${items.length ? items.map(it=>itemCardHtml(role,it)).join('') : `<p class="small muted">${esc(t('no_items_yet'))}</p>`}
      </div>
    </div>`;
  }

  const castSectionsHtml = (play.casts||[]).map(cast=>{
    const roles = (ch.roles||[]).filter(r=>r.castId===cast.id);
    const desired = ch.castCounts ? ch.castCounts[cast.id] : '';
    return `
    <div class="role-section">
      <h5>${esc(cast.name)} ${desired ? `<span class="count-badge">${esc(t('cast_count_label'))}: ${esc(desired)}</span>` : ''}</h5>
      ${roles.length ? roles.map(roleCardHtml).join('') : `<p class="small muted">${esc(t('no_roles_yet'))}</p>`}
      <button class="btn btn-sm btn-ghost" onclick="openAddCastMemberModal(${play.id},${ch.id},${cast.id})">${ICON.plus}${esc(t('select_actor_add'))}</button>
    </div>`;
  }).join('');

  return `
    <div class="card" style="padding:20px; margin-bottom:16px;">
      <div class="flex-between mb-8">
        <h3 style="font-size:1.3rem;">${esc(ch.name)}</h3>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-sm btn-ghost" onclick="openCharacterModal(${play.id}, ${ch.id})">${ICON.edit} ${esc(t('edit'))}</button>
          <button class="btn btn-sm btn-danger" onclick="deleteCharacter(${play.id},${ch.id})">${ICON.trash} ${esc(t('delete'))}</button>
        </div>
      </div>
      ${(play.casts||[]).length ? castSectionsHtml : `<p class="small muted">${esc(t('no_casts_yet_hint'))}</p>`}
    </div>
  `;
}

function findRole(ch, roleId){ return (ch.roles||[]).find(r=>r.id===roleId); }
function updateRoleItemField(playId, chId, roleId, itemId, field, value){
  mutate(s=>{
    const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
    const role = findRole(ch, roleId);
    const it = role.items.find(i=>i.id===itemId);
    it[field] = value;
  });
}
// Changing possession away from "faltando" clears any purchase sub-status
// left over from before (it's only meaningful while the item is actually
// missing), and switching TO "acervo" with nothing linked yet opens the
// inventory picker right away — per the spec, linking is how an empty item
// gets its name/size filled in and its possession double-checked, so this
// is the natural next step rather than a separate action the user has to
// remember to take.
function updateRoleItemPossession(playId, chId, roleId, itemId, value){
  let openPicker = false;
  mutate(s=>{
    const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
    const role = findRole(ch, roleId);
    const it = role.items.find(i=>i.id===itemId);
    it.possession = value;
    if(value !== 'faltando') it.purchaseStatus = '';
    else if(!it.purchaseStatus) it.purchaseStatus = 'a_comprar';
    if(value === 'acervo' && !it.inventoryItemId) openPicker = true;
  }).then(()=>{ if(openPicker) openLinkInventoryModalForRole(playId, chId, roleId, itemId); });
}
function addRoleItem(playId, chId, roleId){
  mutate(s=>{
    const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
    const role = findRole(ch, roleId);
    const id = nextId(role.items);
    role.items.push({ id, name:'', size:'', qty:1, possession:'', purchaseStatus:'', notes:'', inventoryItemId:null });
  });
  toast(t('toast_saved'));
}
function deleteRoleItem(playId, chId, roleId, itemId){
  confirmAction(t('delete_item_confirm'), ()=>{
    mutate(s=>{
      const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
      const role = findRole(ch, roleId);
      role.items = role.items.filter(i=>i.id!==itemId);
    });
    closeModal();
  });
}
function unlinkRoleItemInventory(playId, chId, roleId, itemId){
  mutate(s=>{
    const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
    const role = findRole(ch, roleId);
    const it = role.items.find(i=>i.id===itemId);
    it.inventoryItemId = null;
    it.possession = '';
  });
}
function openLinkInventoryModalForRole(playId, chId, roleId, itemId){
  openModal(`
    <div class="modal-head"><h3>${esc(t('pick_inventory_item'))}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <input type="search" placeholder="${esc(t('inv_search_placeholder'))}" id="linkInvSearch" oninput="debouncedFilterLinkInvList(this.value)">
    <div id="linkInvList" style="max-height:340px; overflow-y:auto; margin-top:12px; display:flex; flex-direction:column; gap:6px;"></div>
  `, {wide:true});
  window.__linkCtx = { playId, chId, roleId, itemId };
  filterLinkInvList('');
}
function filterLinkInvList(q){
  const parsed = parseInvQuery(q);
  const list = state.inventory.filter(i=>invItemMatches(i, parsed)).slice(0,60);
  const html = list.map(i=>`
    <button class="btn" style="justify-content:flex-start; text-align:left; width:100%;" onclick="chooseLinkInventory(${i.id})">
      <span>${hlHtml(i.name, parsed.terms, 'text')}
        ${i.size ? `<span class="pill">${hlHtml(i.size, parsed.terms, 'size')}</span>` : ''}
        ${sectionKey(i.section) ? `<span class="muted small">· ${hlHtml(i.section, parsed.terms, 'text')}</span>` : ''}</span>
    </button>`).join('');
  const box = document.getElementById('linkInvList');
  if(box) box.innerHTML = html || `<p class="small muted">${esc(t('no_inventory'))}</p>`;
}
const debouncedFilterLinkInvList = debounce(filterLinkInvList, 120);
// Linking imports the inventory item's own name/size into the costume item
// (so the user doesn't retype what the acervo already knows) and sets
// possession to "acervo" — the stock-deficit warning for this inventory
// item then recomputes automatically on next render, since it's driven
// purely off which items have an inventoryItemId, not a separate flag.
function chooseLinkInventory(invId){
  const { playId, chId, roleId, itemId } = window.__linkCtx;
  mutate(s=>{
    const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
    const role = findRole(ch, roleId);
    const it = role.items.find(i=>i.id===itemId);
    const inv = findInvItem(invId);
    it.inventoryItemId = invId;
    it.possession = 'acervo';
    it.purchaseStatus = '';
    if(!it.name && inv) it.name = inv.name;
    if(!it.size && inv && inv.size) it.size = inv.size;
  });
  closeModal();
  toast(t('toast_saved'));
}

function openCharacterModal(playId, chId){
  const play = findPlay(playId);
  const ch = chId ? play.characters.find(c=>c.id===chId) : { name:'', total:'', castCounts:{} };
  const counts = ch.castCounts || {};
  const castFieldsHtml = (play.casts||[]).map(cast=>`
    <div class="field"><label>${esc(cast.name)} — ${esc(t('cast_count_label'))}</label>
      <input type="text" id="mChCount${cast.id}" value="${esc(counts[cast.id]||'')}"></div>
  `).join('') || `<p class="small muted">${esc(t('no_casts_yet_hint'))}</p>`;
  openModal(`
    <div class="modal-head"><h3>${esc(chId?t('character_edit'):t('character_add'))}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="field"><label>${esc(t('field_charname'))}</label><input type="text" id="mChName" value="${esc(ch.name)}"></div>
    <div class="field"><label>${esc(t('total_label'))}</label><input type="text" id="mChTotal" value="${esc(ch.total||'')}"></div>
    ${castFieldsHtml}
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${esc(t('cancel'))}</button>
      <button class="btn btn-primary" onclick="saveCharacterModal(${playId}, ${chId||'null'})">${esc(t('save'))}</button>
    </div>
  `);
}
function saveCharacterModal(playId, chId){
  const name = document.getElementById('mChName').value.trim();
  const total = document.getElementById('mChTotal').value.trim();
  if(!name) return;
  mutate(s=>{
    const play = findPlay(playId);
    const castCounts = {};
    (play.casts||[]).forEach(cast=>{
      const input = document.getElementById('mChCount'+cast.id);
      if(input) castCounts[cast.id] = input.value.trim();
    });
    if(chId){
      const ch = play.characters.find(c=>c.id===chId);
      ch.name = name; ch.total = total; ch.castCounts = castCounts;
    } else {
      const id = nextId(play.characters);
      play.characters.push({ id, name, total, roles:[], castCounts });
      activeCharacterId = id;
    }
  });
  closeModal();
  toast(t('toast_saved'));
}
function deleteCharacter(playId, chId){
  confirmAction(t('delete_character_confirm'), ()=>{
    mutate(s=>{
      const play = findPlay(playId);
      play.characters = play.characters.filter(c=>c.id!==chId);
      if(activeCharacterId === chId) activeCharacterId = play.characters.length ? play.characters[0].id : null;
    });
    closeModal();
  });
}
// Removing a role now also destroys everything in its item list — more
// destructive than it used to be (it just dropped a chip before), so this
// gets a confirmation it never needed before.
function removeRole(playId, chId, roleId){
  confirmAction(t('role_remove_confirm'), ()=>{
    mutate(s=>{
      const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
      ch.roles = (ch.roles||[]).filter(r=>r.id!==roleId);
    });
    closeModal();
  });
}
function openAddCastMemberModal(playId, chId, castId){
  openModal(`
    <div class="modal-head"><h3>${esc(t('select_actor_add'))}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <input type="search" placeholder="${esc(t('search_placeholder'))}" id="castSearch" oninput="debouncedFilterCastPickList(this.value)">
    <div id="castPickList" style="max-height:300px; overflow-y:auto; margin-top:12px; display:flex; flex-direction:column; gap:4px;"></div>
  `);
  window.__castCtx = { playId, chId, castId };
  filterCastPickList('');
}
function filterCastPickList(q){
  const list = state.actors.filter(a=>!q || a.name.toLowerCase().includes(q.toLowerCase())).slice(0,80);
  const html = list.map(a=>`<button class="btn" style="justify-content:flex-start; width:100%;" onclick="chooseCastMember(${a.id})">${esc(a.name)} <span class="muted small">(${esc(classNameList(a).join(', ') || t('no_classes_badge'))})</span></button>`).join('');
  const box = document.getElementById('castPickList');
  if(box) box.innerHTML = html || `<p class="small muted">${esc(t('no_actors'))}</p>`;
}
const debouncedFilterCastPickList = debounce(filterCastPickList, 120);
function chooseCastMember(actorId){
  const { playId, chId, castId } = window.__castCtx;
  mutate(s=>{
    const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
    if(!Array.isArray(ch.roles)) ch.roles = [];
    ch.roles.push({ id: nextId(ch.roles), castId, actorId, label: findActor(actorId).name, items: [] });
  });
  closeModal();
}

/* -----------------------------------------------------------------------
   Elencos (casts) por peça — número e nomes de elenco não são mais fixos;
   cada peça tem sua própria lista (play.casts), gerenciada aqui no mesmo
   padrão do modal de turmas (openManageClassesModal).
----------------------------------------------------------------------- */
function openManageCastsModal(playId){
  openModal(`
    <div class="modal-head"><h3>${esc(t('casts_manage_title'))}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p class="small muted mb-16">${esc(t('casts_manage_desc'))}</p>
    <div id="castsManageList">${castsManageListHtml(playId)}</div>
    <div class="field mt-16" style="display:flex; gap:8px;">
      <input type="text" id="newCastManageInput" placeholder="${esc(t('casts_name_placeholder'))}" style="flex:1;"
        onkeydown="if(event.key==='Enter'){event.preventDefault(); addCastFromManageModal(${playId});}">
      <button class="btn btn-primary" onclick="addCastFromManageModal(${playId})">${ICON.plus}${esc(t('casts_add_btn'))}</button>
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal(); renderPlayDetailInPlace(${playId});">${esc(t('close'))}</button></div>
  `);
}
function castsManageListHtml(playId){
  const play = findPlay(playId);
  const list = play.casts||[];
  if(!list.length) return `<p class="small muted">${esc(t('casts_empty'))}</p>`;
  return list.map(c=>`
    <div style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line);">
      <input type="text" value="${esc(c.name)}" style="flex:1;" onchange="renameCast(${playId}, ${c.id}, this.value)">
      <button class="btn btn-icon btn-ghost btn-sm" title="${esc(t('delete'))}" onclick="deleteCastConfirm(${playId}, ${c.id})">${ICON.trash}</button>
    </div>`).join('');
}
async function addCastFromManageModal(playId){
  const input = document.getElementById('newCastManageInput');
  const name = input.value.trim();
  if(!name) return;
  await mutate(s=>{
    const play = findPlay(playId);
    if(!Array.isArray(play.casts)) play.casts = [];
    play.casts.push({ id: nextId(play.casts), name });
  });
  input.value = '';
  const box = document.getElementById('castsManageList');
  if(box) box.innerHTML = castsManageListHtml(playId);
}
async function renameCast(playId, castId, value){
  const name = value.trim();
  if(!name) return;
  await mutate(s=>{
    const play = findPlay(playId);
    const c = (play.casts||[]).find(x=>x.id===castId);
    if(c) c.name = name;
  });
  toast(t('toast_saved'));
}
function deleteCastConfirm(playId, castId){
  confirmAction(t('casts_delete_confirm'), ()=>{
    mutate(s=>{
      const play = findPlay(playId);
      play.casts = (play.casts||[]).filter(c=>c.id!==castId);
      play.characters.forEach(ch=>{
        ch.roles = (ch.roles||[]).filter(r=>r.castId!==castId);
        if(ch.castCounts) delete ch.castCounts[castId];
      });
    });
    toast(t('toast_deleted'));
    const box = document.getElementById('castsManageList');
    if(box) box.innerHTML = castsManageListHtml(playId);
  });
}

/* =======================================================================
   GERENCIAR DADOS — modal com backup (baixar/restaurar um arquivo .json
   com todos os dados) e recarregar da planilha na hora.
======================================================================= */

function openDataManagerModal(){
  // Sem estado carregado ainda (site não configurado, ou falha ao carregar):
  // não há nada pra fazer backup de, nem como salvar uma restauração.
  if(!state){
    toast(t(apiConfigured() ? 'sync_error' : 'sync_offline'));
    return;
  }
  openModal(`
    <div class="modal-head"><h3>${esc(t('manage_data_title'))}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>

    <div class="field">
      <label>${esc(t('backup_section_title'))}</label>
      <p class="small muted mt-8">${esc(t('backup_section_desc'))}</p>
      <button class="btn mt-8" onclick="downloadBackup()">${ICON.download}${esc(t('backup_download_btn'))}</button>
    </div>

    <div class="field mt-16">
      <label>${esc(t('restore_section_title'))}</label>
      <p class="small muted mt-8">${esc(t('restore_section_desc'))}</p>
      <input type="file" accept="application/json,.json" id="restoreBackupInput" style="display:none" onchange="handleBackupFileSelected(this)">
      <button class="btn mt-8" onclick="document.getElementById('restoreBackupInput').click()">${ICON.upload}${esc(t('restore_choose_file_btn'))}</button>
    </div>

    <div class="field mt-16">
      <label>${esc(t('reload_section_title'))}</label>
      <p class="small muted mt-8">${esc(t('reload_section_desc'))}</p>
      <button class="btn mt-8" onclick="closeModal(); reloadFromSheet();">${ICON.undo}${esc(t('reload_section_btn'))}</button>
    </div>

    <div class="field mt-16">
      <label>${esc(t('forget_section_title'))}</label>
      <p class="small muted mt-8">${esc(t('forget_section_desc'))}</p>
      <button class="btn mt-8" onclick="forgetThisDevice()">${esc(t('forget_section_btn'))}</button>
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${esc(t('close'))}</button>
    </div>
  `);
}

// Baixa o estado atual como um arquivo .json — pode ser usado depois em
// "Restaurar backup" (nesta máquina ou em qualquer outra).
function downloadBackup(){
  try{
    const { lang, ...rest } = state;
    const payload = { __camarim_backup: true, exportedAt: new Date().toISOString(), state: rest };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'camarim_backup_' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){ /* best effort — some preview sandboxes block downloads */ }
}

// Lê o arquivo escolhido, valida um mínimo de formato e pede confirmação
// antes de substituir tudo (ação destrutiva).
function handleBackupFileSelected(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast(t('toast_backup_invalid')); return; }
    // Aceita também o marcador antigo (__backstage_backup): backups feitos antes
    // da volta ao nome Camarim continuam restauráveis.
    const candidate = (parsed && (parsed.__camarim_backup || parsed.__backstage_backup) && parsed.state) ? parsed.state : parsed;
    if(!candidate || typeof candidate !== 'object' || !Array.isArray(candidate.actors) || !Array.isArray(candidate.inventory)){
      toast(t('toast_backup_invalid'));
      return;
    }
    closeModal();
    confirmAction(t('confirm_restore_backup_msg'), ()=>{ applyBackup(candidate); }, {
      title: t('restore_section_title'),
      confirmLabel: t('restore_confirm_btn'),
    });
  };
  reader.onerror = ()=>{ toast(t('toast_backup_invalid')); };
  reader.readAsText(file);
}

// Substitui o estado local pelo backup e salva na planilha (last-write-wins,
// como qualquer outra edição).
async function applyBackup(newState){
  const lang = state.lang;
  state = newState;
  state.lang = lang;
  normalizeState(state);
  const ok = await commitAndSave();
  if(ok) toast(t('toast_backup_restored'));
}

// Busca o estado mais recente da planilha na hora, sem esperar o próximo
// ciclo automático (útil logo depois que alguém mexeu direto na planilha).
// Não é destrutivo: só troca o que está na tela pelo que já está salvo.
async function reloadFromSheet(){
  const lang = state.lang;
  setSyncStatus('saving');
  try{
    const fresh = await apiGet();
    state = fresh;
    state.lang = lang;
    normalizeState(state);
    dirty = false;
    render();
    setSyncStatus('saved');
    toast(t('toast_reset'));
  }catch(e){ setSyncStatus('error'); toast(t('sync_error')); }
}

/* =======================================================================
   INIT
======================================================================= */
// Token recusado pelo servidor (nunca informado, errado, ou trocado depois no
// Apps Script): esquece o token guardado e volta pra tela que pede o token.
function handleBadToken(){
  const hadToken = !!API_TOKEN;
  storeToken('');
  tokenRejected = hadToken;
  clearTimeout(pollTimer);
  state = null; dirty = false;
  if(document.getElementById('activeModalOverlay')) closeModal();
  lastScreenState = 'token_needed';
  setSyncStatus('offline');
  renderStaticScreen();
}
function showTokenScreen(){
  document.getElementById('app').innerHTML = `
    <div class="full-screen-msg">
      <h2>${esc(t('token_title'))}</h2>
      <p>${esc(t('token_body'))}</p>
      <input type="password" id="tokenInput" autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="${esc(t('token_placeholder'))}"
             onkeydown="if(event.key==='Enter') submitToken()">
      ${tokenRejected ? `<p class="token-error">${esc(t('token_wrong'))}</p>` : ''}
      <button class="btn btn-primary" onclick="submitToken()">${esc(t('token_btn'))}</button>
    </div>`;
  const inp = document.getElementById('tokenInput');
  if(inp) inp.focus();
}
function submitToken(){
  const inp = document.getElementById('tokenInput');
  const tok = inp ? inp.value.trim() : '';
  if(!tok) return;
  storeToken(tok);
  tokenRejected = false;
  init();
}
// "Sair deste aparelho": esquece o token guardado aqui (útil em computador/
// tablet compartilhado). Os dados continuam na planilha.
function forgetThisDevice(){
  closeModal();
  clearTimeout(pollTimer);
  storeToken('');
  tokenRejected = false;
  state = null; dirty = false;
  lastScreenState = 'token_needed';
  setSyncStatus('offline');
  renderStaticScreen();
}

function showFullScreenMessage(title, body, opts){
  opts = opts || {};
  document.getElementById('app').innerHTML = `
    <div class="full-screen-msg">
      <h2>${esc(title)}</h2>
      <p>${esc(body)}</p>
      ${opts.retry ? `<button class="btn btn-primary" onclick="init()">${esc(t('retry'))}</button>` : ''}
    </div>`;
}

// Preenche o rótulo do botão "Gerenciar dados" e o indicador de sincronização
// já de cara — sem isso, enquanto o site não está configurado (ou antes do
// primeiro carregamento terminar), esses elementos ficam com o texto vazio:
// o indicador vira só uma bolinha solta e o botão fica sem legenda, com
// aparência quebrada/desalinhada.
function initTopbarChrome(){
  const lbl = document.getElementById('manageDataLabel');
  const btn = document.getElementById('manageDataBtn');
  if(lbl) lbl.textContent = t('manage_data');
  if(btn) btn.title = t('manage_data');
  setSyncStatus(lastSyncKind);   // reescreve o rótulo no idioma atual
  syncLangButtons(uiLang);
}

// Enquanto não há state (não configurado, ou falha ao carregar), a única
// coisa na tela é uma destas duas mensagens de tela cheia. Guardamos qual
// delas está ativa pra poder re-desenhar no idioma certo se alguém trocar
// PT/EN nesse meio-tempo (setLang() chama isso quando state ainda é null).
let lastScreenState = 'loading';
function renderStaticScreen(){
  if(lastScreenState === 'config_missing'){
    showFullScreenMessage(t('config_missing_title'), t('config_missing_body'));
  } else if(lastScreenState === 'token_needed'){
    showTokenScreen();
  } else if(lastScreenState === 'load_error'){
    showFullScreenMessage(t('loading_error_title'), t('loading_error_body'), { retry: true });
  }
}

async function init(){
  initTopbarChrome();
  if(!apiConfigured()){
    lastScreenState = 'config_missing';
    setSyncStatus('offline');
    renderStaticScreen();
    return;
  }
  setSyncStatus('offline');
  try{
    state = await loadState();
    lastScreenState = 'ready';
    render();
    setSyncStatus('saved');
    startPolling();
  }catch(e){
    if(e && e.message === 'token_invalido'){ handleBadToken(); return; }
    lastScreenState = 'load_error';
    setSyncStatus('error');
    renderStaticScreen();
  }
}
init();

</script>
