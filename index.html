let actorsFilter = { group: 'all', play: 'all', q: '', sort: 'name' };

// One entry per PLAY an actor is part of (grouped across all their characters
// in that play), with a past/upcoming/unscheduled status derived from the
// play's linked event date — this is what drives the "Peças" column below.
// actorPlaysFor(actorId) used to re-scan every play/character/cast-name from
// scratch for EACH actor it was asked about — fine for one actor, but
// renderActors() calls it once per actor in the list, turning a page with
// many actors and several plays into a lot of repeated work on every
// render. actorPlaysIndex() does that same walk just once and groups the
// result by actor; actorPlaysFor() then becomes a cheap lookup into it.
let __actorPlaysIndexCache = null;
function actorPlaysIndex(){
  if(__actorPlaysIndexCache) return __actorPlaysIndexCache;
  const todayStr = todayLocalStr();
  const map = new Map();
  state.plays.forEach(play=>{
    const charsByActor = new Map();
    play.characters.forEach(ch=>{
      (ch.roles||[]).forEach(r=>{
        if(r.actorId === null || r.actorId === undefined) return;
        if(!charsByActor.has(r.actorId)) charsByActor.set(r.actorId, []);
        charsByActor.get(r.actorId).push({ characterId: ch.id, character: ch.name, castId: r.castId });
      });
    });
    if(!charsByActor.size) return;
    const event = state.events.find(e=>e.playId === play.id);
    let status = 'unscheduled';
    if(event && event.startDate) status = event.startDate >= todayStr ? 'upcoming' : 'past';
    charsByActor.forEach((chars, actorId)=>{
      if(!map.has(actorId)) map.set(actorId, []);
      map.get(actorId).push({ playId: play.id, playName: play.name, chars, status, eventDate: event ? event.startDate : null });
    });
  });
  const order = { upcoming:0, unscheduled:1, past:2 };
  map.forEach(list=>{
    list.sort((a,b)=>{
      if(order[a.status] !== order[b.status]) return order[a.status]-order[b.status];
      return (a.eventDate||'').localeCompare(b.eventDate||'');
    });
  });
  __actorPlaysIndexCache = map;
  return map;
}
function actorPlaysFor(actorId){
  return actorPlaysIndex().get(actorId) || [];
}

function renderActors(){
  const classList = [...(state.classes||[])].sort((a,b)=>a.name.localeCompare(b.name));
  const plays = [...state.plays].sort((a,b)=>a.name.localeCompare(b.name));
  const dupGroups = findDuplicateActorGroups();

  let list = state.actors.filter(a=>{
    if(actorsFilter.group === 'none'){ if((a.classIds||[]).length) return false; }
    else if(actorsFilter.group !== 'all'){ if(!(a.classIds||[]).includes(Number(actorsFilter.group))) return false; }
    if(actorsFilter.q && !a.name.toLowerCase().includes(actorsFilter.q.toLowerCase())) return false;
    return true;
  }).map(a=>({ actor:a, plays: actorPlaysFor(a.id) }));

  if(actorsFilter.play !== 'all'){
    list = actorsFilter.play === 'none'
      ? list.filter(x=>!x.plays.length)
      : list.filter(x=>x.plays.some(p=>p.playId === Number(actorsFilter.play)));
  }

  const statusRank = { upcoming:0, unscheduled:1, past:2 };
  list.sort((x,y)=>{
    if(actorsFilter.sort === 'group'){
      const g = classNameList(x.actor).join(', ').localeCompare(classNameList(y.actor).join(', '));
      return g || x.actor.name.localeCompare(y.actor.name);
    }
    if(actorsFilter.sort === 'plays'){
      return (y.plays.length - x.plays.length) || x.actor.name.localeCompare(y.actor.name);
    }
    if(actorsFilter.sort === 'upcoming'){
      const rx = x.plays.length ? statusRank[x.plays[0].status] : 3;
      const ry = y.plays.length ? statusRank[y.plays[0].status] : 3;
      if(rx !== ry) return rx - ry;
      const dx = x.plays.length ? (x.plays[0].eventDate||'') : '';
      const dy = y.plays.length ? (y.plays[0].eventDate||'') : '';
      return dx.localeCompare(dy) || x.actor.name.localeCompare(y.actor.name);
    }
    return x.actor.name.localeCompare(y.actor.name);
  });

  const selectedPlay = (actorsFilter.play !== 'all' && actorsFilter.play !== 'none') ? findPlay(Number(actorsFilter.play)) : null;

  const rows = list.map(({actor:a, plays})=>{
    const playsHtml = plays.length
      ? plays.map(p=>{
          const charNames = p.chars.map(c=>c.character).join(', ');
          const statusLabel = p.status==='upcoming' ? t('status_upcoming') : p.status==='past' ? t('status_past') : t('status_unscheduled');
          return `<span class="play-tag ${p.status}" title="${esc(charNames)} — ${esc(statusLabel)}" onclick="event.stopPropagation(); activeCharacterId=${p.chars[0].characterId}; go('plays', ${p.playId});">
            <span class="dot"></span>${esc(p.playName)}<span class="muted">· ${esc(charNames)}</span>
          </span>`;
        }).join(' ')
      : `<span class="avatar-tag ghost">${esc(t('no_role_assigned'))}</span>`;
    return `
      <tr class="row-clickable" onclick="openActorModal(${a.id})">
        <td><strong>${esc(a.name)}</strong></td>
        <td><div class="class-pill-list">${classPillsHtml(a)}</div></td>
        <td><div class="play-tag-list">${playsHtml}</div></td>
        <td>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-icon btn-ghost" title="${esc(t('edit'))}" onclick="event.stopPropagation(); openActorModal(${a.id})">${ICON.edit}</button>
            <button class="btn btn-icon btn-ghost" title="${esc(t('delete'))}" onclick="event.stopPropagation(); deleteActor(${a.id})">${ICON.trash}</button>
          </div>
        </td>
      </tr>`;
  }).join('');

  return `
  <div class="page">
    <div class="page-header">
      <div><h1>${esc(t('actors_title'))}</h1><p class="sub">${esc(t('actors_sub'))}</p></div>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="openManageClassesModal()">${esc(t('classes_manage_btn'))}</button>
        <button class="btn btn-primary" onclick="openActorModal()">${ICON.plus}${esc(t('actor_add'))}</button>
      </div>
    </div>
    ${dupGroups.length ? `
    <div class="dup-banner">
      <span class="pill warning">${dupGroups.length}</span>
      <span><strong>${esc(t('duplicates_banner_title'))}</strong></span>
      <button class="btn btn-sm" onclick="openMergeDuplicatesModal()">${esc(t('duplicates_review_btn'))}</button>
    </div>` : ''}
    <div class="toolbar">
      <input class="search" type="search" placeholder="${esc(t('search_placeholder'))}" value="${esc(actorsFilter.q)}"
        oninput="actorsFilter.q=this.value; debouncedRenderActorsInPlace();">
      <div class="chipbar">
        <button class="chip ${actorsFilter.group==='all'?'active':''}" onclick="actorsFilter.group='all'; render();">${esc(t('all'))}</button>
        ${classList.map(c=>`<button class="chip ${actorsFilter.group===String(c.id)?'active':''}" onclick="actorsFilter.group='${c.id}'; render();">${esc(c.name)}</button>`).join('')}
        <button class="chip ${actorsFilter.group==='none'?'active':''}" onclick="actorsFilter.group='none'; render();">${esc(t('no_classes_badge'))}</button>
      </div>
    </div>
    <div class="toolbar">
      <div class="chipbar">
        <span class="toolbar-label">${esc(t('filter_play'))}:</span>
        <button class="chip ${actorsFilter.play==='all'?'active':''}" onclick="actorsFilter.play='all'; render();">${esc(t('all'))}</button>
        ${plays.map(p=>`<button class="chip ${actorsFilter.play===String(p.id)?'active':''}" onclick="actorsFilter.play='${p.id}'; render();">${esc(p.name)}</button>`).join('')}
        <button class="chip ${actorsFilter.play==='none'?'active':''}" onclick="actorsFilter.play='none'; render();">${esc(t('no_play'))}</button>
      </div>
      <div class="topbar-spacer"></div>
      <label class="toolbar-label" for="actorsSortSelect">${esc(t('sort_by'))}</label>
      <select id="actorsSortSelect" style="width:auto;" onchange="actorsFilter.sort=this.value; render();">
        <option value="name" ${actorsFilter.sort==='name'?'selected':''}>${esc(t('sort_name'))}</option>
        <option value="group" ${actorsFilter.sort==='group'?'selected':''}>${esc(t('sort_group'))}</option>
        <option value="plays" ${actorsFilter.sort==='plays'?'selected':''}>${esc(t('sort_plays'))}</option>
        <option value="upcoming" ${actorsFilter.sort==='upcoming'?'selected':''}>${esc(t('sort_upcoming'))}</option>
      </select>
    </div>
    ${selectedPlay ? renderActorsCastSectionsHtml(selectedPlay, list) : (list.length ? `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>${esc(t('col_name'))}</th><th>${esc(t('col_group'))}</th><th>${esc(t('col_plays'))}</th><th></th>
        </tr></thead>
        <tbody id="actorsTbody">${rows}</tbody>
      </table>
    </div>` : `<div class="empty-state card">${ICON.actors.replace('<svg','<svg class="icon"')}<p>${esc(t('no_actors'))}</p></div>`)}
  </div>`;
}
function renderActorsInPlace(){
  // Guards against a debounced call landing after the user has already
  // navigated to a different page — without this, #app (shared by every
  // page) could get the Actors list stamped over whatever is showing now.
  if(parseHash().page !== 'actors') return;
  document.getElementById('app').innerHTML = renderActors();
}
const debouncedRenderActorsInPlace = debounce(renderActorsInPlace, 140);
function classPillsHtml(actor){
  const names = classNameList(actor);
  return names.length ? names.map(n=>`<span class="pill accent">${esc(n)}</span>`).join('') : '—';
}

// Quando a busca de Elenco está filtrada numa peça específica, separa os
// resultados por elenco (cast1/cast2 da peça, com os rótulos que a peça já
// usa em "Planejamento por Peça") em vez de uma lista única — um ator pode
// aparecer em mais de uma seção se tiver personagens em elencos diferentes
// da mesma peça.
function renderActorsCastSectionsHtml(play, list){
  const sections = (play.casts||[]).map(cast=>{
    const rowsForCast = list.filter(x=>x.plays.some(p=>p.playId===play.id && p.chars.some(c=>c.castId===cast.id)));
    if(!rowsForCast.length) return '';
    const rows = rowsForCast.map(({actor:a, plays})=>{
      const p = plays.find(pp=>pp.playId===play.id);
      const charsForCast = p.chars.filter(c=>c.castId===cast.id).map(c=>c.character).join(', ');
      return `<tr class="row-clickable" onclick="openActorModal(${a.id})">
        <td><strong>${esc(a.name)}</strong></td>
        <td><div class="class-pill-list">${classPillsHtml(a)}</div></td>
        <td>${esc(charsForCast)}</td>
        <td><div style="display:flex; gap:6px;">
          <button class="btn btn-icon btn-ghost" title="${esc(t('edit'))}" onclick="event.stopPropagation(); openActorModal(${a.id})">${ICON.edit}</button>
          <button class="btn btn-icon btn-ghost" title="${esc(t('delete'))}" onclick="event.stopPropagation(); deleteActor(${a.id})">${ICON.trash}</button>
        </div></td>
      </tr>`;
    }).join('');
    return `
    <div class="cast-search-block">
      <h4>${esc(cast.name || t('cast_section_other'))}</h4>
      <div class="table-wrap">
        <table>
          <thead><tr><th>${esc(t('col_name'))}</th><th>${esc(t('col_group'))}</th><th>${esc(t('col_roles'))}</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
  return sections || `<div class="empty-state card">${ICON.actors.replace('<svg','<svg class="icon"')}<p>${esc(t('no_actors'))}</p></div>`;
}

      </div>

function switchActorModalTab(tab){
  document.querySelectorAll('.modal-tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.modal-tab-panel').forEach(p=>p.classList.toggle('active', p.dataset.tabPanel===tab));
}
function actorClassPickerHtml(){
  const classList = [...(state.classes||[])].sort((a,b)=>a.name.localeCompare(b.name));
  if(!classList.length) return `<p class="small muted">${esc(t('actor_classes_empty'))}</p>`;
  return classList.map(c=>`<button type="button" class="class-chip ${(window.__actorModalClassIds||[]).includes(c.id)?'active':''}" onclick="toggleActorModalClass(${c.id}, this)">${esc(c.name)}</button>`).join('');
}
function toggleActorModalClass(classId, btn){
  const ids = window.__actorModalClassIds || (window.__actorModalClassIds = []);
  const idx = ids.indexOf(classId);
  if(idx === -1) ids.push(classId); else ids.splice(idx,1);
  btn.classList.toggle('active');
}
async function addClassInlineFromActorModal(){
  const input = document.getElementById('newClassInlineInput');
  const name = input.value.trim();
  if(!name) return;
  let newId = null;
  const ok = await mutate(s=>{
    s.classes = s.classes || [];
    newId = nextId(s.classes);
    s.classes.push({ id:newId, name });
  });
  if(ok){
    input.value = '';
    (window.__actorModalClassIds = window.__actorModalClassIds || []).push(newId);
    const box = document.getElementById('actorClassPicker');
    if(box) box.innerHTML = actorClassPickerHtml();
  }
}
function saveActorModal(id){
  const name = document.getElementById('mActorName').value.trim();
  const size = document.getElementById('mActorSize').value.trim();
  const phone = document.getElementById('mActorPhone').value.trim();
  const email = document.getElementById('mActorEmail').value.trim();
  const notes = document.getElementById('mActorNotes').value.trim();
  const classIds = (window.__actorModalClassIds||[]).slice();
  if(!name){ toast(t('name')+'?'); return; }
  mutate(s=>{
    if(id){
      const a = findActor(id);
      a.name=name; a.classIds=classIds; a.size=size; a.phone=phone; a.email=email; a.notes=notes;
    } else {
      s.actors.push({ id:nextId(s.actors), name, classIds, size, phone, email, notes });
    }
  });
  window.__actorModalClassIds = null;
  closeModal();
  toast(t('toast_saved'));
}
function deleteActor(id){
  confirmAction(t('confirm_delete_msg'), ()=>{
    mutate(s=>{ s.actors = s.actors.filter(a=>a.id!==id); });
    toast(t('toast_deleted'));
  });
}

/* -----------------------------------------------------------------------
   Turmas / grupos — catálogo livre, editável a qualquer momento. Remover
   uma turma só tira a marcação dos alunos que a tinham (nunca apaga o
   aluno), tanto aqui quanto na mesclagem de duplicatas abaixo.
----------------------------------------------------------------------- */
function openManageClassesModal(){
  openModal(`
    <div class="modal-head"><h3>${esc(t('classes_manage_title'))}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p class="small muted mb-16">${esc(t('classes_manage_desc'))}</p>
    <div id="classesManageList">${classesManageListHtml()}</div>
    <div class="field mt-16" style="display:flex; gap:8px;">
      <input type="text" id="newClassManageInput" placeholder="${esc(t('classes_name_placeholder'))}" style="flex:1;"
        onkeydown="if(event.key==='Enter'){event.preventDefault(); addClassFromManageModal();}">
      <button class="btn btn-primary" onclick="addClassFromManageModal()">${ICON.plus}${esc(t('classes_add_btn'))}</button>
    </div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">${esc(t('close'))}</button></div>
  `);
}
function classesManageListHtml(){
  const list = [...(state.classes||[])].sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length) return `<p class="small muted">${esc(t('classes_empty'))}</p>`;
  return list.map(c=>`
    <div style="display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line);">
      <input type="text" value="${esc(c.name)}" style="flex:1;" onchange="renameClass(${c.id}, this.value)">
      <button class="btn btn-icon btn-ghost btn-sm" title="${esc(t('delete'))}" onclick="deleteClassConfirm(${c.id})">${ICON.trash}</button>
    </div>`).join('');
}
async function addClassFromManageModal(){
  const input = document.getElementById('newClassManageInput');
  const name = input.value.trim();
  if(!name) return;
  await mutate(s=>{ s.classes = s.classes || []; s.classes.push({ id:nextId(s.classes), name }); });
  input.value = '';
  const box = document.getElementById('classesManageList');
  if(box) box.innerHTML = classesManageListHtml();
}
async function renameClass(id, value){
  const name = value.trim();
  if(!name) return;
  await mutate(s=>{ const c=(s.classes||[]).find(x=>x.id===id); if(c) c.name=name; });
  toast(t('toast_saved'));
}
function deleteClassConfirm(id){
  confirmAction(t('classes_delete_confirm'), ()=>{
    mutate(s=>{
      s.classes = (s.classes||[]).filter(c=>c.id!==id);
      (s.actors||[]).forEach(a=>{ a.classIds = (a.classIds||[]).filter(cid=>cid!==id); });
    });
    toast(t('toast_deleted'));
  });
}

/* -----------------------------------------------------------------------
   Duplicatas — detectadas automaticamente por nome (mesmo nome, ignorando
   espaços/maiúsculas/acentos). Mesclar nunca é automático: o usuário
   escolhe qual registro fica, e turmas, contato e papéis em peças de todos
   os outros são somados nele antes de os outros serem removidos.
----------------------------------------------------------------------- */
function openMergeDuplicatesModal(){
  const groups = findDuplicateActorGroups();
  if(!groups.length) return;
  window.__mergeGroups = groups;
  openModal(`
    <div class="modal-head"><h3>${esc(t('merge_modal_title'))}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p class="small muted mb-16">${esc(t('merge_modal_desc'))}</p>
    <div id="mergeGroupsBox">${groups.map((g,gi)=>mergeGroupHtml(g, gi)).join('')}</div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">${esc(t('close'))}</button></div>
  `, {wide:true});
}
function mergeGroupHtml(group, gi){
  const candidates = group.map((a,ai)=>{
    const classes = classNameList(a).join(', ') || '—';
    const playsCount = actorPlaysFor(a.id).length;
    const extras = [
      a.phone ? `${esc(t('field_phone'))}: ${esc(a.phone)}` : '',
      a.email ? `${esc(t('field_email'))}: ${esc(a.email)}` : '',
    ].filter(Boolean).join(' · ');
    return `
    <label class="merge-candidate">
      <input type="radio" name="mergeKeep${gi}" value="${ai}" ${ai===0?'checked':''}>
      <span>
        <strong>${esc(a.name)}</strong>
        <div class="merge-preview">${esc(t('field_classes'))}: ${esc(classes)} · ${esc(t('col_plays'))}: ${playsCount}${extras?` · ${extras}`:''}</div>
      </span>
    </label>`;
  }).join('');
  return `
  <div class="merge-group" id="mergeGroup${gi}">
    <h5>${esc(group[0].name)}</h5>
    ${candidates}
    <div class="modal-actions" style="border-top:none; padding-top:10px; margin-top:4px;">
      <button class="btn btn-sm" onclick="document.getElementById('mergeGroup${gi}').remove();">${esc(t('merge_skip_btn'))}</button>
      <button class="btn btn-sm btn-primary" onclick="confirmMergeGroup(${gi})">${esc(t('merge_confirm_btn'))}</button>
    </div>
  </div>`;
}
// Merging is just as permanent as deleting an actor (the other records in
// the group are gone for good) but, unlike every other destructive action
// in the app, it used to skip any confirmation at all — one misclick right
// next to "Ignorar este grupo" and there was no undo. A full confirmAction()
// dialog would work but, since it reuses the single global modal overlay,
// it would close this entire merge-review modal (losing sight of any OTHER
// duplicate groups still waiting to be reviewed in the same sitting) — so
// the "are you sure" step happens inline, inside this one group's own card,
// instead.
function confirmMergeGroup(gi){
  const box = document.getElementById('mergeGroup'+gi);
  if(!box) return;
  const actionsBar = box.querySelector('.modal-actions');
  if(!actionsBar) return;
  actionsBar.innerHTML = `
    <span class="small muted" style="margin-right:auto;">${esc(t('merge_confirm_msg'))}</span>
    <button class="btn btn-sm" onclick="renderMergeGroupActions(${gi})">${esc(t('cancel'))}</button>
    <button class="btn btn-sm btn-danger" onclick="doMergeGroup(${gi})">${esc(t('merge_confirm_btn'))}</button>
  `;
}
function renderMergeGroupActions(gi){
  const box = document.getElementById('mergeGroup'+gi);
  if(!box) return;
  const actionsBar = box.querySelector('.modal-actions');
  if(!actionsBar) return;
  actionsBar.innerHTML = `
    <button class="btn btn-sm" onclick="document.getElementById('mergeGroup${gi}').remove();">${esc(t('merge_skip_btn'))}</button>
    <button class="btn btn-sm btn-primary" onclick="confirmMergeGroup(${gi})">${esc(t('merge_confirm_btn'))}</button>
  `;
}
function doMergeGroup(gi){
  const group = (window.__mergeGroups||[])[gi];
  if(!group) return;
  const radios = document.getElementsByName('mergeKeep'+gi);
  let keepIdx = 0;
  radios.forEach(r=>{ if(r.checked) keepIdx = Number(r.value); });
  const keepId = group[keepIdx].id;
  const otherIds = group.filter((a,i)=>i!==keepIdx).map(a=>a.id);
  mergeActors(keepId, otherIds, gi);
}
async function mergeActors(keepId, otherIds, gi){
  await mutate(s=>{
    const keep = s.actors.find(a=>a.id===keepId);
    const others = otherIds.map(id=>s.actors.find(a=>a.id===id)).filter(Boolean);
    if(!keep) return;

    const classIdSet = new Set(keep.classIds||[]);
    others.forEach(o=>(o.classIds||[]).forEach(cid=>classIdSet.add(cid)));
    keep.classIds = Array.from(classIdSet);
    keep.size = keep.size || (others.map(o=>o.size).find(Boolean) || '');
    keep.phone = keep.phone || (others.map(o=>o.phone).find(Boolean) || '');
    keep.email = keep.email || (others.map(o=>o.email).find(Boolean) || '');
    const noteParts = [keep.notes, ...others.map(o=>o.notes)].map(n=>(n||'').trim()).filter(Boolean);
    keep.notes = Array.from(new Set(noteParts)).join(' / ');

    // Reaponta escalação (roles de cada personagem) que ainda citava os
    // registros removidos para o registro que fica. Eventos não precisam
    // dessa repontagem: participação neles é por turma, não por ator.
    const otherIdSet = new Set(otherIds);
    s.plays.forEach(p=>p.characters.forEach(ch=>{
      (ch.roles||[]).forEach(r=>{ if(r.actorId!=null && otherIdSet.has(r.actorId)) r.actorId = keepId; });
    }));

    s.actors = s.actors.filter(a=>!otherIdSet.has(a.id));
  });
  const box = document.getElementById('mergeGroup'+gi);
  if(box) box.remove();
  toast(t('merge_done_toast'));
}

/* =======================================================================
   INVENTORY
======================================================================= */
let invFilter = { section: 'all', q: '', sizes: [] };
// Valor especial do filtro de seção para "itens sem seção nenhuma".
const NO_SECTION = '__none__';

/* ---- Busca do estoque ----
   A busca quebra o texto em termos (separados por espaço) e exige que TODOS
   combinem — "vestido M" acha vestidos de tamanho M, não qualquer item que
   tenha a letra m em algum lugar. Ignora maiúsculas e acentos.
   - Termo de 1 letra ("m", "p", "g"): só pode ser tamanho, e tem que ser o
     tamanho inteiro ("M" não acha "Manga", mas acha "M" e "P/M").
   - Termo de 2 letras/dígitos ("gg", "38", "xg"): tamanho exato OU começo de
     uma palavra do nome/descrição.
   - Termo de 3+ ("veludo"): tamanho exato OU em qualquer parte do texto
     (nome, descrição, seção, tamanho).
   - "tam:M", "tamanho:38" ou "tam M" força o termo a ser só tamanho. ---- */
const SIZE_KEYWORDS = ['tam', 'tamanho', 'size'];
const SIZE_ORDER = ['pp','p','m','g','gg','xg','xgg','eg','egg','u','unico'];

function foldText(s){
  return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
}
// Igual a foldText, mas devolve também, pra cada caractere do resultado, o
// índice do caractere original de onde ele veio — é o que permite destacar,
// no texto original (com acento e maiúscula), o trecho que bateu na busca.
function foldWithMap(str){
  let folded = ''; const map = [];
  for(let i=0;i<str.length;i++){
    const f = foldText(str[i]);
    for(let k=0;k<f.length;k++) map.push(i);
    folded += f;
  }
  return { folded, map };
}
// "M (adulto)" → [M, adulto]; "P/M" → [P, M]; "38-40" → [38, 40].
function sizeTokensOf(size){
  const out = []; const seen = new Set();
  String(size||'').split(/[^\p{L}\p{N}]+/u).filter(Boolean).forEach(raw=>{
    const key = foldText(raw);
    if(seen.has(key)) return;
    seen.add(key);
    out.push({ key, label: raw.length <= 3 ? raw.toUpperCase() : raw });
  });
  return out;
}
function isSizeLikeKey(k){ return SIZE_ORDER.indexOf(k) !== -1 || /^(\d{1,3}|[a-z]{1,3})$/.test(k); }

function parseInvQuery(q){
  const toks = foldText(q).split(/\s+/).filter(Boolean);
  const terms = [];
  const clean = x => x.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
  for(let i=0;i<toks.length;i++){
    let tk = toks[i], sizeOnly = false;
    const m = /^(tam|tamanho|size):(.*)$/.exec(tk);
    if(m){
      sizeOnly = true; tk = m[2];
      if(!tk && i+1 < toks.length) tk = toks[++i];
    } else if(SIZE_KEYWORDS.indexOf(tk.replace(/\.$/,'')) !== -1 && i+1 < toks.length){
      sizeOnly = true; tk = toks[++i];
    }
    tk = clean(tk);
    if(tk) terms.push({ t: tk, sizeOnly });
  }
  return { terms };
}
function invIndexFor(i){
  const text = foldText([i.name, i.notes, i.section, i.size].join(' '));
  return {
    sizeKeys: new Set(sizeTokensOf(i.size).map(x=>x.key)),
    sizeFolded: foldText(i.size).trim(),
    text,
    words: text.split(/[^\p{L}\p{N}]+/u).filter(Boolean),
  };
}
function invTermMatches(term, idx){
  if(idx.sizeKeys.has(term.t)) return true;
  if(term.sizeOnly) return idx.sizeFolded === term.t;
  if(term.t.length === 1) return false;
  if(term.t.length === 2) return idx.words.some(w=>w.startsWith(term.t));
  return idx.text.includes(term.t);
}
function invItemMatches(i, parsed){
  if(!parsed.terms.length) return true;
  const idx = invIndexFor(i);
  return parsed.terms.every(tm=>invTermMatches(tm, idx));
}

// Faixas [início, fim) do texto ORIGINAL que bateram com algum termo.
function highlightRanges(text, terms, mode){
  const src = String(text==null?'':text);
  if(!terms.length || !src) return [];
  const { folded, map } = foldWithMap(src);
  const found = [];
  if(mode === 'size'){
    const set = new Set(terms.map(x=>x.t));
    const re = /[\p{L}\p{N}]+/gu; let m;
    while((m = re.exec(folded))){ if(set.has(m[0])) found.push([m.index, m.index + m[0].length]); }
  } else {
    terms.forEach(tm=>{
      if(tm.sizeOnly || tm.t.length < 2) return;
      let from = 0, pos;
      while((pos = folded.indexOf(tm.t, from)) !== -1){
        const wordStart = pos === 0 || !/[\p{L}\p{N}]/u.test(folded[pos-1]);
        if(tm.t.length >= 3 || wordStart) found.push([pos, pos + tm.t.length]);
        from = pos + 1;
      }
    });
  }
  const orig = found.map(([a,b])=>[map[a], map[b-1] + 1]).sort((x,y)=>x[0]-y[0]);
  const merged = [];
  orig.forEach(r=>{
    const last = merged[merged.length-1];
    if(last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]); else merged.push(r.slice());
  });
  return merged;
}
function hlHtml(text, terms, mode){
  const src = String(text==null?'':text);
  const ranges = highlightRanges(src, terms, mode);
  if(!ranges.length) return esc(src);
  let out = '', pos = 0;
  ranges.forEach(([a,b])=>{
    out += esc(src.slice(pos, a)) + '<mark class="hl">' + esc(src.slice(a, b)) + '</mark>';
    pos = b;
  });
  return out + esc(src.slice(pos));
}

/* ---- Seções ----
   Uma seção é só um nome de texto no item (item.section); state.sections é a
   lista de seções criadas à mão, pra uma seção poder existir vazia. A lista
   que a tela mostra junta as duas fontes. ---- */
function sectionKey(name){ return normalizeName(name); }
function allSections(){
  const seen = new Map();
  (state.sections||[]).forEach(n=>{ const k = sectionKey(n); if(k && !seen.has(k)) seen.set(k, String(n).trim()); });
  state.inventory.forEach(i=>{ const n = String(i.section||'').trim(); const k = sectionKey(n); if(k && !seen.has(k)) seen.set(k, n); });
  return Array.from(seen.values()).sort((a,b)=>a.localeCompare(b, state.lang==='pt' ? 'pt-BR' : 'en'));
}
function itemInSection(i, name){ return sectionKey(i.section) === sectionKey(name); }
function sectionCount(name){ return state.inventory.filter(i=>itemInSection(i, name)).length; }
function noSectionCount(){ return state.inventory.filter(i=>!sectionKey(i.section)).length; }
function itemPassesSectionFilter(i){
  if(invFilter.section === 'all') return true;
  if(invFilter.section === NO_SECTION) return !sectionKey(i.section);
  return itemInSection(i, invFilter.section);
}

function filteredInventory(opts){
  opts = opts || {};
  const parsed = parseInvQuery(invFilter.q);
  return state.inventory.filter(i=>{
    if(!itemPassesSectionFilter(i)) return false;
    const idx = invIndexFor(i);
    if(!parsed.terms.every(tm=>invTermMatches(tm, idx))) return false;
    if(!opts.ignoreSizes && invFilter.sizes.length && !invFilter.sizes.some(k=>idx.sizeKeys.has(k))) return false;
    return true;
  });
}
// Atalhos de tamanho: os tamanhos que existem nos itens que passam pela
// seção + texto digitados (com a contagem de cada um). Os já selecionados
// continuam aparecendo, mesmo com 0, pra dar pra desmarcar.
function invSizeChipData(){
  const map = new Map();
  filteredInventory({ ignoreSizes:true }).forEach(i=>{
    sizeTokensOf(i.size).filter(tk=>isSizeLikeKey(tk.key)).forEach(tk=>{
      const e = map.get(tk.key) || { key: tk.key, label: tk.label, count: 0 };
      e.count++; map.set(tk.key, e);
    });
  });
  invFilter.sizes.forEach(k=>{
    if(!map.has(k)) map.set(k, { key: k, label: k.length <= 3 ? k.toUpperCase() : k, count: 0 });
  });
  return Array.from(map.values()).sort((a,b)=>{
    const ra = SIZE_ORDER.indexOf(a.key), rb = SIZE_ORDER.indexOf(b.key);
    if(ra !== -1 || rb !== -1){ if(ra === -1) return 1; if(rb === -1) return -1; return ra - rb; }
    const na = /^\d+$/.test(a.key), nb = /^\d+$/.test(b.key);
    if(na && nb) return Number(a.key) - Number(b.key);
    if(na) return -1;
    if(nb) return 1;
    return a.key.localeCompare(b.key);
  });
}

function invGridCard(i, deficits, parsed){
  deficits = deficits || {};
  const terms = (parsed && parsed.terms) || [];
  const d = deficits[i.id];
  const short = d && d.deficit > 0;
  const caution = d && !short && d.savedByShareable;
  const hasSection = !!sectionKey(i.section);
  const notes = String(i.notes||'').trim();
  return `
  <div class="item-card card-clickable" onclick="openInventoryModal(${i.id})" tabindex="0"
    onkeydown="if(event.key==='Enter' && event.target===this){ openInventoryModal(${i.id}); }">
    <div class="item-card-head">
      <h4>${hlHtml(i.name, terms, 'text')}</h4>
      <span class="item-qty-badge">×${i.qty}</span>
    </div>
    <div class="item-meta">
      ${i.size ? `<span class="pill">${hlHtml(i.size, terms, 'size')}</span>` : ''}
      ${hasSection ? `<span class="item-section">${hlHtml(i.section, terms, 'text')}</span>` : ''}
      <span class="item-card-actions">
        <button class="btn btn-icon btn-ghost btn-sm" title="${esc(t('edit'))}" onclick="event.stopPropagation(); openInventoryModal(${i.id});">${ICON.edit}</button>
        <button class="btn btn-icon btn-ghost btn-sm" title="${esc(t('duplicate'))}" onclick="event.stopPropagation(); duplicateInventoryItem(${i.id});">${ICON.copy}</button>
      </span>
    </div>
    <div class="item-desc ${notes ? '' : 'is-empty'}">${notes ? hlHtml(notes, terms, 'text') : esc(t('inv_no_desc'))}</div>
    ${short ? `<span class="stock-short-badge" title="${esc(t('stock_needs'))} ${d.demand}, ${esc(t('stock_has'))} ${d.available}">⚠️ ${esc(t('stock_missing'))} ${d.deficit}</span>`
      : caution ? `<span class="stock-caution-badge" title="${esc(t('stock_saved_by_shareable'))}">ℹ️ ${esc(t('stock_caution_badge'))}</span>` : ''}
  </div>`;
}

function invEmptyState(){
  return `<div class="empty-state card">${ICON.inventory.replace('<svg','<svg class="icon"')}<p>${esc(t('no_inventory'))}</p></div>`;
}
function invResultsHtml(list){
  if(!list.length) return invEmptyState();
  const deficits = computeStockDeficits();
  const parsed = parseInvQuery(invFilter.q);
  return `<div class="item-grid">${list.map(i=>invGridCard(i, deficits, parsed)).join('')}</div>`;
}
// Atalhos de tamanho + contagem de resultados + "limpar filtros" — a parte
// da barra de busca que muda a cada letra digitada (o campo em si não é
// redesenhado, senão perderia o foco).
function invStatusHtml(){
  const total = state.inventory.length;
  const shown = filteredInventory().length;
  const chips = invSizeChipData();
  const hasQuery = !!(invFilter.q.trim() || invFilter.sizes.length);
  const filtered = hasQuery || invFilter.section !== 'all';
  const unit = total === 1 ? t('inv_unit_one') : t('inv_unit_many');
  const countTxt = filtered ? `${shown} ${t('inv_of')} ${total} ${unit}` : `${total} ${unit}`;
  return `
    ${chips.length ? `<div class="inv-size-chips"><span class="toolbar-label">${esc(t('inv_size_label'))}</span>${chips.map(c=>`
      <button type="button" class="chip ${invFilter.sizes.includes(c.key)?'active':''}" data-size="${esc(c.key)}" onclick="toggleInvSize(this.dataset.size)">${esc(c.label)}<span class="count">${c.count}</span></button>`).join('')}</div>` : ''}
    <div class="inv-search-meta">
      <span class="inv-result-count">${esc(countTxt)}</span>
      ${hasQuery ? `<button type="button" class="inv-clear-filters" onclick="clearInvFilters()">${esc(t('inv_clear_filters'))}</button>` : ''}
    </div>`;
}

function renderInventory(){
  // Outra pessoa pode ter apagado a seção que está selecionada aqui.
  if(invFilter.section !== 'all' && invFilter.section !== NO_SECTION && !allSections().some(n=>sectionKey(n)===sectionKey(invFilter.section))){
    invFilter.section = 'all';
  }
  const sections = allSections();
  const list = filteredInventory();
  const allDeficits = Object.values(computeStockDeficits()).filter(d=>d.deficit>0 || d.savedByShareable);
  const noSecN = noSectionCount();

  return `
  <div class="page">
    <div class="page-header">
      <div><h1>${esc(t('inv_title'))}</h1><p class="sub">${esc(t('inv_sub'))}</p></div>
      <button class="btn btn-primary" onclick="openInventoryModal()">${ICON.plus}${esc(t('inv_add'))}</button>
    </div>
    ${allDeficits.length ? stockAlertHtml(allDeficits) : ''}
    <div class="card inv-search-card">
      <div class="inv-search-field ${invFilter.q ? 'has-value' : ''}" id="invSearchField">
        ${ICON.search}
        <input type="text" id="invSearchInput" inputmode="search" autocomplete="off" spellcheck="false"
          placeholder="${esc(t('inv_search_placeholder'))}" value="${esc(invFilter.q)}"
          oninput="invSearchInput(this.value)" onkeydown="invSearchKey(event)">
        <button type="button" class="inv-search-clear" title="${esc(t('inv_search_clear'))}" onclick="clearInvSearch()">&times;</button>
      </div>
      <div class="inv-search-hint">${esc(t('inv_search_hint'))}</div>
      <div id="invStatusWrap">${invStatusHtml()}</div>
    </div>
    <div class="inv-layout">
      <div class="filter-panel">
        <div class="filter-group">
          <div class="filter-group-head">
            <h4>${esc(t('filter_sections'))}</h4>
            <button class="btn btn-icon btn-ghost btn-sm" title="${esc(t('sections_manage'))}" onclick="openManageSectionsModal()">${ICON.edit}</button>
          </div>
          <div class="filter-list">
            <button class="${invFilter.section==='all'?'active':''}" onclick="setInvSection('all')"><span>${esc(t('all'))}</span><span class="n">${state.inventory.length}</span></button>
            ${sections.map(s=>{
              const n = sectionCount(s);
              return `<button class="${invFilter.section!=='all' && invFilter.section!==NO_SECTION && sectionKey(invFilter.section)===sectionKey(s)?'active':''} ${n?'':'is-empty-section'}" data-sec="${esc(s)}" onclick="setInvSection(this.dataset.sec)"><span>${esc(s)}</span><span class="n">${n}</span></button>`;
            }).join('')}
            ${noSecN ? `<button class="${invFilter.section===NO_SECTION?'active':''}" onclick="setInvSection('${NO_SECTION}')"><span>${esc(t('no_section'))}</span><span class="n">${noSecN}</span></button>` : ''}

function cleanSectionName(v){ return String(v||'').trim().replace(/\s+/g, ' '); }
async function addSectionFromModal(){
  const input = document.getElementById('newSectionInput');
  const name = cleanSectionName(input.value);
  if(!name) return;
  if(allSections().some(n=>sectionKey(n)===sectionKey(name))){ toast(t('sections_exists')); return; }
  await mutate(s=>{ s.sections = s.sections || []; s.sections.push(name); });
  input.value = '';
  refreshSectionsManageList();
  toast(t('toast_section_added'));
  input.focus();
}
async function renameSectionFromEl(el){
  const oldName = el.dataset.sec;
  const name = cleanSectionName(el.value);
  if(!name || name === oldName){ el.value = oldName; return; }
  const oldKey = sectionKey(oldName);
  if(allSections().some(n=>sectionKey(n)===sectionKey(name) && sectionKey(n)!==oldKey)){
    toast(t('sections_exists')); el.value = oldName; return;
  }
  if(invFilter.section !== 'all' && invFilter.section !== NO_SECTION && sectionKey(invFilter.section) === oldKey) invFilter.section = name;
  await mutate(s=>{
    const seen = new Set(); let found = false;
    s.sections = (s.sections||[]).map(n=>{ if(sectionKey(n)===oldKey){ found = true; return name; } return n; })
      .filter(n=>{ const k = sectionKey(n); if(seen.has(k)) return false; seen.add(k); return true; });
    if(!found) s.sections.push(name);
    s.inventory.forEach(i=>{ if(sectionKey(i.section)===oldKey) i.section = name; });
  });
  refreshSectionsManageList();
  toast(t('toast_saved'));
}
function deleteSectionFromEl(el){ deleteSection(el.dataset.sec); }
function deleteSection(name){
  const n = sectionCount(name);
  if(n === 0){ removeSectionAndMove(name, ''); return; }
  window.__deleteSectionName = name;
  const others = allSections().filter(x=>sectionKey(x)!==sectionKey(name));
  openModal(`
    <div class="modal-head"><h3>${esc(t('sections_delete_title'))}</h3><button class="modal-close" onclick="openManageSectionsModal()">&times;</button></div>
    <p class="small muted">${esc(t('sections_delete_move').replace('{name}', ()=>name).replace('{n}', ()=>n))}</p>

      <button class="btn" onclick="openManageSectionsModal()">${esc(t('cancel'))}</button>
      <button class="btn btn-danger" onclick="confirmDeleteSection()">${esc(t('sections_delete_confirm'))}</button>
    </div>
  `);

async function confirmDeleteSection(){
  const name = window.__deleteSectionName;
  const target = document.getElementById('sectionMoveTarget').value;
  await removeSectionAndMove(name, target);
  openManageSectionsModal();

async function removeSectionAndMove(name, target){
  const key = sectionKey(name);
  if(invFilter.section !== 'all' && invFilter.section !== NO_SECTION && sectionKey(invFilter.section) === key) invFilter.section = 'all';
  await mutate(s=>{
    s.sections = (s.sections||[]).filter(n=>sectionKey(n)!==key);
    s.inventory.forEach(i=>{ if(sectionKey(i.section)===key) i.section = target; });
  });
  refreshSectionsManageList();
  toast(t('toast_section_removed'));
}

/* ---- Envio de imagem (usado só pelo pôster da peça; o estoque não tem
   mais fotos). ---- */
// Resize/compress on a canvas (keeps uploads small), then hand the
// resulting data URL to the backend and resolve with the Drive URL it
// returns. Rejects on read/upload failure — callers show a toast.
function processImageUpload(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read_failed'));
    reader.onload = function(ev){
      const img = new Image();
      img.onerror = ()=>reject(new Error('decode_failed'));
      img.onload = function(){
        const MAX = 900;
        let w = img.width, h = img.height;
        if(w > MAX || h > MAX){
          if(w > h){ h = Math.round(h*MAX/w); w = MAX; } else { w = Math.round(w*MAX/h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        apiUploadImage(dataUrl, file.name || 'foto.jpg').then(resolve, reject);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
/* ---- Show poster: a single cover image for the play/event, shown as a
   Netflix-style tile in Planejamento por Peça. Stored on the play's `logo`
   field (the same field seed-data play art already used) so it survives the
   event/play being the same entity. ---- */

      </label>

    </div>`;

async function saveInventoryModal(id){
  const name = document.getElementById('mInvName').value.trim();
  // Math.max(0, ...) guards against a negative quantity — the <input min="0">
  // is only a soft hint the browser doesn't always enforce, and a negative
  // qty would silently corrupt the stock-shortage math (a negative
  // "available" count makes computeStockDeficits() both overstate a real

  const qty = Math.max(0, parseInt(document.getElementById('mInvQty').value,10) || 0);

  // sem acento), usa a grafia que já existe em vez de criar uma "quase igual".
  const existing = allSections().find(n=>sectionKey(n)===sectionKey(section));
  if(existing) section = existing;
  if(!name){ toast(t('field_inv_name')+'?'); return; }
  await mutate(s=>{
    if(section){
      s.sections = s.sections || [];
      if(!s.sections.some(n=>sectionKey(n)===sectionKey(section))) s.sections.push(section);

    if(id){
      // As fotos que itens antigos ainda guardam (i.images) ficam como estão:

function deleteInventoryItem(id){
  confirmAction(t('confirm_delete_msg'), async ()=>{
    const images = ((findInvItem(id)||{}).images || []).slice();
    const ok = await mutate(s=>{
      s.inventory = s.inventory.filter(i=>i.id!==id);
      s.plays.forEach(p=>p.characters.forEach(c=>(c.roles||[]).forEach(r=>(r.items||[]).forEach(it=>{
        if(it.inventoryItemId===id){ it.inventoryItemId=null; it.possession=''; }
      }))));
    });
    if(ok){
      // Duplicating an item (below) shares its photo URLs with the copy —
      // only delete a photo from Drive once nothing else still points to it.
      const toDelete = images.filter(url => !imageUrlInUse(url));
      if(toDelete.length) apiDeleteImages(toDelete);
    }
    closeModal();
    toast(t('toast_deleted'));
  });

// True if some inventory item, show poster, or archived record in the
// CURRENT state still references this image URL — used to avoid deleting a
// Drive photo that a duplicate (made with duplicateInventoryItem) still
// shares with it, or that an archived record's read-only snapshot still
// displays.
function imageUrlInUse(url){
  if(state.inventory.some(i=>(i.images||[]).includes(url))) return true;
  if(state.plays.some(p=>p.logo===url)) return true;
  if((state.archivedEvents||[]).some(a=>
    (a.snapshot && a.snapshot.logo===url) || (a.rawPlay && a.rawPlay.logo===url)
  )) return true;
  return false;
}
// Creates an independent copy of an inventory item — same size,
// section and description, ready to tweak (e.g. the count differs, or it's a
// second, slightly different unit of basically the same costume piece).
function duplicateInventoryItem(id){
  const i = findInvItem(id);
  if(!i) return;
  mutate(s=>{
    s.inventory.push({
      id: nextId(s.inventory), section: i.section, qty: i.qty, size: i.size,
      name: i.name + t('copy_suffix'), notes: i.notes, images: [],
    });

  toast(t('toast_duplicated'));
}

======================================================================= */
let calCursor = (function(){ const d=new Date(); return { y:d.getFullYear(), m:d.getMonth() }; })();
let calSelectedDate = null;
let archivedListOpen = false;

function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function dateToStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
// Every day an event spans, inclusive — a single-day event (no end date, or
// an end date before the start) is just its own start date.
function eventDateRange(e){
  const start = parseDate(e.startDate);
  if(!start) return [];
  const end = e.endDate ? parseDate(e.endDate) : null;
  if(!end || end <= start) return [e.startDate];
  const days = [];
  const cur = new Date(start);
  let guard = 0;
  while(cur <= end && guard < 366){
    days.push(dateToStr(cur));
    cur.setDate(cur.getDate()+1);
    guard++;
  }
  return days;
}
function fmtDate(s, lang){
  const d = parseDate(s); if(!d) return '';
  const opts = { day:'2-digit', month:'short', year:'numeric' };
  return d.toLocaleDateString(lang==='pt'?'pt-BR':'en-US', opts);
}
const MONTH_NAMES = {
  pt: ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],
  en: ['January','February','March','April','May','June','July','August','September','October','November','December']
};
const DOW_NAMES = { pt:['D','S','T','Q','Q','S','S'], en:['S','M','T','W','T','F','S'] };

/* ---------- Date picker ----------
   A small custom calendar popover for the event start/end date fields.
   The browser's native <input type="date"> popup follows the OS/browser
   locale and can't be forced to start on Sunday from the page — this
   replaces it with the same Sunday-first grid as the month calendar above,
   so the week always starts the same way everywhere. The field itself is a
   readonly text input; the real ISO value lives in its data-iso attribute. */
let dpCursor = null;
function dpOutsideHandler(ev){
  const pop = document.getElementById('dpPopover');
  if(pop && !pop.contains(ev.target) && ev.target.id !== pop.dataset.field){
    closeDatePicker();
  }
}
function closeDatePicker(){
  const pop = document.getElementById('dpPopover');
  if(pop) pop.remove();
  document.removeEventListener('mousedown', dpOutsideHandler);
}
function datePickerFieldHtml(id, iso, label){
  const display = iso ? fmtDate(iso, state.lang) : '';
  return `
    <div class="field">
      <label>${esc(label)}</label>
      <div class="dp-input-wrap">
        <input type="text" id="${id}" readonly placeholder="${esc(t('dp_pick'))}" value="${esc(display)}"
          data-iso="${esc(iso||'')}" onclick="openDatePicker(event,'${id}')">
      </div>
    </div>`;
}
function openDatePicker(ev, fieldId){
  ev.stopPropagation();
  const already = document.getElementById('dpPopover');
  const wasForThisField = already && already.dataset.field === fieldId;
  closeDatePicker();
  if(wasForThisField) return; // clicking the same field again just closes it
  const input = document.getElementById(fieldId);
  const iso = input.dataset.iso || '';
  const base = iso ? parseDate(iso) : new Date();
  dpCursor = { y: base.getFullYear(), m: base.getMonth() };
  const pop = document.createElement('div');
  pop.id = 'dpPopover';
  pop.className = 'dp-popover';
  pop.dataset.field = fieldId;
  pop.addEventListener('mousedown', e=>e.stopPropagation());
  pop.innerHTML = datePickerPopoverHtml(fieldId, iso);
  input.closest('.dp-input-wrap').appendChild(pop);
  setTimeout(()=>document.addEventListener('mousedown', dpOutsideHandler), 0);
}
function datePickerPopoverHtml(fieldId, selectedIso){
  const y = dpCursor.y, m = dpCursor.m;
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="dp-cell pad"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isSel = dateStr === selectedIso;
    cells += `<div class="dp-cell ${isSel?'selected':''}" onclick="pickDate('${fieldId}','${dateStr}')">${day}</div>`;
  }
  return `
    <div class="dp-nav">
      <button type="button" class="btn btn-icon btn-ghost btn-sm" onclick="dpNav(-1,'${fieldId}','${selectedIso}')">‹</button>
      <strong>${esc(MONTH_NAMES[state.lang][m])} ${y}</strong>
      <button type="button" class="btn btn-icon btn-ghost btn-sm" onclick="dpNav(1,'${fieldId}','${selectedIso}')">›</button>
    </div>
    <div class="dp-grid">${DOW_NAMES[state.lang].map(d=>`<div class="dp-dow">${d}</div>`).join('')}</div>
    <div class="dp-grid">${cells}</div>
    <div class="dp-actions"><button type="button" class="btn btn-sm btn-ghost" onclick="pickDate('${fieldId}','')">${esc(t('dp_clear'))}</button></div>`;
}
function dpNav(dir, fieldId, selectedIso){
  dpCursor.m += dir;
  if(dpCursor.m<0){ dpCursor.m=11; dpCursor.y--; }
  if(dpCursor.m>11){ dpCursor.m=0; dpCursor.y++; }
  const pop = document.getElementById('dpPopover');
  if(pop) pop.innerHTML = datePickerPopoverHtml(fieldId, selectedIso);
}
function pickDate(fieldId, iso){
  const input = document.getElementById(fieldId);
  input.value = iso ? fmtDate(iso, state.lang) : '';
  input.dataset.iso = iso;
  closeDatePicker();
}

// Archiving an event takes the whole show out of the active screens (freeing
// its costumes and clearing it from the cast/planning views) while keeping a
// full historical record — an event and its show are the same thing, so
// archiving one archives both.
function archiveEvent(id){
  const ev = findEvent(id);
  if(!ev) return;
  const play = ev.playId ? findPlay(ev.playId) : null;
  const hasPlan = play && play.characters.some(c=>(c.roles||[]).some(r=>(r.items||[]).length));
  const msg = hasPlan ? t('confirm_archive_event_with_plan_msg') : t('confirm_archive_event_msg');
  confirmAction(msg, ()=>{
    mutate(s=>{
      const e = findEvent(id);
      const p = e.playId ? findPlay(e.playId) : null;
      const snapshot = {
        title: e.title, startDate: e.startDate, endDate: e.endDate, logo: p ? p.logo : null,
        notes: e.notes,
        classNames: (e.classIds||[]).map(cid=>{ const c=findClass(cid); return c ? c.name : ('#'+cid); }),
        characters: p ? p.characters.map(c=>({
          name: c.name, total: c.total,
          // If the actor was since deleted, findActor() comes back empty —
          // fall back to the name snapshotted at casting time (role.label)
          // so the archived record still shows who played the part, same
          // as the live "ghost" role chip does, instead of silently
          // dropping the name from the permanent record.
          roles: (c.roles||[]).map(r=>{
            const cast = (p.casts||[]).find(cc=>cc.id===r.castId);
            const actor = r.actorId ? findActor(r.actorId) : null;
            return {
              castName: cast ? cast.name : '',
              actorLabel: actor ? actor.name : (r.label||''),
              items: (r.items||[]).map(it=>({
                name: it.name, size: it.size||'',
                qty: (it.qty===undefined||it.qty===null||it.qty==='') ? 1 : it.qty,
                possession: it.possession||'', purchaseStatus: it.purchaseStatus||'', notes: it.notes||'',
                inventoryItem: it.inventoryItemId ? ((findInvItem(it.inventoryItemId)||{}).name || null) : null
              }))
            };
          })
        })) : []
      };
      // Keep the exact original event/play objects (not just the readable
      // snapshot above) so an accidental archive can be undone losslessly
      // instead of only offering a read-only record.
      const rawEvent = JSON.parse(JSON.stringify(e));
      const rawPlay = p ? JSON.parse(JSON.stringify(p)) : null;
      s.events = s.events.filter(x=>x.id!==id);
      if(p) s.plays = s.plays.filter(x=>x.id!==p.id);
      if(!Array.isArray(s.archivedEvents)) s.archivedEvents = [];
      s.archivedEvents.push({ id: nextId(s.archivedEvents), archivedAt: new Date().toISOString(), snapshot, rawEvent, rawPlay });
    });
    toast(t('toast_archived'));
  });
}
// Restores an archived event (and its show) exactly as they were archived —
// the undo for an accidental archive. Falls back to fresh ids only if the
// original ones have since been reused by something else.
function unarchiveEvent(id){
  let approximate = false;
  mutate(s=>{
    const a = (s.archivedEvents||[]).find(x=>x.id===id);
    if(!a) return;
    let event, play;
    if(a.rawEvent){
      // Archived after the exact snapshot existed — restore losslessly.
      event = JSON.parse(JSON.stringify(a.rawEvent));
      play = a.rawPlay ? JSON.parse(JSON.stringify(a.rawPlay)) : null;
      // A record archived before casts became dynamic kept its raw play in
      // the OLD shape (castLabels/cast1/cast2) — bring it current before it
      // re-enters state.plays, same as every other place state comes in
      // from outside the live session.
      if(play) migratePlayShape(play);
    } else {
      // Older record, archived before the exact snapshot existed: only the
      // readable summary was kept. Rebuild a best-effort event/play from it,
      // re-matching actors and inventory items by name where still possible.
      approximate = true;
      const snap = a.snapshot;
      const byName = (list, name)=> list.find(x=>x.name.trim().toLowerCase() === (name||'').trim().toLowerCase());
      const characters = (snap.characters||[]).map((c,ci)=>({
        id: ci+1, name: c.name, total: c.total||'',
        // Snapshot the matched actor's name into label too (not just
        // actorId) — same reason as everywhere else a cast member is
        // linked to an actor: if that actor is later deleted, the cast
        // chip still has a name to fall back to instead of going blank.
        cast1: { count:'', names: (c.cast1||[]).map(n=>{ const f=byName(s.actors,n); return f ? {actorId:f.id, label:f.name} : {label:n}; }) },
        cast2: { count:'', names: (c.cast2||[]).map(n=>{ const f=byName(s.actors,n); return f ? {actorId:f.id, label:f.name} : {label:n}; }) },
        items: (c.items||[]).map((it,ii)=>{
          const inv = it.inventoryItem ? byName(s.inventory, it.inventoryItem) : null;
          return { id: ii+1, name: it.name, isGroupHeader:false,
            qty: (it.qty===undefined||it.qty===null||it.qty==='') ? 1 : it.qty,
            shareable: it.shareable||'', source: it.source||'', purchaseStatus: it.purchaseStatus||'', arrived: it.arrived||'',
            rawImported:null, inventoryItemId: inv ? inv.id : null };
        })
      }));
      play = { id: nextId(s.plays), name: snap.title, logo: snap.logo||null, castLabels:{cast1:'Elenco 1', cast2:'Elenco 2'}, characters };
      // Same migration as the lossless branch above — this reconstructs the
      // old shape (it's the only shape this fallback knows how to rebuild
      // from a bare-bones legacy snapshot) and then brings it current.
      migratePlayShape(play);
      event = { id: nextId(s.events), title: snap.title, startDate: snap.startDate||'', endDate: snap.endDate||'',
        notes: snap.notes||'', playId: play.id,
        classIds: (snap.classNames||[]).map(n=>{ const f=byName(s.classes||[], n); return f ? f.id : null; }).filter(Boolean) };
    }
    if(play){
      if(s.plays.some(p=>p.id===play.id)) play.id = nextId(s.plays);
      event.playId = play.id;
      s.plays.push(play);
    }
    if(s.events.some(e=>e.id===event.id)) event.id = nextId(s.events);
    s.events.push(event);
    s.archivedEvents = s.archivedEvents.filter(x=>x.id!==id);
  });
  closeModal();
  toast(approximate ? t('toast_unarchived_approx') : t('toast_unarchived'));
}
// Archived records used to be shown/exported as raw JSON, which reads as
// code, not as a costume plan. This flattens the same snapshot into one row
// per costume item (or one row per character, if it had none) so it reads
// like a normal spreadsheet — the same row list backs both the on-screen
// table and the .csv export, so they always agree.
// A record archived before casts became dynamic kept the old shape right in
// its snapshot (a fixed cast1/cast2 pair of plain actor-name strings, and
// items shared at the character level rather than tied to one actor) — that
// is a frozen historical record, not something that goes through
// migratePlayShape, so this still has to read both shapes. The row shape
// returned here is unified either way: character, total, cast, actor, item,
// size, qty, possession, purchaseStatus, notes, inventoryItem.
function archivedRecordRows(a){
  const s = a.snapshot;
  const rows = [];
  const blank = { cast:'', actor:'', item:'', size:'', qty:'', possession:'', purchaseStatus:'', notes:'', inventoryItem:'' };
  const legacyCast1Label = state.lang==='en' ? 'Cast 1' : 'Elenco 1';
  const legacyCast2Label = state.lang==='en' ? 'Cast 2' : 'Elenco 2';
  const legacyShareableLabel = v=>({
    yes:    state.lang==='en' ? 'Shareable' : 'Compartilhável',
    no:     state.lang==='en' ? 'Not shareable' : 'Não compartilhável',
    partial:state.lang==='en' ? 'Partially shareable' : 'Parcialmente compartilhável',
    tryon:  state.lang==='en' ? 'Try-on only' : 'Só provar',
  }[v] || '');
  const legacyCheckLabel = v=>({
    pending: state.lang==='en' ? 'Pending' : 'Pendente',
    partial: state.lang==='en' ? 'Partial' : 'Parcial',
    done:    state.lang==='en' ? 'Done' : 'Concluído',
  }[v] || '');
  (s.characters||[]).forEach(c=>{
    const base = { character: c.name||'', total: c.total||'' };
    let any = false;
    if(Array.isArray(c.roles)){
      c.roles.forEach(r=>{
        const items = (r.items||[]).filter(Boolean);
        if(!items.length){
          any = true;
          rows.push(Object.assign({}, blank, base, { cast: r.castName||'', actor: r.actorLabel||'' }));
        } else {
          items.forEach(it=>{
            any = true;
            rows.push(Object.assign({}, blank, base, {
              cast: r.castName||'', actor: r.actorLabel||'',
              item: it.name||'', size: it.size||'',
              qty: (it.qty===undefined||it.qty===null) ? '' : it.qty,
              possession: it.possession ? possessionMeta(it.possession).label : '',
              purchaseStatus: (it.possession==='faltando' && it.purchaseStatus) ? purchaseSubStatusMeta(it.purchaseStatus).label : '',
              notes: it.notes||'', inventoryItem: it.inventoryItem||''
            }));
          });
        }
      });
    } else {
      (c.cast1||[]).forEach(name=>{ any=true; rows.push(Object.assign({}, blank, base, {cast:legacyCast1Label, actor:name})); });
      (c.cast2||[]).forEach(name=>{ any=true; rows.push(Object.assign({}, blank, base, {cast:legacyCast2Label, actor:name})); });
      (c.items||[]).filter(Boolean).forEach(it=>{
        any = true;
        const notesParts = [legacyShareableLabel(it.shareable), it.source, legacyCheckLabel(it.arrived)].filter(Boolean);
        rows.push(Object.assign({}, blank, base, {
          item: it.name||'', qty: (it.qty===undefined||it.qty===null) ? '' : it.qty,
          purchaseStatus: it.purchaseStatus ? legacyCheckLabel(it.purchaseStatus) : '',
          notes: notesParts.join(' · '), inventoryItem: it.inventoryItem||''
        }));
      });
    }
    if(!any) rows.push(Object.assign({}, blank, base));
  });
  return rows;
}

function deleteArchivedRecord(id){
  confirmAction(t('confirm_delete_archived_msg'), async ()=>{
    const a = (state.archivedEvents||[]).find(x=>x.id===id);
    const logo = a && a.snapshot ? a.snapshot.logo : null;
    const ok = await mutate(s=>{
      s.archivedEvents = (s.archivedEvents||[]).filter(x=>x.id!==id);
    });
    // Permanent delete is the one point where this poster photo can truly
    // have no reader left — every other deletion path in the app already
    // cleans up its Drive photo the same way; this was the one gap, quietly
    // leaving an orphaned file in Drive every time an old record was purged.
    if(ok && logo && !imageUrlInUse(logo)) apiDeleteImages([logo]);
    toast(t('toast_deleted'));
  });
}
function csvEscape(v){
  const s = (v===undefined||v===null) ? '' : String(v);
  if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function archivedRecordToCsv(a){
  const s = a.snapshot;
  const lines = [];
  lines.push([t('field_title'), s.title||''].map(csvEscape).join(','));
  lines.push([t('field_startdate'), s.startDate ? fmtDate(s.startDate, state.lang) : ''].map(csvEscape).join(','));
  if(s.endDate) lines.push([t('field_enddate'), fmtDate(s.endDate, state.lang)].map(csvEscape).join(','));
  lines.push([t('field_participants'), (s.classNames||[]).join('; ')].map(csvEscape).join(','));
  if(s.notes) lines.push([t('field_notes'), s.notes].map(csvEscape).join(','));
  lines.push([t('archived_on'), fmtDate(a.archivedAt.slice(0,10), state.lang)].map(csvEscape).join(','));
  lines.push('');
  const headers = [t('col_character'), t('total_label'), t('col_cast'), t('col_actor'), t('col_item'), t('field_item_size'), t('col_qty'), t('field_possession'), t('purchase_status_label'), t('field_item_notes'), t('col_stock_item')];
  lines.push(headers.map(csvEscape).join(','));
  archivedRecordRows(a).forEach(r=>{
    lines.push([r.character, r.total, r.cast, r.actor, r.item, r.size, r.qty, r.possession, r.purchaseStatus, r.notes, r.inventoryItem].map(csvEscape).join(','));
  });
  return lines.join('\r\n');
}
function downloadArchivedRecord(id){
  const a = (state.archivedEvents||[]).find(x=>x.id===id);
  if(!a) return;
  try{
    // Leading BOM so accented characters (a, c, ã, etc.) open correctly in Excel.
    const blob = new Blob(['﻿' + archivedRecordToCsv(a)], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = (a.snapshot.title||'evento').replace(/[^a-z0-9]+/gi,'_') + '.csv';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){ /* best effort — some preview sandboxes block downloads */ }
}

      <button class="btn btn-primary" onclick="saveEventModal(${id||'null'})">${esc(t('save'))}</button>
    </div>
  `, {wide:true});
}
async function saveEventModal(id){
  const title = document.getElementById('mEvTitle').value.trim();
  const startDate = document.getElementById('mEvStart').dataset.iso || '';
  const endDate = document.getElementById('mEvEnd').dataset.iso || '';
  const notes = document.getElementById('mEvNotes').value.trim();
  const classIds = Array.from(document.querySelectorAll('.eventClassChk:checked')).map(c=>Number(c.value));
  const poster = window.__evPoster || null;
  if(!title){ toast(t('field_title')+'?'); return; }
  // Poster antigo (se estiver sendo trocado ou removido) — só apagado do
  // Drive depois de confirmar que o novo estado foi salvo.
  const existingEvent = id ? findEvent(id) : null;
  const existingPlay = existingEvent && existingEvent.playId ? findPlay(existingEvent.playId) : null;
  const oldLogo = existingPlay ? existingPlay.logo : null;
  const ok = await mutate(s=>{
    // An event and its show are the same thing — every event automatically
    // has a matching play in Planejamento por Peça, no separate step or choice.
    if(id){
      const e = findEvent(id);
      e.title=title; e.startDate=startDate; e.endDate=endDate; e.notes=notes; e.classIds=classIds;
      if(e.playId){
        const p = findPlay(e.playId);
        if(p){ p.name = title; p.logo = poster; } // keep the show's name and poster in sync with the event
      } else {
        const newPlayId = nextId(s.plays);
        s.plays.push({ id:newPlayId, name:title, logo:poster, casts:[{id:1,name:'Elenco 1'},{id:2,name:'Elenco 2'}], characters:[] });
        e.playId = newPlayId;
      }
    } else {
      const newPlayId = nextId(s.plays);
      s.plays.push({ id:newPlayId, name:title, logo:poster, casts:[{id:1,name:'Elenco 1'},{id:2,name:'Elenco 2'}], characters:[] });
      s.events.push({ id:nextId(s.events), title, startDate, endDate, notes, playId:newPlayId, classIds });
    }
  });
  if(ok && oldLogo && oldLogo !== poster) apiDeleteImages([oldLogo]);
  window.__evPoster = null;
  closeModal();
  toast(t('toast_saved'));
}
/* Deleting an active event/show is no longer offered directly — archiving
   (above) is the only way to take one out of the active screens. Permanent
   removal now only happens from the Archived Events list, on records that
   have already been archived (see deleteArchivedRecord below). */

/* =======================================================================
   PLAYS / PLANNER
======================================================================= */
function playStats(play){
  let items=0, pending=0;
  play.characters.forEach(c=>(c.roles||[]).forEach(r=>(r.items||[]).forEach(it=>{
    items++;
    if(it.possession === 'faltando') pending++;
  })));
  return { items, pending, characters: play.characters.length };
}
// Resolved/total item count for ONE character, across every actor assigned
// to it in any cast — drives the progress bar on the character row in the
// Peças list. "Resolved" means the institute already has the piece (either
// from the collection or borrowed) — still missing/to-buy items don't count.
function characterItemStats(ch){
  let total=0, resolved=0;
  (ch.roles||[]).forEach(r=>(r.items||[]).forEach(it=>{
    total++;
    if(it.possession === 'acervo' || it.possession === 'emprestado') resolved++;
  }));
  return { total, resolved };
}

function renderPlaysList(){
  const cards = state.plays.map(p=>{
    const st = playStats(p);
    const logo = p.logo || null;
    return `

      <div class="poster-frame">
        ${logo ? `<img src="${esc(logo)}" alt="${esc(p.name)}" loading="lazy">` : `<span class="placeholder">${ICON.plays}</span>`}

          <div class="stats-mini">${st.characters} ${esc(t('stat_characters'))}</div>

  }).join('');
  return `
