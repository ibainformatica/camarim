<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backstage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#e9e7dd;
    --surface:#ffffff;
    --surface-2:#dedbcc;
    --surface-3:#d0cdba;
    --ink:#22241f;
    --ink-muted:#65624f;
    --ink-faint:#8b8875;
    --accent:#b9791a;
    --accent-ink:#231802;
    --accent-soft:#f1dda8;
    --secondary:#7c2f2e;
    --secondary-soft:#eeded9;
    --line:#cfcbb3;
    --success:#3f7a52;
    --success-soft:#dcead9;
    --warning:#c0742a;
    --warning-soft:#f3e2c9;
    --critical:#ae3a32;
    --critical-soft:#f2dcd7;
    --info:#2f6fb0;
    --info-soft:#dce8f5;
    --neutral-chip:#5c6660;
    --neutral-chip-soft:#e2e2d6;
    --shadow: 0 1px 2px rgba(34,36,31,.06), 0 6px 20px -8px rgba(34,36,31,.18);
    --radius: 14px;
    --radius-sm: 9px;
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  /* Backstage always shows the white-and-gold palette, regardless of the
     device's system light/dark preference — there is no near-black theme. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#e9e7dd;
      --surface:#ffffff;
      --surface-2:#dedbcc;
      --surface-3:#d0cdba;
      --ink:#22241f;
      --ink-muted:#65624f;
      --ink-faint:#8b8875;
      --accent:#b9791a;
      --accent-ink:#231802;
      --accent-soft:#f1dda8;
      --secondary:#7c2f2e;
      --secondary-soft:#eeded9;
      --line:#cfcbb3;
      --success:#3f7a52;
      --success-soft:#dcead9;
      --warning:#c0742a;
      --warning-soft:#f3e2c9;
      --critical:#ae3a32;
      --critical-soft:#f2dcd7;
      --info:#2f6fb0;
      --info-soft:#dce8f5;
      --neutral-chip:#5c6660;
      --neutral-chip-soft:#e2e2d6;
      --shadow: 0 1px 2px rgba(34,36,31,.06), 0 6px 20px -8px rgba(34,36,31,.18);
    }
  }
  :root[data-theme="dark"]{
    --bg:#e9e7dd;
    --surface:#ffffff;
    --surface-2:#dedbcc;
    --surface-3:#d0cdba;
    --ink:#22241f;
    --ink-muted:#65624f;
    --ink-faint:#8b8875;
    --accent:#b9791a;
    --accent-ink:#231802;
    --accent-soft:#f1dda8;
    --secondary:#7c2f2e;
    --secondary-soft:#eeded9;
    --line:#cfcbb3;
    --success:#3f7a52;
    --success-soft:#dcead9;
    --warning:#c0742a;
    --warning-soft:#f3e2c9;
    --critical:#ae3a32;
    --critical-soft:#f2dcd7;
    --info:#2f6fb0;
    --info-soft:#dce8f5;
    --neutral-chip:#5c6660;
    --neutral-chip-soft:#e2e2d6;
    --shadow: 0 1px 2px rgba(34,36,31,.06), 0 6px 20px -8px rgba(34,36,31,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  h1,h2,h3,h4{
    font-family:var(--font-display);
    font-weight:600;
    margin:0;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  p{margin:0;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-soft);}
  ::-webkit-scrollbar{height:10px;width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}

  .app-shell{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Topbar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:14px;
    padding:12px 20px;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex; align-items:baseline; gap:8px;
    font-family:var(--font-display); font-weight:700; font-size:1.2rem;
    cursor:pointer; user-select:none; background:none; border:none; color:var(--ink); padding:2px 0;
  }
  .brand .mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:28px; height:28px; border-radius:8px;
    background:var(--accent); color:var(--accent-ink);
    font-family:var(--font-display); font-weight:700; font-size:.95rem;
  }
  .brand .tag{font-family:var(--font-body); font-weight:500; font-size:.72rem; color:var(--ink-muted); letter-spacing:.03em;}
  .crumb{
    display:flex; align-items:center; gap:8px; color:var(--ink-muted); font-size:.85rem; font-weight:500;
  }
  .crumb .sep{color:var(--ink-faint);}
  .crumb .current{color:var(--ink);}
  .crumb-home{
    border:none; background:none; padding:0; margin:0; cursor:pointer;
    font:inherit; color:var(--ink-muted); text-decoration:none;
  }
  .crumb-home:hover{color:var(--ink);}
  .topbar-spacer{flex:1;}
  .lang-toggle{
    display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--surface);
  }
  .lang-toggle button{
    border:none; background:transparent; color:var(--ink-muted); padding:6px 13px; font-size:.78rem; font-weight:600;
    letter-spacing:.03em; cursor:pointer; transition:background .15s, color .15s;
  }
  .lang-toggle button.active{background:var(--accent); color:var(--accent-ink);}
  .home-link-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-muted);
    border-radius:999px; padding:6px 14px; font-size:.8rem; font-weight:600; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:border-color .15s, color .15s;
  }
  .home-link-btn:hover{border-color:var(--accent); color:var(--ink);}
  @media (max-width:640px){
    .topbar{padding:10px 12px; gap:8px;}
    .crumb{display:none;}
    .home-link-btn #manageDataLabel{display:none;}
    .home-link-btn{padding:8px;}
  }

  main{flex:1; width:100%;}
  .page{max-width:1180px; margin:0 auto; padding:28px 20px 80px;}
  .page-header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;
    margin-bottom:22px;
  }
  .page-header h1{font-size:1.9rem;}
  .page-header .sub{color:var(--ink-muted); font-size:.92rem; margin-top:4px;}
  .eyebrow{
    font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--accent);
    margin-bottom:6px; display:block;
  }

  /* ---------- Buttons / inputs ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:7px; justify-content:center;
    border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:9px 16px; font-size:.85rem; font-weight:600; cursor:pointer;
    transition:transform .12s ease, border-color .15s, background .15s;
  }
  .btn:hover{border-color:var(--ink-faint);}
  .btn:active{transform:scale(.97);}
  .btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .card:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }
  .btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.05); border-color:var(--accent);}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-ghost:hover{background:var(--surface-2); border-color:transparent;}
  .btn-danger{color:var(--critical); border-color:var(--critical-soft); background:var(--critical-soft);}
  .btn-sm{padding:5px 11px; font-size:.76rem; border-radius:8px;}
  .btn-icon{padding:8px; border-radius:9px;}

  input[type=text], input[type=date], input[type=number], input[type=search], textarea, select{
    font-family:var(--font-body); font-size:.86rem; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:9px;
    padding:8px 11px; width:100%;
  }
  textarea{resize:vertical; min-height:60px;}
  label{font-size:.74rem; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:5px;}
  .field{margin-bottom:12px;}
  .field-row{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}

  /* ---------- Home ---------- */
  .hero{
    padding:64px 20px 40px; text-align:center; position:relative; overflow:hidden;
  }
  .hero::before{
    content:""; position:absolute; inset:0; z-index:-1;
    background:
      radial-gradient(560px 280px at 50% -10%, var(--accent-soft), transparent 70%);
    opacity:.9;
  }
  .hero .eyebrow{display:inline-block; margin:0 auto 14px;}
  .hero h1{font-size:clamp(2.2rem, 5vw, 3.4rem); font-weight:700;}
  .hero p.lead{max-width:520px; margin:16px auto 0; color:var(--ink-muted); font-size:1rem;}
  .home-grid{
    max-width:920px; margin:36px auto 0; padding:0 20px;
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px;
  }
  @media (max-width:640px){ .home-grid{grid-template-columns:1fr;} }
  .nav-card{
    text-align:left; display:flex; gap:16px; align-items:flex-start;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; cursor:pointer; box-shadow:var(--shadow);
    transition:transform .16s ease, border-color .16s ease;
    color:var(--ink);
  }
  .nav-card:hover{transform:translateY(-3px); border-color:var(--accent);}
  .nav-card .num{
    font-family:var(--font-display); font-size:.78rem; font-weight:700; color:var(--ink-faint);
    letter-spacing:.06em;
  }
  .nav-card .icon{
    flex:none; width:46px; height:46px; border-radius:11px; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
  }
  .nav-card .icon svg{width:24px; height:24px;}
  .nav-card h3{font-size:1.12rem; margin-bottom:4px;}
  .nav-card p{color:var(--ink-muted); font-size:.83rem; line-height:1.45;}

  /* ---------- Cards / tables / lists ---------- */
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px;}
  .toolbar .search{max-width:260px;}
  .toolbar-label{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); white-space:nowrap;}
  .toolbar select{width:auto; max-width:220px;}
  .chipbar{display:flex; gap:7px; flex-wrap:wrap;}
  .chip{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-muted);
    border-radius:999px; padding:5px 13px; font-size:.76rem; font-weight:600; cursor:pointer;
    transition:all .12s ease;
  }
  .chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .chip .count{opacity:.6; margin-left:4px; font-variant-numeric:tabular-nums;}

  table{width:100%; border-collapse:collapse;}
  .table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
  th{
    text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
    font-weight:700; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  td{padding:11px 14px; border-bottom:1px solid var(--line); font-size:.86rem; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}

  .pill{
    display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:3px 10px;
    font-size:.72rem; font-weight:700; white-space:nowrap; letter-spacing:.01em;
    background:var(--neutral-chip-soft); color:var(--neutral-chip);
  }
  .pill.success{background:var(--success-soft); color:var(--success);}
  .pill.warning{background:var(--warning-soft); color:var(--warning);}
  .pill.critical{background:var(--critical-soft); color:var(--critical);}
  .pill.accent{background:var(--accent-soft); color:var(--accent);}
  .pill-btn{border:none; cursor:pointer;}

  .avatar-tag{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border-radius:999px;
    padding:3px 9px 3px 3px; font-size:.76rem; font-weight:600;
  }
  .avatar-tag .dot{width:20px; height:20px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:.65rem; font-weight:700;}
  .avatar-tag.ghost{background:var(--neutral-chip-soft); color:var(--ink-faint); font-style:italic;}

  .play-tag-list{display:flex; flex-wrap:wrap; gap:6px;}
  .play-tag{
    display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:4px 11px 4px 9px;
    font-size:.76rem; font-weight:600; cursor:pointer; border:1px solid transparent;
    background:var(--neutral-chip-soft); color:var(--ink);
  }
  .play-tag .dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--ink-faint);}
  .play-tag .muted{font-weight:500; font-size:.94em;}
  .play-tag.upcoming{background:var(--accent-soft);}
  .play-tag.upcoming .dot{background:var(--accent);}
  .play-tag.past{background:var(--surface-2); color:var(--ink-muted);}
  .play-tag.past .dot{background:var(--ink-faint);}
  .play-tag.unscheduled{background:var(--surface-2); color:var(--ink-muted); border-style:dashed; border-color:var(--line);}
  .play-tag.unscheduled .dot{background:var(--ink-faint);}
  .play-tag:hover{filter:brightness(0.97);}

  .empty-state{
    text-align:center; padding:56px 20px; color:var(--ink-muted);
  }
  .empty-state .icon{width:40px; height:40px; margin:0 auto 12px; color:var(--ink-faint);}

  /* ---------- Inventory grid ---------- */
  .inv-layout{display:grid; grid-template-columns:220px 1fr; gap:24px; align-items:start;}
  .filter-panel{position:sticky; top:78px; display:flex; flex-direction:column; gap:18px;}
  /* Sticky only makes sense next to a second column (the item grid) on desktop —
     once the layout collapses to one column on mobile, a sticky panel has
     nothing beside it to hover over and instead overlaps the list below it
     as the page scrolls. Drop it back to normal flow at that breakpoint.
     (Placed after the base rule above so it actually wins the cascade.) */
  @media (max-width:820px){ .inv-layout{grid-template-columns:1fr;} .filter-panel{position:static; top:auto;} }
  .filter-group h4{font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:8px;}
  .filter-list{display:flex; flex-direction:column; gap:2px;}
  .filter-list button{
    text-align:left; background:none; border:none; color:var(--ink-muted); padding:6px 8px; border-radius:7px;
    font-size:.82rem; cursor:pointer; display:flex; justify-content:space-between; gap:8px;
  }
  .filter-list button:hover{background:var(--surface-2);}
  .filter-list button.active{background:var(--accent-soft); color:var(--accent); font-weight:700;}
  .filter-list button .n{font-variant-numeric:tabular-nums; color:var(--ink-faint); font-size:.76rem;}

  .item-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
  .item-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    cursor:pointer; box-shadow:var(--shadow); display:flex; flex-direction:column;
    transition:transform .14s ease, border-color .14s ease;
  }
  .item-card:hover{transform:translateY(-2px); border-color:var(--accent);}
  .item-thumb{
    height:140px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; overflow:hidden;
    position:relative;
  }
  .item-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .item-thumb .placeholder{color:var(--ink-faint); display:flex;}
  .item-thumb .placeholder svg{width:34px; height:34px;}
  .item-qty-badge{
    position:absolute; top:8px; right:8px; background:rgba(20,18,12,.72); color:#fff; font-size:.7rem;
    font-weight:700; padding:2px 8px; border-radius:999px; font-variant-numeric:tabular-nums;
  }
  .item-body{padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .item-body h4{font-size:.92rem; font-family:var(--font-body); font-weight:700;}
  .item-body .meta{font-size:.76rem; color:var(--ink-muted);}
  .item-body .notes{font-size:.76rem; color:var(--ink-faint); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .item-foot{display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:4px;}

  /* ---------- Inventory item card: corner edit button ---------- */
  .item-card-edit{
    position:absolute; top:8px; left:8px; z-index:2;
    width:28px; height:28px; border-radius:8px; border:none; cursor:pointer;
    background:rgba(20,18,12,.68); color:#fff; display:flex; align-items:center; justify-content:center;
    transition:background .15s;
  }
  .item-card-edit:hover{background:var(--accent); color:var(--accent-ink);}
  .item-card-edit svg{width:14px; height:14px;}

  /* Shared meta/notes styles, reused by the image lightbox below */
  .item-full-meta{display:flex; flex-wrap:wrap; gap:7px;}
  .item-full-meta .pill{white-space:normal; text-align:left; max-width:100%;}
  .item-full-notes{color:var(--ink-muted); font-size:.92rem; line-height:1.6; max-width:65ch;}

  /* ---------- Inventory image lightbox ---------- */
  .modal.lightbox{max-width:420px;}
  .lightbox-frame{
    position:relative; width:100%; height:min(60vh,440px); border-radius:12px; overflow:hidden;
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
  }
  .lightbox-frame img{width:100%; height:100%; object-fit:contain; display:block;}
  .lightbox-frame .placeholder{color:var(--ink-faint); display:flex;}
  .lightbox-frame .placeholder svg{width:56px; height:56px;}
  .lightbox-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%;
    border:none; background:rgba(20,18,12,.55); color:#fff; font-size:1.3rem; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background .15s;
  }
  .lightbox-nav:hover{background:rgba(20,18,12,.82);}
  .lightbox-nav.prev{left:10px;}
  .lightbox-nav.next{right:10px;}
  .lightbox-dots{display:flex; justify-content:center; gap:6px; margin-top:10px;}
  .lb-dot{width:7px; height:7px; border-radius:50%; background:var(--surface-3); cursor:pointer;}
  .lb-dot.active{background:var(--accent);}

  /* ---------- Inventory modal: editable photo grid ---------- */
  .inv-modal-img-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .inv-modal-img{position:relative; width:76px; height:76px; border-radius:9px; overflow:hidden; background:var(--surface-2); flex:none;}
  .inv-modal-img img{width:100%; height:100%; object-fit:cover; display:block;}
  .inv-modal-img-remove{
    position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; border:none;
    background:rgba(20,18,12,.7); color:#fff; font-size:.85rem; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .inv-modal-img-remove:hover{background:var(--critical);}
  .inv-modal-img-add{
    width:76px; height:76px; border-radius:9px; border:1.5px dashed var(--line); color:var(--ink-faint); flex:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:border-color .15s, color .15s;
  }
  .inv-modal-img-add:hover{border-color:var(--accent); color:var(--accent);}
  .inv-modal-img-add svg{width:20px; height:20px;}

  /* ---------- Event modal: show poster ---------- */
  .ev-poster-field{display:flex; align-items:flex-end; gap:14px;}
  .ev-poster-box{
    width:84px; aspect-ratio:2/3; border-radius:9px; overflow:hidden; background:var(--surface-2);
    border:1px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
  }
  .ev-poster-box img{width:100%; height:100%; object-fit:cover; display:block;}
  .ev-poster-box .placeholder svg{width:26px; height:26px;}
  .ev-poster-actions{display:flex; flex-direction:column; gap:6px; align-items:flex-start;}
  .ev-poster-actions label.btn{cursor:pointer;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,13,8,.5); backdrop-filter:blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:100; overflow-y:auto;
  }
  .modal{
    background:var(--surface); border-radius:16px; border:1px solid var(--line); box-shadow:var(--shadow);
    width:100%; max-width:560px; padding:26px; animation:pop .16s ease;
  }
  .modal.wide{max-width:760px;}

  .modal-close{border:none; background:var(--surface-2); width:30px; height:30px; border-radius:50%; cursor:pointer;

  .cal-layout{display:grid; grid-template-columns:1fr 340px; gap:24px; align-items:start;}
  .cal-month-card{position:sticky; top:78px;}
  /* Same reasoning as .filter-panel / .char-list above: once the month
     panel stacks above the agenda list on mobile instead of sitting beside
     it, staying sticky makes it overlap the list underneath while scrolling. */
  @media (max-width:900px){ .cal-layout{grid-template-columns:1fr;} .cal-month-card{position:static; top:auto;} }
  .cal-nav{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .cal-nav h3{font-size:1.1rem; min-width:170px; text-align:center; flex:1;}
  @media (max-width:420px){ .cal-nav h3{min-width:0; font-size:1rem;} }
  .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px;}
  .cal-dow{font-size:.66rem; text-transform:uppercase; color:var(--ink-faint); text-align:center; font-weight:700; padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1/.82; min-width:0; border-radius:9px; border:1px solid transparent; background:var(--surface);
    padding:6px; font-size:.78rem; color:var(--ink-muted); cursor:pointer; display:flex; flex-direction:column; gap:4px;
    position:relative; overflow:hidden;
  }
  .cal-cell.pad{background:transparent; cursor:default;}
  .cal-cell.today{border-color:var(--ink);}
  .cal-cell.selected{box-shadow:inset 0 0 0 2px var(--secondary);}
  .cal-cell.has-event{background:var(--accent); color:var(--accent-ink); font-weight:700;}
  .cal-cell.has-event:hover{filter:brightness(1.04);}
  .cal-cell .ev-count{position:absolute; bottom:5px; right:7px; font-size:.62rem; font-weight:800; opacity:.85;}
  .agenda-list{display:flex; flex-direction:column; gap:10px;}
  .event-card{padding:14px 16px; display:flex; flex-direction:column; gap:6px;}
  .event-card .title-row{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .event-card h4{font-size:1rem;}
  .event-card .date{font-size:.78rem; color:var(--accent); font-weight:700;}
  .event-card .meta-row{display:flex; gap:14px; flex-wrap:wrap; font-size:.78rem; color:var(--ink-muted);}
  .event-card .actions-row{display:flex; gap:8px; margin-top:4px;}

  /* ---------- Plays / planner ---------- */
  .play-hero{display:flex; align-items:center; gap:20px; margin-bottom:24px; flex-wrap:wrap;}
  .play-hero img{height:76px;}
  .play-stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat-pill{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 14px; text-align:left;}
  .stat-pill .n{font-family:var(--font-display); font-size:1.3rem; font-weight:700; display:block; line-height:1.1;}
  .stat-pill .l{font-size:.68rem; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em;}

  .planner-layout{display:grid; grid-template-columns:280px 1fr; gap:20px; align-items:start;}
  .char-list{display:flex; flex-direction:column; gap:6px; position:sticky; top:78px;}
  /* Same reasoning as .filter-panel above: sticky is only safe next to a
     second column. On mobile the character list stacks above the character
     detail panel, so a stuck sidebar would overlap it (and its progress
     bars) while scrolling — go back to normal flow there instead.
     (Placed after the base rule above so it actually wins the cascade.) */
  @media (max-width:880px){ .planner-layout{grid-template-columns:1fr;} .char-list{position:static; top:auto;} }
  .char-row{
    text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:10px 13px;
    cursor:pointer; display:flex; flex-direction:column; gap:3px;
  }
  .char-row:hover{border-color:var(--accent);}
  .char-row.active{border-color:var(--accent); background:var(--accent-soft);}
  .char-row .name{font-weight:700; font-size:.88rem;}
  .char-row .sub{font-size:.72rem; color:var(--ink-muted);}
  .char-row .progress{height:4px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin-top:4px;}
  .char-row .progress > div{height:100%; background:var(--success);}
  .char-row .progress-caption{margin-top:1px;}

  .cast-block{margin-bottom:16px;}
  .cast-block h5{font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin-bottom:7px;}
  .cast-chips{display:flex; flex-wrap:wrap; gap:6px;}

  .costume-row{
    display:grid; grid-template-columns:1.6fr .5fr 1fr 1.4fr .9fr .9fr 30px;
    gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line);
  }
  .costume-row:last-child{border-bottom:none;}
  .costume-row.header-row{
    background:var(--surface-2); font-weight:700; font-style:italic; font-family:var(--font-display); font-size:.9rem;
    grid-template-columns:1fr;
  }
  .costume-row .item-name{font-size:.86rem; font-weight:600;}
  .costume-row .link-tag{font-size:.7rem; color:var(--accent); display:flex; align-items:center; gap:4px; margin-top:2px; cursor:pointer;}
  .row-stock-warning{font-size:.7rem; color:var(--warning); margin-top:4px; font-weight:600; line-height:1.4;}
  .costume-col-heads{
    font-size:.66rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:700;
    background:var(--surface-2); border-bottom:1px solid var(--line);
  }
  @media (max-width:760px){
    .costume-row{grid-template-columns:1fr 1fr; grid-auto-flow:row;}
    .costume-col-heads{display:none;}
  }
  .col-label{display:none; font-size:.62rem; text-transform:uppercase; color:var(--ink-faint); font-weight:700;}
  @media (max-width:760px){ .col-label{display:block;} }

  .planner-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap;}

  /* ---------- Stock alerts ---------- */
  .stock-alert{border-color:var(--warning); background:var(--warning-soft); padding:16px 18px; margin-bottom:14px;}
  .stock-alert-head{display:flex; align-items:center; gap:8px; font-size:.95rem; color:var(--warning);}
  .stock-alert-row{padding:9px 0; border-top:1px solid var(--line);}
  .stock-short-badge{
    display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 10px; font-size:.72rem;
    font-weight:700; background:var(--warning-soft); color:var(--warning); white-space:nowrap;
  }
  .stock-caution-badge{
    display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 10px; font-size:.72rem;

    display:flex; align-items:flex-start; gap:7px; padding:8px 12px; margin-bottom:14px;

  .stock-caution-alert-text{font-size:.76rem; color:var(--info); line-height:1.4;}

  /* ---------- Play posters (Netflix-tile style) ---------- */

  .play-card .poster-frame .placeholder{

  .kbd-hint{font-size:.72rem; color:var(--ink-faint);}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);

  select.inline-select{width:auto; padding:4px 8px; font-size:.78rem;}
  .flex-between{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .muted{color:var(--ink-muted);}
  .small{font-size:.78rem;}
  .mt-8{margin-top:8px;} .mt-16{margin-top:16px;} .mb-8{margin-bottom:8px;}

  .sync-pill{
    display:flex; align-items:center; gap:6px; font-size:.72rem; font-weight:600; color:var(--ink-faint);

  .sync-pill .dot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:none;}

  .sync-pill.saving{color:var(--warning);}
  .sync-pill.error{color:var(--critical); border-color:var(--critical-soft); background:var(--critical-soft);}
  .sync-pill.error .dot{background:var(--critical);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .full-screen-msg{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:40px 20px; text-align:center; color:var(--ink-muted);

  .full-screen-msg h2{font-size:1.3rem; color:var(--ink);}
  .full-screen-msg p{max-width:440px; font-size:.9rem; line-height:1.6;}
  .full-screen-msg textarea{
    width:100%; max-width:560px; min-height:90px; font-family:monospace; font-size:.78rem;
    background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:10px;
  }
  .spinner{
    width:26px; height:26px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none;} .sync-pill.saving .dot{animation:none;} }
</style>

function t(key){
  // state pode ainda não existir (telas de "não configurado" / erro de
  // carregamento aparecem antes do primeiro fetch terminar) — nesse caso usa
  // uiLang, que já reflete o idioma escolhido mesmo sem state.
  const d = (state && I18N[state.lang]) || I18N[uiLang] || I18N.pt;
  return d[key] !== undefined ? d[key] : (I18N.pt[key] !== undefined ? I18N.pt[key] : key);
}

/* ---------------------------------------------------------------------
   Backend — Google Sheets via Apps Script
   ---------------------------------------------------------------------
   Já preenchido com o link e o token da implantação em uso. Só muda se um
   dia vocês criarem uma implantação nova de verdade (não uma "Nova versão"
   da mesma) ou rodarem `setup()` de novo gerando outro token — ver
   GUIA_DE_CONFIGURACAO.md.
--------------------------------------------------------------------- */
const API_URL = 'https://script.google.com/macros/s/AKfycbzS8U0cF823GurSLhUqzvfA7_HaOpQ_cLF8rmcEssTJnt4cBYFxHPpTcafezuP0GNZ-/exec';
const API_TOKEN = '156a9839-2057-4c67-8c9e-577e0ae12318';

const POLL_INTERVAL_MS = 60000;
// Depois de um soluço na verificação em segundo plano, tenta de novo bem mais
// rápido que o intervalo normal — assim a mensagem de erro não fica minutos
// na tela por causa de uma falha passageira, some assim que a conexão volta.
const POLL_RETRY_MS = 8000;
let saving = false;

function apiConfigured(){ return !!API_URL; }

async function apiGet(){
  const url = API_URL + (API_URL.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(API_TOKEN);
  const res = await fetch(url);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'erro_desconhecido');
  return json.state;
}
// Sem cabeçalhos customizados de propósito: um Content-Type diferente de
// text/plain faria o navegador mandar um preflight OPTIONS antes do POST,
// e o Apps Script não responde esse preflight — a chamada falharia por CORS.
async function apiPost(payload){
  payload = Object.assign({ token: API_TOKEN }, payload);
  const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || 'erro_desconhecido');
  return json;
}
async function apiUploadImage(dataUrl, filename){
  const json = await apiPost({ action: 'uploadImage', dataUrl, filename });
  return json.url;
}
// Limpeza best-effort: apaga do Drive fotos que não estão mais em uso (foto
// removida de um item, ou o item/poster inteiro excluído). Nunca lança —
// se falhar, a foto só fica órfã no Drive, o que não quebra nada no site.
async function apiDeleteImages(urls){
  urls = (urls||[]).filter(Boolean);
  if(!urls.length) return;
  try{ await apiPost({ action: 'deleteImages', urls }); }
  catch(e){ /* best-effort — ver comentário acima */ }
}

function setSyncStatus(kind){
  const pill = document.getElementById('syncPill');
  const label = document.getElementById('syncLabel');
  if(!pill || !label) return;
  // "reconnecting" usa o mesmo visual (âmbar, discreto) de "saving" — é uma
  // tentativa em andamento, não uma falha grave como um salvamento perdido.
  const isBusy = kind === 'saving' || kind === 'reconnecting';
  pill.className = 'sync-pill' + (isBusy ? ' saving' : kind==='error' ? ' error' : '');
  label.textContent = kind==='saving' ? t('sync_saving')
    : kind==='reconnecting' ? t('sync_reconnecting')
    : kind==='error' ? t('sync_error')
    : kind==='offline' ? t('sync_offline') : t('sync_saved');
}

/* ---------------------------------------------------------------------
   State
--------------------------------------------------------------------- */
let state = null;

// Roda uma única vez, na primeira abertura: se a planilha ainda estiver
// vazia, semeia com os dados de exemplo que o protótipo já trazia (elenco e
// estoque do Seussical), incluindo as fotos que já existiam — cada uma é
// enviada ao Drive uma vez aqui. Depois disso a planilha vira a fonte de
// verdade e essa função nunca mais roda (o estoque deixa de estar vazio).
async function bootstrapIfEmpty(data){
  const empty = !data.actors.length && !data.inventory.length && !data.plays.length && !data.events.length;
  if(!empty || typeof window.SEED_DATA === 'undefined') return data;
  const seed = JSON.parse(JSON.stringify(window.SEED_DATA));
  const images = window.IMAGES || {};
  const urlByImageId = {};
  for(const imgId of Object.keys(images)){
    try{ urlByImageId[imgId] = await apiUploadImage(images[imgId], imgId + '.jpg'); }
    catch(e){ /* essa foto fica sem imagem; o resto da migração continua */ }
  }
  (seed.inventory||[]).forEach(i=>{ i.images = (i.images||[]).map(id=>urlByImageId[id]).filter(Boolean); });
  (seed.plays||[]).forEach(p=>{ p.logo = p.logo && urlByImageId[p.logo] ? urlByImageId[p.logo] : null; });
  if(!Array.isArray(seed.archivedEvents)) seed.archivedEvents = [];
  await apiPost({ action: 'saveState', state: seed });
  return seed;
}

async function loadState(){
  let data = await apiGet();
  data = await bootstrapIfEmpty(data);
  if(!Array.isArray(data.archivedEvents)) data.archivedEvents = [];
  data.lang = uiLang;
  return data;
}

async function saveState(){
  const { lang, ...rest } = state;
  await apiPost({ action: 'saveState', state: rest });
  try{ localStorage.setItem(LANG_KEY, state.lang); }catch(e){}
}

// Salva o estado atual e atualiza o indicador — compartilhado por mutate()
// (edições normais) e por applyBackup() (restaurar um backup).
async function commitAndSave(){
  render();
  saving = true;
  setSyncStatus('saving');
  try{
    await saveState();
    setSyncStatus('saved');
    return true;
  }catch(e){
    setSyncStatus('error');
    toast(t('sync_error'));
    return false;
  }finally{
    saving = false;
  }
}

async function mutate(fn){
  fn(state);
  return commitAndSave();
}

function syncLangButtons(l){
  const pt = document.getElementById('langPt'), en = document.getElementById('langEn');
  if(pt){ pt.classList.toggle('active', l==='pt'); pt.setAttribute('aria-pressed', l==='pt'); }
  if(en){ en.classList.toggle('active', l==='en'); en.setAttribute('aria-pressed', l==='en'); }
}

function setLang(l){
  uiLang = l;
  if(state) state.lang = l;
  try{ localStorage.setItem(LANG_KEY, l); }catch(e){}
  // Topbar (rótulo do botão "Gerenciar dados" + botões PT/EN) existe e é
  // visível independente de haver state carregado, então é sempre atualizada.
  initTopbarChrome();
  // Com state carregado, um render() completo já troca todo o resto da tela.
  // Sem state (não configurado, ou falha de carregamento), a única outra
  // coisa na tela é a mensagem de tela cheia — reexibe ela no novo idioma.
  if(state) render();
  else renderStaticScreen();
}

// Sincronização em segundo plano: outras pessoas podem estar editando a
// mesma planilha ao mesmo tempo. A cada intervalo, busca o estado mais
// recente e substitui o local — só quando não há um modal aberto (pra não
// arrancar um formulário sendo preenchido) nem um salvamento em andamento.
// Depois de uma falha, a próxima tentativa é reagendada bem mais cedo
// (POLL_RETRY_MS) em vez de esperar o intervalo cheio de novo — um soluço
// passageiro do Apps Script assim se resolve sozinho em segundos, não minutos.
function startPolling(){
  scheduleNextPoll(POLL_INTERVAL_MS);
}

function scheduleNextPoll(delay){
  setTimeout(pollOnce, delay);
}

async function pollOnce(){
  if(saving || document.getElementById('activeModalOverlay')){
    scheduleNextPoll(POLL_INTERVAL_MS);
    return;
  }
  try{
    const fresh = await apiGet();
    const lang = state.lang;
    state = fresh;
    state.lang = lang;
    if(!Array.isArray(state.archivedEvents)) state.archivedEvents = [];
    setSyncStatus('saved');
    render();
    scheduleNextPoll(POLL_INTERVAL_MS);
  }catch(e){
    setSyncStatus('reconnecting');
    scheduleNextPoll(POLL_RETRY_MS);
  }
}

/* ---------------------------------------------------------------------
   Utils
--------------------------------------------------------------------- */
function esc(s){
  if(s === undefined || s === null) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function nextId(arr){ return arr.reduce((m,x)=>Math.max(m,x.id||0),0)+1; }
function findActor(id){ return state.actors.find(a=>a.id===id); }
function findEvent(id){ return state.events.find(e=>e.id===id); }
function findPlay(id){ return state.plays.find(p=>p.id===id); }
function findInvItem(id){ return state.inventory.find(i=>i.id===id); }

/* ---------------------------------------------------------------------
   Stock availability — how much of each inventory item is actually needed
   across every active show, vs. how much exists.
   Shareable requirements (an item that can rotate between actors in the
   same show) only need the largest single requirement among them, not the
   sum — the rest of the demand math stays a plain sum. This is a
   simplifying assumption (it doesn't model who's on stage when), so any
   time that assumption is the only thing keeping a shortage from showing,
   savingsQty says so and the UI surfaces a note.
--------------------------------------------------------------------- */
function computeStockDeficits(){
  const byInv = {};
  state.plays.forEach(play=>{
    play.characters.forEach(ch=>{
      ch.items.forEach(it=>{
        if(it.isGroupHeader || !it.inventoryItemId) return;
        const qty = (it.qty===undefined || it.qty===null) ? 1 : (Number(it.qty)||0);
        if(qty<=0) return;
        (byInv[it.inventoryItemId] = byInv[it.inventoryItemId]||[]).push({
          playId: play.id, playName: play.name, characterName: ch.name, itemName: it.name,
          qty, shareable: it.shareable==='yes' || it.shareable==='partial'
        });
      });
    });
  });
  const result = {};
  Object.keys(byInv).forEach(key=>{
    const invId = Number(key);
    const invItem = findInvItem(invId);
    if(!invItem) return;
    const contributors = byInv[key];
    const fixed = contributors.filter(c=>!c.shareable);
    const shareable = contributors.filter(c=>c.shareable);
    const demandFixed = fixed.reduce((sum,c)=>sum+c.qty, 0);
    const demandShareableMax = shareable.length ? Math.max(...shareable.map(c=>c.qty)) : 0;
    const demandShareableSum = shareable.reduce((sum,c)=>sum+c.qty, 0);
    const demand = demandFixed + demandShareableMax;
    const demandWithoutSharing = demandFixed + demandShareableSum;
    const available = (invItem.status==='missing' || invItem.status==='repair') ? 0 : (invItem.qty||0);
    const deficit = Math.max(0, demand - available);
    const savingsQty = demandWithoutSharing - demand;
    result[invId] = {
      item: invItem, contributors, demand, available, deficit,
      savingsQty, savedByShareable: deficit === 0 && savingsQty > 0 && demandWithoutSharing > available
    };
  });
  return result;
}
function stockAlertHtml(list){
  const shortRows = list.filter(d=>d.deficit > 0);
  const cautionRows = list.filter(d=>d.deficit === 0 && d.savedByShareable);

  const shortBlock = shortRows.length ? `
  <div class="card stock-alert">
    <div class="stock-alert-head">⚠️ <strong>${esc(t('stock_alert_title'))}</strong></div>
    <p class="small muted" style="margin:4px 0 8px;">${esc(t('stock_alert_lead'))}</p>
    ${shortRows.map(d=>{
      const usedIn = Array.from(new Set(d.contributors.map(c=>`${c.playName} · ${c.characterName} (${c.itemName} ×${c.qty})`))).join(', ');
      return `
      <div class="stock-alert-row">
        <div>⚠️ <strong>${esc(d.item.name)}</strong>
          <span class="small muted"> — ${esc(t('stock_needs'))} ${d.demand}, ${esc(t('stock_has'))} ${d.available} (${esc(t('stock_missing'))} ${d.deficit})</span>
        </div>
        <div class="small muted">${esc(t('stock_used_in'))}: ${esc(usedIn)}</div>
      </div>`;
    }).join('')}
  </div>` : '';

  const cautionBlock = cautionRows.length ? `
  <div class="card stock-caution-alert" title="${esc(t('stock_saved_by_shareable'))}">
    <span class="stock-caution-alert-icon">ℹ️</span>
    <span class="stock-caution-alert-text"><strong>${esc(t('stock_caution_title'))}:</strong> ${esc(cautionRows.map(d=>d.item.name).join(', '))} — ${esc(t('stock_caution_short'))}</span>
  </div>` : '';

  return shortBlock + cautionBlock;
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

function openModal(innerHtml, opts){
  opts = opts || {};
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModalOverlay';
  overlay.addEventListener('mousedown', (e)=>{ if(e.target === overlay) closeModal(); });
  overlay.innerHTML = `<div class="modal ${opts.wide?'wide':''} ${opts.lightbox?'lightbox':''}">${innerHtml}</div>`;
  document.body.appendChild(overlay);
  document.addEventListener('keydown', escCloseHandler);
  const firstInput = overlay.querySelector('input, select, textarea');
  if(firstInput) setTimeout(()=>firstInput.focus(), 30);
}
function escCloseHandler(e){ if(e.key === 'Escape') closeModal(); }
function closeModal(){
  const ov = document.getElementById('activeModalOverlay');
  if(ov) ov.remove();
  document.removeEventListener('keydown', escCloseHandler);
}
function confirmAction(message, onConfirm, opts){
  opts = opts || {};
  openModal(`
    <div class="modal-head"><h3>${esc(opts.title || t('confirm_delete_title'))}</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p class="small muted">${esc(message)}</p>

function shareableMeta(v){
  switch(v){
    case 'yes': return {cls:'success', label:t('shareable_yes')};
    case 'no': return {cls:'critical', label:t('shareable_no')};
    case 'partial': return {cls:'warning', label:t('shareable_partial')};
    case 'tryon': return {cls:'accent', label:t('shareable_tryon')};
    default: return {cls:'neutral', label:t('shareable_unset')};
  }
}
function checkMeta(v){
  switch(v){
    case 'done': return {cls:'success', label:t('check_done')};
    case 'pending': return {cls:'warning', label:t('check_pending')};
    case 'partial': return {cls:'warning', label:t('check_partial')};
    default: return {cls:'neutral', label:t('check_unset')};
  }
}
function invStatusMeta(v){
  switch(v){
    case 'in-use': return {cls:'accent', label:t('status_inuse')};
    case 'missing': return {cls:'critical', label:t('status_missing')};
    case 'repair': return {cls:'warning', label:t('status_repair')};

  const h = window.location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return { page: parts[0] || 'home', param: parts[1] };
}

let actorsFilter = { group: 'all', play: 'all', q: '', sort: 'name' };

// One entry per PLAY an actor is part of (grouped across all their characters
// in that play), with a past/upcoming/unscheduled status derived from the
// play's linked event date — this is what drives the "Peças" column below.
function actorPlaysFor(actorId){
  const todayStr = new Date().toISOString().slice(0,10);
  const out = [];
  state.plays.forEach(play=>{
    const chars = [];
    play.characters.forEach(ch=>{
      ['cast1','cast2'].forEach(ck=>{
        (ch[ck].names||[]).forEach(n=>{
          if(n.actorId === actorId) chars.push({ characterId: ch.id, character: ch.name, cast: ck });
        });
      });
    });
    if(!chars.length) return;
    const event = state.events.find(e=>e.playId === play.id);
    let status = 'unscheduled';
    if(event && event.startDate) status = event.startDate >= todayStr ? 'upcoming' : 'past';
    out.push({ playId: play.id, playName: play.name, chars, status, eventDate: event ? event.startDate : null });
  });
  out.sort((a,b)=>{
    const order = { upcoming:0, unscheduled:1, past:2 };
    if(order[a.status] !== order[b.status]) return order[a.status]-order[b.status];
    return (a.eventDate||'').localeCompare(b.eventDate||'');
  });
  return out;
}

function renderActors(){
  const groups = Array.from(new Set(state.actors.map(a=>a.castGroup).filter(Boolean))).sort();
  const plays = [...state.plays].sort((a,b)=>a.name.localeCompare(b.name));

  let list = state.actors.filter(a=>{
    if(actorsFilter.group !== 'all' && a.castGroup !== actorsFilter.group) return false;
    if(actorsFilter.q && !a.name.toLowerCase().includes(actorsFilter.q.toLowerCase())) return false;
    return true;
  }).map(a=>({ actor:a, plays: actorPlaysFor(a.id) }));

  if(actorsFilter.play !== 'all'){
    list = actorsFilter.play === 'none'
      ? list.filter(x=>!x.plays.length)
      : list.filter(x=>x.plays.some(p=>p.playId === Number(actorsFilter.play)));
  }

  const statusRank = { upcoming:0, unscheduled:1, past:2 };
  list.sort((x,y)=>{
    if(actorsFilter.sort === 'group'){
      const g = (x.actor.castGroup||'').localeCompare(y.actor.castGroup||'');
      return g || x.actor.name.localeCompare(y.actor.name);
    }
    if(actorsFilter.sort === 'plays'){
      return (y.plays.length - x.plays.length) || x.actor.name.localeCompare(y.actor.name);
    }
    if(actorsFilter.sort === 'upcoming'){
      const rx = x.plays.length ? statusRank[x.plays[0].status] : 3;
      const ry = y.plays.length ? statusRank[y.plays[0].status] : 3;
      if(rx !== ry) return rx - ry;
      const dx = x.plays.length ? (x.plays[0].eventDate||'') : '';
      const dy = y.plays.length ? (y.plays[0].eventDate||'') : '';
      return dx.localeCompare(dy) || x.actor.name.localeCompare(y.actor.name);
    }
    return x.actor.name.localeCompare(y.actor.name);
  });

  const rows = list.map(({actor:a, plays})=>{
    const playsHtml = plays.length
      ? plays.map(p=>{
          const charNames = p.chars.map(c=>c.character).join(', ');
          const statusLabel = p.status==='upcoming' ? t('status_upcoming') : p.status==='past' ? t('status_past') : t('status_unscheduled');
          return `<span class="play-tag ${p.status}" title="${esc(charNames)} — ${esc(statusLabel)}" onclick="activeCharacterId=${p.chars[0].characterId}; go('plays', ${p.playId});">
            <span class="dot"></span>${esc(p.playName)}<span class="muted">· ${esc(charNames)}</span>
          </span>`;
        }).join(' ')
      : `<span class="avatar-tag ghost">${esc(t('no_role_assigned'))}</span>`;
    return `
      <tr>
        <td><strong>${esc(a.name)}</strong></td>
        <td>${a.castGroup ? `<span class="pill accent">${esc(a.castGroup)}</span>` : '—'}</td>
        <td><div class="play-tag-list">${playsHtml}</div></td>
        <td>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-icon btn-ghost" title="${esc(t('edit'))}" onclick="openActorModal(${a.id})">${ICON.edit}</button>
            <button class="btn btn-icon btn-ghost" title="${esc(t('delete'))}" onclick="deleteActor(${a.id})">${ICON.trash}</button>
          </div>
        </td>
      </tr>`;
  }).join('');

  return `
  <div class="page">
    <div class="page-header">
      <div><h1>${esc(t('actors_title'))}</h1><p class="sub">${esc(t('actors_sub'))}</p></div>
      <button class="btn btn-primary" onclick="openActorModal()">${ICON.plus}${esc(t('actor_add'))}</button>
    </div>
    <div class="toolbar">
      <input class="search" type="search" placeholder="${esc(t('search_placeholder'))}" value="${esc(actorsFilter.q)}"
        oninput="actorsFilter.q=this.value; renderActorsInPlace();">
      <div class="chipbar">
        <button class="chip ${actorsFilter.group==='all'?'active':''}" onclick="actorsFilter.group='all'; render();">${esc(t('all'))}</button>
        ${groups.map(g=>`<button class="chip ${actorsFilter.group===g?'active':''}" onclick="actorsFilter.group='${esc(g).replace(/'/g,"\\'")}'; render();">${esc(g)}</button>`).join('')}
      </div>
    </div>
    <div class="toolbar">
      <div class="chipbar">
        <span class="toolbar-label">${esc(t('filter_play'))}:</span>
        <button class="chip ${actorsFilter.play==='all'?'active':''}" onclick="actorsFilter.play='all'; render();">${esc(t('all'))}</button>
        ${plays.map(p=>`<button class="chip ${actorsFilter.play===String(p.id)?'active':''}" onclick="actorsFilter.play='${p.id}'; render();">${esc(p.name)}</button>`).join('')}
        <button class="chip ${actorsFilter.play==='none'?'active':''}" onclick="actorsFilter.play='none'; render();">${esc(t('no_play'))}</button>
      </div>
      <div class="topbar-spacer"></div>
      <label class="toolbar-label" for="actorsSortSelect">${esc(t('sort_by'))}</label>
      <select id="actorsSortSelect" style="width:auto;" onchange="actorsFilter.sort=this.value; render();">
        <option value="name" ${actorsFilter.sort==='name'?'selected':''}>${esc(t('sort_name'))}</option>
        <option value="group" ${actorsFilter.sort==='group'?'selected':''}>${esc(t('sort_group'))}</option>
        <option value="plays" ${actorsFilter.sort==='plays'?'selected':''}>${esc(t('sort_plays'))}</option>
        <option value="upcoming" ${actorsFilter.sort==='upcoming'?'selected':''}>${esc(t('sort_upcoming'))}</option>
      </select>
    </div>
    ${list.length ? `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>${esc(t('col_name'))}</th><th>${esc(t('col_group'))}</th><th>${esc(t('col_plays'))}</th><th></th>
        </tr></thead>
        <tbody id="actorsTbody">${rows}</tbody>
      </table>
    </div>` : `<div class="empty-state card">${ICON.actors.replace('<svg','<svg class="icon"')}<p>${esc(t('no_actors'))}</p></div>`}
  </div>`;
}

/* ---- Photo uploads: resized/compressed on a canvas, then sent to the
   Apps Script backend, which saves the file to Google Drive and hands back
   a public URL. From here on, "an image" IS that URL — nothing is kept
   locally, so every viewer with the sheet's link sees the same photos. ---- */
function invModalImageGalleryHtml(){
  const urls = window.__invModalImages || [];
  return urls.map((url,idx)=>`
    <div class="inv-modal-img">
      <img src="${url}" alt="">
      <button type="button" class="inv-modal-img-remove" title="${esc(t('remove'))}" onclick="removeInvModalImage(${idx})">&times;</button>
    </div>`).join('') + `
    <label class="inv-modal-img-add" title="${esc(t('add_photo'))}">
      ${ICON.plus}
      <input type="file" accept="image/*" multiple style="display:none;" onchange="handleInvModalImageUpload(this.files); this.value='';">
    </label>`;
}
function renderInvModalImageGallery(){
  const box = document.getElementById('invModalImgGallery');
  if(box) box.innerHTML = invModalImageGalleryHtml();
}
function removeInvModalImage(idx){
  window.__invModalImages = (window.__invModalImages||[]).filter((_,i)=>i!==idx);
  renderInvModalImageGallery();
}
// Resize/compress on a canvas (keeps uploads small), then hand the
// resulting data URL to the backend and resolve with the Drive URL it
// returns. Rejects on read/upload failure — callers show a toast.
function processImageUpload(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read_failed'));
    reader.onload = function(ev){
      const img = new Image();
      img.onerror = ()=>reject(new Error('decode_failed'));
      img.onload = function(){
        const MAX = 900;
        let w = img.width, h = img.height;
        if(w > MAX || h > MAX){
          if(w > h){ h = Math.round(h*MAX/w); w = MAX; } else { w = Math.round(w*MAX/h); h = MAX; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        apiUploadImage(dataUrl, file.name || 'foto.jpg').then(resolve, reject);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function handleInvModalImageUpload(fileList){
  for(const file of Array.from(fileList||[])){
    try{
      const url = await processImageUpload(file);
      window.__invModalImages = (window.__invModalImages||[]).concat([url]);
      renderInvModalImageGallery();
    }catch(e){ toast(t('toast_photo_upload_failed')); }
  }
}

async function saveInventoryModal(id){
  const name = document.getElementById('mInvName').value.trim();
  const qty = parseInt(document.getElementById('mInvQty').value,10) || 0;
  const size = document.getElementById('mInvSize').value.trim();
  const section = document.getElementById('mInvSection').value.trim();
  const notes = document.getElementById('mInvNotes').value.trim();
  const status = document.getElementById('mInvStatus').value;
  const evVal = document.getElementById('mInvEvent').value;
  const assignedEventId = evVal ? Number(evVal) : null;
  const images = (window.__invModalImages||[]).slice();
  if(!name){ toast(t('field_itemname')+'?'); return; }
  // Fotos que estavam no item antes e não estão mais na lista nova — só essas
  // (não as que o usuário só experimentou tirar e recolocou) são apagadas do
  // Drive, e só depois de confirmar que o salvamento deu certo.
  const prevImages = id ? ((findInvItem(id)||{}).images || []).slice() : [];
  const ok = await mutate(s=>{
    if(id){
      const i = findInvItem(id);
      i.name=name; i.qty=qty; i.size=size; i.section=section||i.section; i.notes=notes; i.status=status; i.assignedEventId=assignedEventId; i.images=images;
    } else {
      s.inventory.push({ id:nextId(s.inventory), section: section || t('none'), qty, size, name, notes, images, status, assignedEventId });
    }
  });
  if(ok){
    const removed = prevImages.filter(url => !images.includes(url));
    if(removed.length) apiDeleteImages(removed);
  }
  window.__invModalImages = null;
  closeModal();
  toast(t('toast_saved'));
}
function deleteInventoryItem(id){
  confirmAction(t('confirm_delete_msg'), async ()=>{
    const images = ((findInvItem(id)||{}).images || []).slice();

      s.inventory = s.inventory.filter(i=>i.id!==id);
      s.plays.forEach(p=>p.characters.forEach(c=>c.items.forEach(it=>{ if(it.inventoryItemId===id) it.inventoryItemId=null; })));
    });
    if(ok && images.length) apiDeleteImages(images);
    closeModal();
    toast(t('toast_deleted'));
  });
}

/* =======================================================================
   CALENDAR
======================================================================= */
let calCursor = (function(){ const d=new Date(); return { y:d.getFullYear(), m:d.getMonth() }; })();
let calSelectedDate = null;
let archivedListOpen = false;

function parseDate(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function dateToStr(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
// Every day an event spans, inclusive — a single-day event (no end date, or
// an end date before the start) is just its own start date.
function eventDateRange(e){
  const start = parseDate(e.startDate);
  if(!start) return [];
  const end = e.endDate ? parseDate(e.endDate) : null;
  if(!end || end <= start) return [e.startDate];
  const days = [];
  const cur = new Date(start);
  let guard = 0;
  while(cur <= end && guard < 366){
    days.push(dateToStr(cur));
    cur.setDate(cur.getDate()+1);
    guard++;
  }
  return days;
}
function fmtDate(s, lang){
  const d = parseDate(s); if(!d) return '';
  const opts = { day:'2-digit', month:'short', year:'numeric' };
  return d.toLocaleDateString(lang==='pt'?'pt-BR':'en-US', opts);
}
const MONTH_NAMES = {
  pt: ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],
  en: ['January','February','March','April','May','June','July','August','September','October','November','December']

      </div>
    </div>`;
  }
  const archivedList = [...(state.archivedEvents||[])].sort((x,y)=>y.archivedAt.localeCompare(x.archivedAt));

  const y = calCursor.y, m = calCursor.m;
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const eventsByDate = {};
  state.events.forEach(e=>{
    eventDateRange(e).forEach(dateStr=>{
      (eventsByDate[dateStr] = eventsByDate[dateStr]||[]).push(e);

  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell pad"></div>`;

    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;

    cells += `<div class="cal-cell ${isToday?'today':''} ${isSel?'selected':''} ${evs.length?'has-event':''}" onclick="calSelectedDate='${dateStr}'; renderCalendarInPlace();">
      <span>${day}</span>

  const selEvents = calSelectedDate ? (eventsByDate[calSelectedDate]||[]) : [];

  return `

      <div><h1>${esc(t('cal_title'))}</h1><p class="sub">${esc(t('cal_sub'))}</p></div>

        ${archivedList.length ? `

          <button class="btn btn-sm" onclick="archivedListOpen=!archivedListOpen; renderCalendarInPlace();">${ICON.box} ${esc(t('archived_events'))} (${archivedList.length})</button>
          ${archivedListOpen ? `<div class="mt-8">${archivedList.map(archivedRow).join('')}</div>` : ''}
        </div>` : ''}
      </div>
      <div>
        <div class="card cal-month-card" style="padding:16px;">
          <div class="cal-nav">
            <button class="btn btn-icon btn-ghost btn-sm" onclick="calCursor.m--; if(calCursor.m<0){calCursor.m=11;calCursor.y--;} renderCalendarInPlace();">‹</button>
            <h3>${esc(MONTH_NAMES[state.lang][m])} ${y}</h3>
            <button class="btn btn-icon btn-ghost btn-sm" onclick="calCursor.m++; if(calCursor.m>11){calCursor.m=0;calCursor.y++;} renderCalendarInPlace();">›</button>

          <div class="cal-grid" id="calGridCells">${cells}</div>
          ${calSelectedDate ? `

            </div>` : ''}
        </div>
      </div>
    </div>
  </div>`;
}

// Archiving an event takes the whole show out of the active screens (freeing
// its costumes and clearing it from the cast/planning views) while keeping a
// full historical record — an event and its show are the same thing, so
// archiving one archives both.
function archiveEvent(id){
  const ev = findEvent(id);
  if(!ev) return;
  const play = ev.playId ? findPlay(ev.playId) : null;
  const hasPlan = play && play.characters.some(c=>c.items.some(it=>!it.isGroupHeader));
  const msg = hasPlan ? t('confirm_archive_event_with_plan_msg') : t('confirm_archive_event_msg');
  confirmAction(msg, ()=>{
    mutate(s=>{
      const e = findEvent(id);
      const p = e.playId ? findPlay(e.playId) : null;
      const snapshot = {
        title: e.title, startDate: e.startDate, endDate: e.endDate,
        location: e.location, notes: e.notes,
        participants: (e.participantIds||[]).map(aid=>{ const a=findActor(aid); return a ? a.name : ('#'+aid); }),
        characters: p ? p.characters.map(c=>({
          name: c.name, total: c.total,
          cast1: (c.cast1.names||[]).map(n=>n.actorId ? (findActor(n.actorId)||{}).name : n.label),
          cast2: (c.cast2.names||[]).map(n=>n.actorId ? (findActor(n.actorId)||{}).name : n.label),
          items: c.items.filter(it=>!it.isGroupHeader).map(it=>({
            name: it.name, qty: (it.qty===undefined||it.qty===null) ? 1 : it.qty, shareable: it.shareable, source: it.source,
            purchaseStatus: it.purchaseStatus, arrived: it.arrived,
            inventoryItem: it.inventoryItemId ? ((findInvItem(it.inventoryItemId)||{}).name || null) : null
          }))
        })) : []
      };
      const linkedInvIds = new Set();
      if(p) p.characters.forEach(c=>c.items.forEach(it=>{ if(it.inventoryItemId) linkedInvIds.add(it.inventoryItemId); }));
      // Keep the exact original event/play objects (not just the readable
      // snapshot above) plus which inventory items this event touched, so an
      // accidental archive can be undone losslessly instead of only offering
      // a read-only record.
      const inventoryEffects = {
        assigned: s.inventory.filter(i=>i.assignedEventId===id).map(i=>i.id),
        inUse: Array.from(linkedInvIds).filter(iid=>{ const inv = s.inventory.find(x=>x.id===iid); return inv && inv.status==='in-use'; })
      };
      const rawEvent = JSON.parse(JSON.stringify(e));
      const rawPlay = p ? JSON.parse(JSON.stringify(p)) : null;
      s.events = s.events.filter(x=>x.id!==id);
      if(p) s.plays = s.plays.filter(x=>x.id!==p.id);
      s.inventory.forEach(i=>{
        if(i.assignedEventId===id) i.assignedEventId=null;
        if(linkedInvIds.has(i.id) && i.status==='in-use') i.status='available';
      });
      if(!Array.isArray(s.archivedEvents)) s.archivedEvents = [];
      s.archivedEvents.push({ id: nextId(s.archivedEvents), archivedAt: new Date().toISOString(), snapshot, rawEvent, rawPlay, inventoryEffects });
    });
    toast(t('toast_archived'));
  });
}
// Restores an archived event (and its show) exactly as they were archived —
// the undo for an accidental archive. Falls back to fresh ids only if the
// original ones have since been reused by something else.
function unarchiveEvent(id){
  let approximate = false;
  mutate(s=>{
    const a = (s.archivedEvents||[]).find(x=>x.id===id);
    if(!a) return;
    let event, play;
    if(a.rawEvent){
      // Archived after the exact snapshot existed — restore losslessly.
      event = JSON.parse(JSON.stringify(a.rawEvent));
      play = a.rawPlay ? JSON.parse(JSON.stringify(a.rawPlay)) : null;
    } else {
      // Older record, archived before the exact snapshot existed: only the
      // readable summary was kept. Rebuild a best-effort event/play from it,
      // re-matching actors and inventory items by name where still possible.
      approximate = true;
      const snap = a.snapshot;
      const byName = (list, name)=> list.find(x=>x.name.trim().toLowerCase() === (name||'').trim().toLowerCase());
      const characters = (snap.characters||[]).map((c,ci)=>({
        id: ci+1, name: c.name, total: c.total||'',
        cast1: { count:'', names: (c.cast1||[]).map(n=>{ const f=byName(s.actors,n); return f ? {actorId:f.id} : {label:n}; }) },
        cast2: { count:'', names: (c.cast2||[]).map(n=>{ const f=byName(s.actors,n); return f ? {actorId:f.id} : {label:n}; }) },
        items: (c.items||[]).map((it,ii)=>{
          const inv = it.inventoryItem ? byName(s.inventory, it.inventoryItem) : null;
          return { id: ii+1, name: it.name, isGroupHeader:false,
            qty: (it.qty===undefined||it.qty===null||it.qty==='') ? 1 : it.qty,
            shareable: it.shareable||'', source: it.source||'', purchaseStatus: it.purchaseStatus||'', arrived: it.arrived||'',
            rawImported:null, inventoryItemId: inv ? inv.id : null };
        })
      }));
      play = { id: nextId(s.plays), name: snap.title, logo:null, castLabels:{cast1:'Elenco 1', cast2:'Elenco 2'}, characters };
      event = { id: nextId(s.events), title: snap.title, startDate: snap.startDate||'', endDate: snap.endDate||'',
        location: snap.location||'', notes: snap.notes||'', playId: play.id,
        participantIds: (snap.participants||[]).map(n=>{ const f=byName(s.actors,n); return f ? f.id : null; }).filter(Boolean) };
    }
    if(play){
      if(s.plays.some(p=>p.id===play.id)) play.id = nextId(s.plays);
      event.playId = play.id;
      s.plays.push(play);
    }
    if(s.events.some(e=>e.id===event.id)) event.id = nextId(s.events);
    s.events.push(event);
    (a.inventoryEffects && a.inventoryEffects.assigned || []).forEach(iid=>{
      const inv = s.inventory.find(x=>x.id===iid);
      if(inv && !inv.assignedEventId) inv.assignedEventId = event.id;
    });
    (a.inventoryEffects && a.inventoryEffects.inUse || []).forEach(iid=>{
      const inv = s.inventory.find(x=>x.id===iid);
      if(inv && inv.status==='available') inv.status = 'in-use';
    });
    s.archivedEvents = s.archivedEvents.filter(x=>x.id!==id);
  });
  closeModal();
  toast(approximate ? t('toast_unarchived_approx') : t('toast_unarchived'));
}
// Archived records used to be shown/exported as raw JSON, which reads as
// code, not as a costume plan. This flattens the same snapshot into one row
// per costume item (or one row per character, if it had none) so it reads
// like a normal spreadsheet — the same row list backs both the on-screen
// table and the .csv export, so they always agree.
function archivedRecordRows(a){
  const s = a.snapshot;
  const rows = [];
  (s.characters||[]).forEach(c=>{
    const items = (c.items||[]).filter(Boolean);
    const base = {
      character: c.name||'', total: c.total||'',
      cast1: (c.cast1||[]).join('; '), cast2: (c.cast2||[]).join('; ')
    };
    if(!items.length){
      rows.push(Object.assign({item:'', qty:'', shareable:'', source:'', purchaseStatus:'', arrived:'', inventoryItem:''}, base));
    } else {
      items.forEach(it=>{
        rows.push(Object.assign({
          item: it.name||'', qty: (it.qty===undefined||it.qty===null) ? '' : it.qty,
          shareable: it.shareable ? shareableMeta(it.shareable).label : '',
          source: it.source||'',
          purchaseStatus: it.purchaseStatus ? checkMeta(it.purchaseStatus).label : '',
          arrived: it.arrived ? checkMeta(it.arrived).label : '',
          inventoryItem: it.inventoryItem||''
        }, base));
      });
    }
  });
  return rows;
}

function csvEscape(v){
  const s = (v===undefined||v===null) ? '' : String(v);
  if(/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function archivedRecordToCsv(a){
  const s = a.snapshot;
  const lines = [];
  lines.push([t('field_title'), s.title||''].map(csvEscape).join(','));
  lines.push([t('field_startdate'), s.startDate ? fmtDate(s.startDate, state.lang) : ''].map(csvEscape).join(','));
  if(s.endDate) lines.push([t('field_enddate'), fmtDate(s.endDate, state.lang)].map(csvEscape).join(','));
  lines.push([t('field_location'), s.location||''].map(csvEscape).join(','));
  lines.push([t('field_participants'), (s.participants||[]).join('; ')].map(csvEscape).join(','));
  if(s.notes) lines.push([t('field_notes'), s.notes].map(csvEscape).join(','));
  lines.push([t('archived_on'), fmtDate(a.archivedAt.slice(0,10), state.lang)].map(csvEscape).join(','));
  lines.push('');
  const headers = [t('col_character'), t('total_label'), t('field_cast1'), t('field_cast2'), t('col_item'), t('col_qty'), t('col_shareable'), t('col_source'), t('col_purchase'), t('col_arrived'), t('col_stock_item')];
  lines.push(headers.map(csvEscape).join(','));
  archivedRecordRows(a).forEach(r=>{
    lines.push([r.character, r.total, r.cast1, r.cast2, r.item, r.qty, r.shareable, r.source, r.purchaseStatus, r.arrived, r.inventoryItem].map(csvEscape).join(','));
  });
  return lines.join('\r\n');
}
function downloadArchivedRecord(id){
  const a = (state.archivedEvents||[]).find(x=>x.id===id);
  if(!a) return;
  try{
    // Leading BOM so accented characters (a, c, ã, etc.) open correctly in Excel.
    const blob = new Blob(['﻿' + archivedRecordToCsv(a)], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = (a.snapshot.title||'evento').replace(/[^a-z0-9]+/gi,'_') + '.csv';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){ /* best effort — some preview sandboxes block downloads */ }
}

async function saveEventModal(id){
  const title = document.getElementById('mEvTitle').value.trim();
  const startDate = document.getElementById('mEvStart').value;
  const endDate = document.getElementById('mEvEnd').value;
  const location = document.getElementById('mEvLocation').value.trim();
  const notes = document.getElementById('mEvNotes').value.trim();
  const participantIds = Array.from(document.querySelectorAll('.participantChk:checked')).map(c=>Number(c.value));
  const poster = window.__evPoster || null;
  if(!title){ toast(t('field_title')+'?'); return; }
  // Poster antigo (se estiver sendo trocado ou removido) — só apagado do
  // Drive depois de confirmar que o novo estado foi salvo.
  const existingEvent = id ? findEvent(id) : null;
  const existingPlay = existingEvent && existingEvent.playId ? findPlay(existingEvent.playId) : null;
  const oldLogo = existingPlay ? existingPlay.logo : null;
  const ok = await mutate(s=>{
    // An event and its show are the same thing — every event automatically
    // has a matching play in Planejamento por Peça, no separate step or choice.
    if(id){
      const e = findEvent(id);
      e.title=title; e.startDate=startDate; e.endDate=endDate; e.location=location; e.notes=notes; e.participantIds=participantIds;
      if(e.playId){
        const p = findPlay(e.playId);
        if(p){ p.name = title; p.logo = poster; } // keep the show's name and poster in sync with the event
      } else {
        const newPlayId = nextId(s.plays);
        s.plays.push({ id:newPlayId, name:title, logo:poster, castLabels:{cast1:'Elenco 1', cast2:'Elenco 2'}, characters:[] });
        e.playId = newPlayId;
      }
    } else {
      const newPlayId = nextId(s.plays);
      s.plays.push({ id:newPlayId, name:title, logo:poster, castLabels:{cast1:'Elenco 1', cast2:'Elenco 2'}, characters:[] });
      s.events.push({ id:nextId(s.events), title, startDate, endDate, location, notes, playId:newPlayId, participantIds });
    }
  });
  if(ok && oldLogo && oldLogo !== poster) apiDeleteImages([oldLogo]);
  window.__evPoster = null;
  closeModal();
  toast(t('toast_saved'));
}

function playStats(play){
  let items=0, pending=0, shareable=0;
  play.characters.forEach(c=>c.items.forEach(it=>{
    if(it.isGroupHeader) return;
    items++;
    if(it.purchaseStatus === 'pending' || it.purchaseStatus === '') pending++;
    if(it.shareable === 'yes' || it.shareable === 'partial'){
      // Count total shareable UNITS needed, not rows — a row with qty:3 needs
      // to add 3 here, not 1, otherwise this stat drifts from the real demand
      // used by the stock-deficit engine once quantities are set per item.
      const qty = (it.qty===undefined || it.qty===null) ? 1 : (Number(it.qty)||0);
      shareable += qty;
    }
  }));
  return { items, pending, shareable, characters: play.characters.length };
}
