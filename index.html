      <div>
        <div class="item-name">${esc(it.name)}</div>
        ${invLinked ? `<div class="link-tag">${ICON.link} ${esc(invLinked.name)} <button class="btn btn-ghost" style="padding:0 4px; font-size:.7rem;" onclick="unlinkInventory(${play.id},${ch.id},${it.id})">${esc(t('unlink'))}</button></div>`
          : `<div class="link-tag" onclick="openLinkInventoryModal(${play.id},${ch.id},${it.id})">${ICON.link} ${esc(t('link_inventory'))}</div>`}
        ${showDeficitWarning ? (deficit.deficit>0
          ? `<div class="row-stock-warning" title="${esc(t('stock_used_in'))}: ${esc(deficit.contributors.map(c=>`${c.playName} · ${c.characterName}`).join(', '))}">⚠️ ${esc(t('stock_row_warning'))}: ${deficit.deficit} (${esc(t('stock_needs'))} ${deficit.demand}, ${esc(t('stock_has'))} ${deficit.available})</div>`
          : `<div class="row-stock-warning caution" title="${esc(t('stock_saved_by_shareable'))}">ℹ️ ${esc(t('stock_caution_short'))}</div>`
        ) : ''}
      </div>
      <div>
        <span class="col-label">${esc(t('col_qty'))}</span>
        <input type="number" min="0" title="${esc(t('col_qty'))}" value="${qtyVal}" style="width:100%;"
          onchange="updateCostumeField(${play.id},${ch.id},${it.id},'qty',parseInt(this.value,10)||0)">
      </div>
      <div>
        <span class="col-label">${esc(t('col_shareable'))}</span>
        <select class="inline-select" title="${esc(t('col_shareable'))}" style="width:100%;" onchange="updateCostumeField(${play.id},${ch.id},${it.id},'shareable',this.value)">
          ${selectOptions([['','—'],['yes',t('shareable_yes')],['no',t('shareable_no')],['partial',t('shareable_partial')],['tryon',t('shareable_tryon')]], it.shareable)}
        </select>
      </div>
      <div>
        <span class="col-label">${esc(t('col_source'))}</span>
        <input type="text" title="${esc(t('col_source'))}" value="${esc(it.source)}" placeholder="${esc(t('source_placeholder'))}"
          onchange="updateCostumeField(${play.id},${ch.id},${it.id},'source',this.value)">
      </div>
      <div>
        <span class="col-label">${esc(t('col_purchase'))}</span>
        <select class="inline-select" title="${esc(t('col_purchase'))}" style="width:100%;" onchange="updateCostumeField(${play.id},${ch.id},${it.id},'purchaseStatus',this.value)">
          ${selectOptions([['','—'],['pending',t('check_pending')],['done',t('check_done')]], it.purchaseStatus)}
        </select>
      </div>
      <div>
        <span class="col-label">${esc(t('col_arrived'))}</span>
        <select class="inline-select" title="${esc(t('col_arrived'))+' — '+t('progress_hint')}" style="width:100%;" onchange="updateCostumeField(${play.id},${ch.id},${it.id},'arrived',this.value)">
          ${selectOptions([['','—'],['pending',t('check_pending')],['partial',t('check_partial')],['done',t('check_done')]], it.arrived)}
        </select>
      </div>
      <button class="btn btn-icon btn-ghost btn-sm" onclick="deleteCostumeItem(${play.id},${ch.id},${it.id})">${ICON.trash}</button>
    </div>`;
  }).join('');

  return `
    <div class="card" style="padding:20px; margin-bottom:16px;">
      <div class="flex-between mb-8">
        <h3 style="font-size:1.3rem;">${esc(ch.name)}</h3>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-sm btn-ghost" onclick="openCharacterModal(${play.id}, ${ch.id})">${ICON.edit} ${esc(t('edit'))}</button>
          <button class="btn btn-sm btn-danger" onclick="deleteCharacter(${play.id},${ch.id})">${ICON.trash} ${esc(t('delete'))}</button>
        </div>
      </div>
      <div class="field-row">
        ${castChips('cast1')}
        ${castChips('cast2')}
      </div>
    </div>
    <div class="card" style="padding:0;">
      <div class="planner-toolbar" style="padding:16px 16px 0;">
        <h4 style="font-size:1rem;">${esc(t('costume_items'))}</h4>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-sm" onclick="addCostumeItem(${play.id},${ch.id},true)">${ICON.plus}${esc(t('item_add_header'))}</button>
          <button class="btn btn-sm btn-primary" onclick="addCostumeItem(${play.id},${ch.id},false)">${ICON.plus}${esc(t('item_add'))}</button>
        </div>
      </div>
      <div style="padding: 4px 0 8px;">
        ${ch.items.length ? `
        <div class="costume-row costume-col-heads">
          <span>${esc(t('col_item'))}</span>
          <span>${esc(t('col_qty'))}</span>
          <span>${esc(t('col_shareable'))}</span>
          <span>${esc(t('col_source'))}</span>
          <span>${esc(t('col_purchase'))}</span>
          <span>${esc(t('col_arrived'))}</span>
          <span></span>
        </div>` : ''}
        ${ch.items.length ? itemRows : `<p class="small muted" style="padding:16px;">${esc(t('no_items_yet'))}</p>`}
      </div>
    </div>
  `;
}

function updateCostumeField(playId, chId, itemId, field, value){
  mutate(s=>{
    const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
    const it = ch.items.find(i=>i.id===itemId);
    it[field] = value;
  });
}
function addCostumeItem(playId, chId, isHeader){
  mutate(s=>{
    const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
    const id = nextId(ch.items);
    if(isHeader){
      ch.items.push({ id, name: t('group_header_placeholder'), isGroupHeader:true, shareable:'', source:'', purchaseStatus:'', arrived:'', rawImported:null, inventoryItemId:null });
    } else {
      ch.items.push({ id, name: t('col_item'), isGroupHeader:false, qty:1, shareable:'', source:'', purchaseStatus:'', arrived:'', rawImported:null, inventoryItemId:null });
    }
  });
  toast(t('toast_saved'));
}
function deleteCostumeItem(playId, chId, itemId){
  confirmAction(t('delete_item_confirm'), ()=>{
    mutate(s=>{
      const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
      ch.items = ch.items.filter(i=>i.id!==itemId);
    });
    closeModal();
  });
}
function unlinkInventory(playId, chId, itemId){
  mutate(s=>{
    const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
    const it = ch.items.find(i=>i.id===itemId);
    it.inventoryItemId = null;
  });
}
function openLinkInventoryModal(playId, chId, itemId){
  openModal(`
    <div class="modal-head"><h3>${esc(t('pick_inventory_item'))}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <input type="search" placeholder="${esc(t('search_placeholder'))}" id="linkInvSearch" oninput="filterLinkInvList(this.value)">
    <div id="linkInvList" style="max-height:340px; overflow-y:auto; margin-top:12px; display:flex; flex-direction:column; gap:6px;"></div>
  `, {wide:true});
  window.__linkCtx = { playId, chId, itemId };
  filterLinkInvList('');
}
function filterLinkInvList(q){
  const list = state.inventory.filter(i=>!q || (i.name+' '+i.notes).toLowerCase().includes(q.toLowerCase())).slice(0,60);
  const html = list.map(i=>{
    const img = i.images && i.images[0] ? i.images[0] : null;
    return `<button class="btn" style="justify-content:flex-start; text-align:left; width:100%;" onclick="chooseLinkInventory(${i.id})">
      ${img ? `<img src="${img}" style="width:32px;height:32px;object-fit:cover;border-radius:6px;">` : ''}
      <span>${esc(i.name)} <span class="muted small">· ${esc(i.section)}</span></span>
    </button>`;
  }).join('');
  const box = document.getElementById('linkInvList');
  if(box) box.innerHTML = html || `<p class="small muted">${esc(t('no_inventory'))}</p>`;
}
function chooseLinkInventory(invId){
  const { playId, chId, itemId } = window.__linkCtx;
  mutate(s=>{
    const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
    const it = ch.items.find(i=>i.id===itemId);
    it.inventoryItemId = invId;
    const invItem = findInvItem(invId);
    if(invItem){
      invItem.status = 'in-use';
      const ev = state.events.find(e=>e.playId===playId);
      if(ev) invItem.assignedEventId = ev.id;
    }
  });
  closeModal();
  toast(t('toast_saved'));
}

function openCharacterModal(playId, chId){
  const play = findPlay(playId);
  const ch = chId ? play.characters.find(c=>c.id===chId) : { name:'', cast1:{count:'',names:[]}, cast2:{count:'',names:[]}, total:'' };
  openModal(`
    <div class="modal-head"><h3>${esc(chId?t('character_edit'):t('character_add'))}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="field"><label>${esc(t('field_charname'))}</label><input type="text" id="mChName" value="${esc(ch.name)}"></div>
    <div class="field"><label>${esc(t('total_label'))}</label><input type="text" id="mChTotal" value="${esc(ch.total||'')}"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${esc(t('cancel'))}</button>
      <button class="btn btn-primary" onclick="saveCharacterModal(${playId}, ${chId||'null'})">${esc(t('save'))}</button>
    </div>
  `);
}
function saveCharacterModal(playId, chId){
  const name = document.getElementById('mChName').value.trim();
  const total = document.getElementById('mChTotal').value.trim();
  if(!name) return;
  mutate(s=>{
    const play = findPlay(playId);
    if(chId){
      const ch = play.characters.find(c=>c.id===chId);
      ch.name = name; ch.total = total;
    } else {
      const id = nextId(play.characters);
      play.characters.push({ id, name, cast1:{count:'',names:[]}, cast2:{count:'',names:[]}, total, items:[] });
      activeCharacterId = id;
    }
  });
  closeModal();
  toast(t('toast_saved'));
}
function deleteCharacter(playId, chId){
  confirmAction(t('delete_character_confirm'), ()=>{
    mutate(s=>{
      const play = findPlay(playId);
      play.characters = play.characters.filter(c=>c.id!==chId);
      if(activeCharacterId === chId) activeCharacterId = play.characters.length ? play.characters[0].id : null;
    });
    closeModal();
  });
}
function removeCastMember(playId, chId, castKey, idx){
  mutate(s=>{
    const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
    ch[castKey].names.splice(idx,1);
  });
}
function openAddCastMemberModal(playId, chId, castKey){
  openModal(`
    <div class="modal-head"><h3>${esc(t('select_actor_add'))}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <input type="search" placeholder="${esc(t('search_placeholder'))}" id="castSearch" oninput="filterCastPickList(this.value)">
    <div id="castPickList" style="max-height:300px; overflow-y:auto; margin-top:12px; display:flex; flex-direction:column; gap:4px;"></div>
  `);
  window.__castCtx = { playId, chId, castKey };
  filterCastPickList('');
}
function filterCastPickList(q){
  const list = state.actors.filter(a=>!q || a.name.toLowerCase().includes(q.toLowerCase())).slice(0,80);
  const html = list.map(a=>`<button class="btn" style="justify-content:flex-start; width:100%;" onclick="chooseCastMember(${a.id})">${esc(a.name)} <span class="muted small">(${esc(a.castGroup)})</span></button>`).join('');
  const box = document.getElementById('castPickList');
  if(box) box.innerHTML = html || `<p class="small muted">${esc(t('no_actors'))}</p>`;
}
function chooseCastMember(actorId){
  const { playId, chId, castKey } = window.__castCtx;
  mutate(s=>{
    const play = findPlay(playId); const ch = play.characters.find(c=>c.id===chId);
    ch[castKey].names.push({ actorId, label: findActor(actorId).name });
  });
  closeModal();
}

/* =======================================================================
   GERENCIAR DADOS — modal com backup (baixar/restaurar um arquivo .json
   com todos os dados) e recarregar da planilha na hora.
======================================================================= */

function openDataManagerModal(){
  // Sem estado carregado ainda (site não configurado, ou falha ao carregar):
  // não há nada pra fazer backup de, nem como salvar uma restauração.
  if(!state){
    toast(t(apiConfigured() ? 'sync_error' : 'sync_offline'));
    return;
  }
  openModal(`
    <div class="modal-head"><h3>${esc(t('manage_data_title'))}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>

    <div class="field">
      <label>${esc(t('backup_section_title'))}</label>
      <p class="small muted mt-8">${esc(t('backup_section_desc'))}</p>
      <button class="btn mt-8" onclick="downloadBackup()">${ICON.download}${esc(t('backup_download_btn'))}</button>
    </div>

    <div class="field mt-16">
      <label>${esc(t('restore_section_title'))}</label>
      <p class="small muted mt-8">${esc(t('restore_section_desc'))}</p>
      <input type="file" accept="application/json,.json" id="restoreBackupInput" style="display:none" onchange="handleBackupFileSelected(this)">
      <button class="btn mt-8" onclick="document.getElementById('restoreBackupInput').click()">${ICON.upload}${esc(t('restore_choose_file_btn'))}</button>
    </div>

    <div class="field mt-16">
      <label>${esc(t('reload_section_title'))}</label>
      <p class="small muted mt-8">${esc(t('reload_section_desc'))}</p>
      <button class="btn mt-8" onclick="closeModal(); reloadFromSheet();">${ICON.undo}${esc(t('reload_section_btn'))}</button>
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">${esc(t('close'))}</button>
    </div>
  `);
}

// Baixa o estado atual como um arquivo .json — pode ser usado depois em
// "Restaurar backup" (nesta máquina ou em qualquer outra).
function downloadBackup(){
  try{
    const { lang, ...rest } = state;
    const payload = { __backstage_backup: true, exportedAt: new Date().toISOString(), state: rest };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'backstage_backup_' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }catch(e){ /* best effort — some preview sandboxes block downloads */ }
}

// Lê o arquivo escolhido, valida um mínimo de formato e pede confirmação
// antes de substituir tudo (ação destrutiva).
function handleBackupFileSelected(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ toast(t('toast_backup_invalid')); return; }
    const candidate = (parsed && parsed.__backstage_backup && parsed.state) ? parsed.state : parsed;
    if(!candidate || typeof candidate !== 'object' || !Array.isArray(candidate.actors) || !Array.isArray(candidate.inventory)){
      toast(t('toast_backup_invalid'));
      return;
    }
    closeModal();
    confirmAction(t('confirm_restore_backup_msg'), ()=>{ applyBackup(candidate); }, {
      title: t('restore_section_title'),
      confirmLabel: t('restore_confirm_btn'),
    });
  };
  reader.onerror = ()=>{ toast(t('toast_backup_invalid')); };
  reader.readAsText(file);
}

// Substitui o estado local pelo backup e salva na planilha (last-write-wins,
// como qualquer outra edição).
async function applyBackup(newState){
  const lang = state.lang;
  state = newState;
  state.lang = lang;
  if(!Array.isArray(state.archivedEvents)) state.archivedEvents = [];
  const ok = await commitAndSave();
  if(ok) toast(t('toast_backup_restored'));
}

// Busca o estado mais recente da planilha na hora, sem esperar o próximo
// ciclo automático (útil logo depois que alguém mexeu direto na planilha).
// Não é destrutivo: só troca o que está na tela pelo que já está salvo.
async function reloadFromSheet(){
  const lang = state.lang;
  setSyncStatus('saving');
  try{
    const fresh = await apiGet();
    state = fresh;
    state.lang = lang;
    if(!Array.isArray(state.archivedEvents)) state.archivedEvents = [];
    render();
    setSyncStatus('saved');
    toast(t('toast_reset'));
  }catch(e){ setSyncStatus('error'); toast(t('sync_error')); }
}

/* =======================================================================
   INIT
======================================================================= */
function showFullScreenMessage(title, body, opts){
  opts = opts || {};
  document.getElementById('app').innerHTML = `
    <div class="full-screen-msg">
      <h2>${esc(title)}</h2>
      <p>${esc(body)}</p>
      ${opts.retry ? `<button class="btn btn-primary" onclick="init()">${esc(t('retry'))}</button>` : ''}
    </div>`;
}

// Preenche o rótulo do botão "Gerenciar dados" e o indicador de sincronização
// já de cara — sem isso, enquanto o site não está configurado (ou antes do
// primeiro carregamento terminar), esses elementos ficam com o texto vazio:
// o indicador vira só uma bolinha solta e o botão fica sem legenda, com
// aparência quebrada/desalinhada.
function initTopbarChrome(){
  const lbl = document.getElementById('manageDataLabel');
  const btn = document.getElementById('manageDataBtn');
  if(lbl) lbl.textContent = t('manage_data');
  if(btn) btn.title = t('manage_data');
  syncLangButtons(uiLang);
}

// Enquanto não há state (não configurado, ou falha ao carregar), a única
// coisa na tela é uma destas duas mensagens de tela cheia. Guardamos qual
// delas está ativa pra poder re-desenhar no idioma certo se alguém trocar
// PT/EN nesse meio-tempo (setLang() chama isso quando state ainda é null).
let lastScreenState = 'loading';
function renderStaticScreen(){
  if(lastScreenState === 'config_missing'){
    showFullScreenMessage(t('config_missing_title'), t('config_missing_body'));
  } else if(lastScreenState === 'load_error'){
    showFullScreenMessage(t('loading_error_title'), t('loading_error_body'), { retry: true });
  }
}

async function init(){
  initTopbarChrome();
  if(!apiConfigured()){
    lastScreenState = 'config_missing';
    setSyncStatus('offline');
    renderStaticScreen();
    return;
  }
  setSyncStatus('offline');
  try{
    state = await loadState();
    lastScreenState = 'ready';
    render();
    setSyncStatus('saved');
    startPolling();
  }catch(e){
    lastScreenState = 'load_error';
    setSyncStatus('error');
    renderStaticScreen();
  }
}
init();

</script>
